<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>종베 기록</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--line:#e4e2dc;--text:#1f1e1b;--sub:#6b6a64;--muted:#9a988f;--accent:#1f5fae;--accentBg:#e6f0fb;--up:#ff0000;--down:#0000ff;--warn:#7a4a06;--warnBg:#faeeda;--ok:#2f6b12;--bad:#a32d2d;--chip:#f1efe8}
@media (prefers-color-scheme:dark){:root{--bg:#151513;--card:#1f1f1c;--line:#34332f;--text:#ecebe6;--sub:#b3b1a8;--muted:#86847c;--accent:#85b7eb;--accentBg:#0c2c4f;--up:#ff4d4d;--down:#6b7dff;--warn:#fac775;--warnBg:#412402;--ok:#97c459;--bad:#f09595;--chip:#2c2c2a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
.wrap{max-width:480px;margin:0 auto;padding:12px 12px 32px}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{flex:1;padding:8px 0;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--sub);font:inherit}
.tabs button.on{background:var(--accentBg);color:var(--accent);border-color:transparent;font-weight:600}
.head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.head h1{font-size:18px;margin:0}
select{font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:4px 6px}
.status{font-size:12px;color:var(--muted);margin:4px 0 12px}
.badge{font-size:12px;padding:2px 8px;border-radius:6px;background:var(--warnBg);color:var(--warn)}
.label{font-size:12px;color:var(--sub);margin:14px 0 6px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.metric{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 4px;text-align:center}
.metric .k{font-size:11px;color:var(--sub)}.metric .v{font-size:16px;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.card.cand{border:2px solid var(--accent)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 8px}
.chip{font-size:12px;padding:2px 8px;border-radius:6px;background:var(--chip)}
.note{font-size:12px;padding:6px 8px;border-radius:6px;background:var(--warnBg);color:var(--warn);margin-top:6px}
.up{color:var(--up)}.down{color:var(--down)}.muted{color:var(--muted)}.sub{color:var(--sub)}.ok{color:var(--ok);font-weight:600}.bad{color:var(--bad);font-weight:600}.acc{color:var(--accent);font-weight:600}
.list{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 12px}
.list .row:first-child{border-top:0}
label.chk{display:flex;gap:8px;align-items:center;padding:4px 0}
.foot{font-size:12px;color:var(--muted);text-align:center;margin-top:18px}
.empty{padding:24px 0;text-align:center;color:var(--muted)}
.axis,.bars,.vals{display:grid;gap:3px;align-items:center;text-align:center}
.axis{font-size:10px;color:var(--muted);margin:2px 0 2px}
.vals{font-size:10px;color:var(--sub);margin-top:2px}
.bar{height:40px;position:relative}
.bar .mid{position:absolute;left:0;right:0;top:50%;border-top:1px solid var(--line)}
.bar i{position:absolute;left:18%;right:18%;border-radius:2px}
.bar i.p{bottom:50%;background:var(--up)}.bar i.n{top:50%;background:var(--down)}
.flag.warn{background:var(--warnBg);color:var(--warn)}
.gapline{font-size:11px;color:var(--muted);margin-top:4px}
.secblk{padding:10px 0;border-top:1px solid var(--line)}
.flag{font-size:11px;padding:1px 6px;border-radius:5px;background:var(--accentBg);color:var(--accent);margin-left:4px}
details summary{cursor:pointer;color:var(--sub);font-size:12px;padding:8px 0}
@media (min-width:860px){.wrap{max-width:960px}.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}}
</style>
</head>
<body>
<div class="wrap">
  <div class="tabs">
    <button data-tab="live">장중</button>
    <button data-tab="close" class="on">마감</button>
    <button data-tab="verify">검증</button>
  </div>
  <section id="live" hidden><div class="empty">장중 페이지는 다음 단계에서 만듭니다</div></section>
  <section id="close"><div class="empty">불러오는 중</div></section>
  <section id="verify" hidden><div class="empty">검증 페이지는 표본이 쌓인 뒤 만듭니다</div></section>
</div>
<script>
const WD = '일월화수목금토';
const arr = x => Array.isArray(x) ? x : (x && Array.isArray(x.value) ? x.value : (x == null ? [] : [x]));
const num = s => { const v = parseFloat(String(s ?? '').replace(/,/g, '')); return isNaN(v) ? null : v; };
const has = s => s !== undefined && s !== null && String(s).trim() !== '';
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined && text !== null) e.textContent = text; return e; }
function add(parent, ...kids) { kids.forEach(k => { if (k) parent.appendChild(k); }); return parent; }
function pctEl(s) {
  const v = num(s);
  if (v === null) return el('span', 'muted', '—');
  return el('span', v > 0 ? 'up' : (v < 0 ? 'down' : ''), (v > 0 ? '+' : '') + v.toFixed(2) + '%');
}
function shortTime(s) {
  if (!has(s)) return '—';
  const today = new Date(); const pad = n => String(n).padStart(2, '0');
  const t = `${today.getFullYear()}-${pad(today.getMonth() + 1)}-${pad(today.getDate())}`;
  return s.startsWith(t) ? s.slice(11, 16) : s.slice(5, 16).replace('-', '/');
}
async function getJson(path) {
  const res = await fetch(path + '?t=' + Date.now());
  if (!res.ok) throw new Error(path + ' ' + res.status);
  return res.json();
}

function renderClose(d, dates) {
  const box = document.getElementById('close'); box.innerHTML = '';
  const g = d.gate1 || {};
  const ymd = String(d.date || '');
  const wd = has(g['요일']) ? g['요일'] : WD[new Date(+ymd.slice(0, 4), +ymd.slice(4, 6) - 1, +ymd.slice(6, 8)).getDay()];

  const head = el('div', 'head');
  const left = el('div');
  add(left, el('h1', null, `${+ymd.slice(4, 6)}/${+ymd.slice(6, 8)} (${wd}) ${String(d.at).slice(0, 2)}:${String(d.at).slice(2)} 판정`));
  const right = el('div'); right.style.display = 'flex'; right.style.gap = '6px'; right.style.alignItems = 'center';
  if (has(g['비고'])) add(right, el('span', 'badge', g['비고']));
  if (dates.length > 1) {
    const sel = el('select');
    dates.forEach(x => { const o = el('option', null, `${+x.slice(4, 6)}/${+x.slice(6, 8)}`); o.value = x; if (x === ymd) o.selected = true; sel.appendChild(o); });
    sel.onchange = () => loadDate(sel.value, dates);
    add(right, sel);
  }
  add(box, add(head, left, right));

  const st = d.status || {};
  const pushOk = String(st.push || '').includes('OK');
  const status = el('div', 'status');
  add(status, el('span', null, `수집 ${shortTime(st['수집'])} · OCR 경고 ${st['OCR경고오늘'] ?? '—'} · push `),
    el('span', pushOk ? 'ok' : 'bad', has(st.push) ? shortTime(st.push) + (pushOk ? '' : ' 확인') : '—'));
  add(box, status);

  const cols = el('div', 'cols'); const c1 = el('div'); const c2 = el('div'); add(box, add(cols, c1, c2));

  const gl = el('div', 'label');
  add(gl, el('span', null, '관문1 오늘 할 장인가 '), el('span', g['관문1'] === '통과' ? 'ok' : 'bad', g['관문1'] || '—'));
  if (has(g['걸린조건'])) add(gl, el('span', 'sub', ' · ' + g['걸린조건']));
  add(c1, gl);
  const m4 = el('div', 'grid4');
  [['상한가', g['상한가'], ''], ['상승비율', g['상승비율%'], '%'], ['B트랙', g['B트랙수'], '개'], ['B비중', g['B비중%'], '%']].forEach(([k, v, u]) => {
    const m = el('div', 'metric'); add(m, el('div', 'k', k), el('div', 'v', has(v) ? v + u : '—')); m4.appendChild(m);
  });
  add(c1, m4);

  const judge = arr(d.judge1520);
  const stockMap = {}; arr(d.stocks).forEach(s => { stockMap[s['섹터명']] = arr(s['종목']); });
  const resMap = {}; arr(d.result).forEach(r => { resMap[r['섹터'] + '|' + r['종목']] = r; });
  const inqMap = {}; arr(d.inq).forEach(r => { inqMap[String(r['코드'])] = r['조회순위']; });
  const cands = judge.filter(r => r['판정'] === '후보');

  add(c1, el('div', 'label', cands.length ? '종베 후보' : '종베 후보 — 없음'));
  const roles = ['대장', '2등', '3등', '4등'];
  cands.forEach(r => {
    const card = el('div', 'card cand');
    const top = el('div', 'head');
    add(top, el('strong', null, r['섹터명']), el('span', 'badge', '후보 · 어종'));
    top.lastChild.style.background = 'var(--accentBg)'; top.lastChild.style.color = 'var(--accent)';
    add(card, top);
    const chips = el('div', 'chips');
    [['집중도', r['집중도%'], '%'], ['모멘텀', r['모멘텀'], ''], ['2따', r['2따스코어'], ''], ['유입', r['유입패턴'], ''], ['대장견인', r['대장견인'], ''], ['연속', r['연속'], '']]
      .forEach(([k, v, u]) => { if (has(v)) chips.appendChild(el('span', 'chip', `${k} ${v}${u}`)); });
    add(card, chips);
    const rows = stockMap[r['섹터명']] || [];
    let filled = 0;
    rows.forEach((s, i) => {
      const row = el('div', 'row');
      const nm = el('span'); add(nm, el('span', 'sub', (roles[i] || '') + ' '), el('span', s['종목명'] === r['대장'] ? 'acc' : null, s['종목명']));
      if (has(inqMap[String(s['종목코드'])])) add(nm, el('span', 'flag', '조회 ' + inqMap[String(s['종목코드'])] + '위'));
      const rt = el('span'); add(rt, el('span', null, (s['누적억'] || '—') + '억 '), pctEl(s['등락률']));
      const res = resMap[r['섹터명'] + '|' + s['종목명']];
      if (res && has(res['D1종가%'])) { filled++; add(rt, el('span', 'sub', ' → D+1 '), pctEl(res['D1종가%'])); }
      add(card, add(row, nm, rt));
    });
    if (!rows.length) add(card, el('div', 'muted', '종목 표 없음 (stock_delta 확인)'));
    if (r['괴리'] === 'Y' && rows.length) {
      const hi = rows.slice().sort((a, b) => (num(b['등락률']) ?? -999) - (num(a['등락률']) ?? -999))[0];
      add(card, el('div', 'note', `괴리 — 등락 1위 ${hi['종목명']} ${hi['등락률']}%. 거래대금 1위를 대장으로, 차트로 확인`));
    }
    if (rows.length && !filled) add(card, el('div', 'muted', 'D+1 결과는 다음 거래일 20:05 이후'));
    add(c1, card);
  });

  const j14 = arr(d.judge1400);
  if (j14.length) {
    const c14 = j14.filter(r => r['판정'] === '후보').map(r => r['섹터명']);
    const same = c14.join() === cands.map(r => r['섹터명']).join();
    add(c1, el('div', 'status', `14:00 후보 : ${c14.length ? c14.join(', ') : '없음'} ${same ? '(15:20 과 같음)' : '(15:20 과 다름)'}`));
  }

  add(c2, el('div', 'label', '섹터 판정'));
  const list = el('div', 'list');
  judge.slice().sort((a, b) => (num(b['집중도%']) ?? 0) - (num(a['집중도%']) ?? 0)).forEach(r => {
    const row = el('div', 'row');
    const nm = el('span'); add(nm, el('span', null, r['섹터명'] + ' '), el('span', 'muted', has(r['집중도%']) ? r['집중도%'] + '%' : ''));
    const rt = el('span', 'sub', `모멘텀 ${r['모멘텀'] ?? '—'} · 2따 ${r['2따스코어'] ?? '—'} · `);
    add(rt, el('span', r['판정'] === '후보' ? 'acc' : null, r['판정'] || '—'));
    add(list, add(row, nm, rt));
  });
  add(c2, list);

  add(c2, el('div', 'label', '관문6 사람 판단'));
  const chk = el('div', 'card');
  ['3레벨 뉴스인가, 재료 살아있나', '악재 없나', '내일 이벤트 (홀짝 배제)', '괴리 캡처 확인', '재료 D-day 가 언제인가'].forEach(t => {
    const lb = el('label', 'chk'); const cb = el('input'); cb.type = 'checkbox'; add(lb, cb, el('span', null, t)); chk.appendChild(lb);
  });
  add(c2, chk);

  add(box, el('div', 'foot', `검증 기간 — 기록만, 매매 안 함 · 관문1 표본 ${g['표본일수'] || '—'}일 · 생성 ${d.generated || '—'}`));
}

function tLabel(t) { t = String(t); return t.slice(2) === '00' ? (+t.slice(0, 2)) + '시' : (+t.slice(0, 2)) + ':' + t.slice(2); }

function renderLive(d) {
  const box = document.getElementById('live'); box.innerHTML = '';
  const ymd = String(d.date || '');
  const g = d.gate1 || {};
  const wd = has(g['요일']) ? g['요일'] : WD[new Date(+ymd.slice(0, 4), +ymd.slice(4, 6) - 1, +ymd.slice(6, 8)).getDay()];
  add(box, el('h1', null, `${+ymd.slice(4, 6)}/${+ymd.slice(6, 8)} (${wd}) 하루 흐름`));
  box.lastChild.style.fontSize = '18px'; box.lastChild.style.margin = '0';
  add(box, el('div', 'status', '15:20 까지 · 관찰 전용, 후보는 마감 탭 · 장중 매시간 갱신은 다음 단계'));

  const flow = arr(d.sectorFlow).filter(r => r['섹터명'] !== '개별이슈');
  const cols = el('div', 'cols'); const c1 = el('div'); const c2 = el('div'); add(box, add(cols, c1, c2));

  add(c1, el('div', 'label', '섹터 모멘텀 흐름 (구간 유입 비중 − 누적 비중, %p)'));
  if (!flow.length) { add(c1, el('div', 'empty', '섹터 증분 기록 없음')); }
  else {
    const times = [...new Set(flow.map(r => String(r['시각'])))].sort();
    const lastT = times[times.length - 1];
    const gridCols = `repeat(${times.length}, minmax(0,1fr))`;
    const bySec = {}; const dupAt = {};
    flow.forEach(r => {
      const n = r['섹터명'], t = String(r['시각']);
      const m = (bySec[n] = bySec[n] || {});
      if (m[t]) {
        (dupAt[n] = dupAt[n] || []).push(t);
        if ((num(r['섹터누적억']) ?? 0) <= (num(m[t]['섹터누적억']) ?? 0)) return;
      }
      m[t] = r;
    });
    const maxAbs = Math.max(0.5, ...flow.map(r => Math.abs(num(r['모멘텀']) ?? 0)));
    const byConc = (a, b) => (num((bySec[b][lastT] || {})['집중도%']) ?? -1) - (num((bySec[a][lastT] || {})['집중도%']) ?? -1);
    const liveNames = Object.keys(bySec).filter(n => bySec[n][lastT]).sort(byConc);
    const goneNames = Object.keys(bySec).filter(n => !bySec[n][lastT]);
    const mkAxis = () => { const ax = el('div', 'axis'); ax.style.gridTemplateColumns = gridCols; times.forEach(t => ax.appendChild(el('span', null, tLabel(t)))); return ax; };
    const stockMapL = {}; arr(d.stocks).forEach(s => { stockMapL[s['섹터명']] = arr(s['종목']); });
    const mkBlk = n => {
      const present = times.map(t => bySec[n][t]).filter(Boolean);
      const last = present[present.length - 1];
      const lm = num(last['모멘텀']);
      const posN = present.filter(r => (num(r['모멘텀']) ?? 0) > 0).length;
      const blk = el('div', 'secblk');
      const top = el('div', 'head');
      const nm = el('span'); add(nm, el('strong', null, n + ' '), el('span', 'muted', has(last['집중도%']) ? last['집중도%'] + '%' : ''));
      if (dupAt[n]) add(nm, el('span', 'flag', '카드 2장 ' + [...new Set(dupAt[n])].map(tLabel).join(',')));
      const gapNow = bySec[n][lastT] && bySec[n][lastT]['괴리'] === 'Y';
      if (gapNow) add(nm, el('span', 'flag warn', '괴리'));
      let tag = '—', cls = 'sub';
      if (!bySec[n][lastT]) { tag = tLabel(last['시각']) + ' 이후 없음'; cls = 'muted'; }
      else if (lm !== null && lm > 0) { tag = `가속 · 양수 ${posN}/${present.length}`; cls = 'up'; }
      else if (lm !== null && lm < 0) { tag = `감속 · 양수 ${posN}/${present.length}`; cls = 'down'; }
      add(top, nm, el('span', cls, tag));
      add(blk, top);
      const bars = el('div', 'bars'); bars.style.gridTemplateColumns = gridCols;
      const vals = el('div', 'vals'); vals.style.gridTemplateColumns = gridCols;
      times.forEach(t => {
        const r = bySec[n][t]; const v = r ? num(r['모멘텀']) : null;
        const b = el('div', 'bar'); add(b, el('span', 'mid'));
        if (v !== null && v !== 0) { const bar = el('i', v > 0 ? 'p' : 'n'); bar.style.height = Math.max(2, Math.round(Math.abs(v) / maxAbs * 19)) + 'px'; b.appendChild(bar); }
        bars.appendChild(b);
        const v1 = v === null ? null : Math.round(v * 10) / 10;
        vals.appendChild(el('span', null, v1 === null ? '' : (v1 === 0 ? '0.0' : (v1 > 0 ? '+' : '') + v1.toFixed(1))));
      });
      add(blk, bars, vals);
      if (gapNow) {
        const hiL = (stockMapL[n] || []).slice().sort((a, b) => (num(b['등락률']) ?? -999) - (num(a['등락률']) ?? -999))[0];
        add(blk, el('div', 'gapline', `괴리 : 대금 1위 ${bySec[n][lastT]['거래대금1위'] || '—'}` + (hiL ? ` / 등락 1위 ${hiL['종목명']} ${hiL['등락률']}%` : '')));
      }
      return blk;
    };
    const list = el('div', 'card');
    add(list, mkAxis());
    liveNames.forEach(n => list.appendChild(mkBlk(n)));
    add(c1, list);
    if (goneNames.length) {
      const det = el('details'); add(det, el('summary', null, `${tLabel(lastT)} 에 없는 카드 ${goneNames.length}개 (테마 종료 · 이름 바뀜 · 오독)`));
      const list4 = el('div', 'card'); add(list4, mkAxis());
      goneNames.forEach(n => list4.appendChild(mkBlk(n)));
      add(det, list4); add(c1, det);
    }
  }

  const inq = arr(d.inq).slice().sort((a, b) => (num(a['조회순위']) ?? 99) - (num(b['조회순위']) ?? 99));
  add(c2, el('div', 'label', '조회순위 해답지' + (has(d.inqTime) ? ` (${tLabel(d.inqTime)} 키움 실시간 조회 20위)` : '')));
  if (!inq.length) { add(c2, el('div', 'empty', '이날은 조회순위 수집 전 (9/11 부터)')); }
  else {
    const outs = inq.filter(r => !has(r['거래대금순위']));
    add(c2, el('div', 'status', `20위 중 거래대금 100위 밖 ${outs.length}개` + (outs.length ? ' : ' + outs.map(r => r['종목명']).join(' · ') : '')));
    const mkRow = r => {
      const row = el('div', 'row');
      const nm = el('span'); add(nm, el('span', 'sub', r['조회순위'] + '. '), el('span', null, r['종목명']));
      if (r['구분'] === 'ETF') add(nm, el('span', 'muted', ' ETF'));
      const rk = num(r['거래대금순위']);
      if ((num(r['조회순위']) ?? 99) <= 5 && (rk === null || rk > 20)) add(nm, el('span', 'flag', '선행'));
      const rt = el('span'); add(rt, pctEl(r['등락률']), el('span', 'sub', rk === null ? ' · 대금 100위 밖' : ` · 대금 ${rk}위`));
      return add(row, nm, rt);
    };
    const list2 = el('div', 'list');
    inq.slice(0, 10).forEach(r => list2.appendChild(mkRow(r)));
    add(c2, list2);
    if (inq.length > 10) {
      const det = el('details'); add(det, el('summary', null, `11~${inq.length}위 보기`));
      const list3 = el('div', 'list'); inq.slice(10).forEach(r => list3.appendChild(mkRow(r)));
      add(det, list3); add(c2, det);
    }
    add(c2, el('div', 'status', '선행 = 조회 5위 안 + 거래대금 20위 밖 (인계문서 4절 정의). 관찰 표시일 뿐 판정에 안 쓴다'));
  }
  add(box, el('div', 'foot', `관찰 전용 — 9~10시는 보기만 · 생성 ${d.generated || '—'}`));
}

async function loadDate(ymd, dates) {
  let d;
  try { d = await getJson(ymd ? `data/${ymd}.json` : 'data/latest.json'); }
  catch (e) { ['close', 'live'].forEach(id => { const b = document.getElementById(id); b.innerHTML = ''; add(b, el('div', 'empty', '데이터를 못 불러왔습니다 : ' + e.message)); }); return; }
  try { renderClose(d, dates); } catch (e) { add(document.getElementById('close'), el('div', 'empty', '마감 화면 오류 : ' + e.message)); }
  try { renderLive(d); } catch (e) { add(document.getElementById('live'), el('div', 'empty', '장중 화면 오류 : ' + e.message)); }
}

document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => {
  document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x === b));
  ['live', 'close', 'verify'].forEach(id => { document.getElementById(id).hidden = id !== b.dataset.tab; });
});

(async () => {
  let dates = [];
  try { dates = arr((await getJson('data/dates.json')).dates); } catch (e) { }
  loadDate(null, dates);
})();
</script>
