<!-- 9/13 : 폰 홈 화면에 앱처럼 추가 -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#7a0c17" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#3e0710" media="(prefers-color-scheme: dark)">
<script>
/* 9/27 다크전환 (사용자 결정) : 화면 모드 = 이 폰 브라우저에 기억한 값(localStorage 'stock-report.theme' — 제목 줄 오른쪽 버튼이 적는다), 고른 적 없으면 폰 설정.
   첫 그림 전에 <html data-theme> 를 정해 흰 화면이 번쩍이지 않게. 다크 색은 아래 :root[data-theme="dark"] 한 곳. (설명서 manual.html 은 11/7 · 로드맵 roadmap.html 은 11/12 사용자 결정으로 지움) */
var THEME_KEY = 'stock-report.theme';
function savedTheme() { try { var t = localStorage.getItem(THEME_KEY); return t === 'dark' || t === 'light' ? t : null; } catch (e) { return null; } }
function systemTheme() { try { return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; } catch (e) { return 'light'; } }
function applyTheme(t, save) {
  document.documentElement.setAttribute('data-theme', t);
  var m = document.querySelectorAll('meta[name="theme-color"]');   // 폰 상태 표시줄 색 = --heroA (두 줄 다 같은 값이라 폰 설정과 무관하게 맞는다)
  for (var i = 0; i < m.length; i++) m[i].setAttribute('content', t === 'dark' ? '#3e0710' : '#7a0c17');
  var b = document.getElementById('themeBtn');   // 처음 부를 땐 버튼이 아직 없다 — 본문 스크립트가 한 번 더 부른다
  if (b) b.setAttribute('aria-label', t === 'dark' ? '밝은 화면으로 바꾸기' : '다크 화면으로 바꾸기');
  if (save) { try { localStorage.setItem(THEME_KEY, t); } catch (e) { } }
}
applyTheme(savedTheme() || systemTheme(), false);
try {   // 고른 적 없을 때만 폰 설정이 바뀌면 따라간다
  var THEME_MQ = window.matchMedia('(prefers-color-scheme: dark)');
  var onSystemTheme = function () { if (!savedTheme()) applyTheme(THEME_MQ.matches ? 'dark' : 'light', false); };
  if (THEME_MQ.addEventListener) THEME_MQ.addEventListener('change', onSystemTheme); else THEME_MQ.addListener(onSystemTheme);
} catch (e) { }
// 다른 창(홈 화면 앱 · 브라우저 탭)에서 바꿨거나 뒤로 가기 캐시에서 되살아나면 기억한 값으로 다시 맞춘다
window.addEventListener('storage', function (e) { if (e.key === THEME_KEY) applyTheme(savedTheme() || systemTheme(), false); });
window.addEventListener('pageshow', function (e) { if (e.persisted) applyTheme(savedTheme() || systemTheme(), false); });
</script>

<style>
/* 9/13 빨강 톤 통일 — 기준 화면 D:\stock\close_mockup_red.html · review_mockup4.html
   꾸밈 = 와인·크림슨·연분홍 / 데이터 = HTS 원색(상승·대장·누적 1위 빨강, 하락 파랑) / 주의 = 주황 */
:root{
  --bg:#fbf5f4;--card:#fff;--card2:#fcf7f7;--soft:#fbf7f7;--line:#f0dfdf;--line2:#f3e6e6;--rule:#ecd9d9;
  --text:#231416;--ink2:#5b3a3d;--sub:#7b6264;--muted:#a98f91;--muted2:#bda3a4;--chip:#f5eded;--chipInk:#5b4447;
  --brand:#c1121f;--wine:#6e0b14;--wineFill:#6e0b14;--rose:#fdecee;--roseLine:#f6ccd1;--roseDash:#e79ba1;--cocoa:#332123;--onFill:#fff;
  --naBg:#efe7e7;--naInk:#9a8a8b;--noteBg:#fff9f9;--noteLine:#e6cccd;
  --meterTrack:#f6dada;--lossTrack:#f3e7e7;--lossFill:#c9a3a5;--barTrack:#f6e4e4;--barA:#a10f1b;--barB:#e5383b;--okRail:#f0b3b8;
  --up:#ff0000;--down:#0000ff;--r1Bg:#ffe3e3;
  --warn:#7a4a06;--warnBg:#faeeda;--warnLine:#ecd3a8;--alert:#b45309;--ok:#2f6b12;--bad:#c1121f;
  --shadow:0 2px 10px rgba(110,11,20,.05);
  --heroA:#7a0c17;--heroFade:rgba(122,12,23,0);--heroB:#c1121f;--heroC:#e5383b;--heroShadow:0 6px 18px rgba(122,12,23,.18);
  --ixM1:#d9480f;--ixM2:#1098ad;--ixM3:#9c36b5;   /* 9/17 지수차트 이평 20·60·120 — 밝은·어두운 카드 배경 둘 다 색각 분리 검증 통과한 값이라 다크에서도 같은 값 */
}
/* 9/27 다크전환 : 옛 @media (prefers-color-scheme:dark) 를 data-theme 한 곳으로 — 폰 설정은 <head> 첫 스크립트가 data-theme 로 옮긴다 (값은 그대로) */
:root[data-theme="dark"]{
  color-scheme:dark;   /* 날짜 목록 창 · 체크박스 · 스크롤바 같은 브라우저 기본 부품도 어둡게 (9/27 사용자 결정 — 옛 판은 폰 다크여도 흰 바탕) */
  --bg:#140b0d;--card:#1f1215;--card2:#26171b;--soft:#23151a;--line:#3a2529;--line2:#33222a;--rule:#3a2529;
  --text:#f4e8e9;--ink2:#dcc3c6;--sub:#b39699;--muted:#8c7275;--muted2:#75606a;--chip:#2c1c20;--chipInk:#dcc3c6;
  --brand:#f04a56;--wine:#ffb3ba;--wineFill:#7d1320;--rose:#3a1a20;--roseLine:#5a2a32;--roseDash:#8a3a44;--cocoa:#44302f;--onFill:#fff;
  --naBg:#2c1f22;--naInk:#8c7275;--noteBg:#1f1215;--noteLine:#4a2e33;
  --meterTrack:#3a2226;--lossTrack:#33242a;--lossFill:#8c6468;--barTrack:#35211f;--barA:#b3202c;--barB:#f04a56;--okRail:#7a3a42;
  --up:#ff4d4d;--down:#6b7dff;--r1Bg:#4a1717;
  --warn:#fac775;--warnBg:#412402;--warnLine:#6a4a1a;--alert:#e08a3c;--ok:#97c459;--bad:#f09595;
  --shadow:0 2px 10px rgba(0,0,0,.35);
  --heroA:#3e0710;--heroFade:rgba(62,7,16,0);--heroB:#7a0c17;--heroC:#a81c28;--heroShadow:0 6px 18px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 "Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:480px;margin:0 auto;padding:14px 12px calc(32px + env(safe-area-inset-bottom, 0px))}

/* 머리 : 시안 3 틀 + 시안 1 색 + 시안 2 탭 막대 */
/* 9/13 : 윗변은 폰 상태 표시줄 색(theme-color = --heroA) 한 색으로 시작해 아래로 대각선 그라데이션에 섞임 */
.hero{color:#fff;background:linear-gradient(180deg,var(--heroA) calc(env(safe-area-inset-top, 0px) + 6px),var(--heroFade) calc(env(safe-area-inset-top, 0px) + 44px)),linear-gradient(135deg,var(--heroA) 0%,var(--heroB) 58%,var(--heroC) 100%);box-shadow:var(--heroShadow)}
.hero .wrap{padding:calc(14px + env(safe-area-inset-top, 0px)) 18px 18px}
.tabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px;padding:3px;border-radius:12px;background:rgba(0,0,0,.18);margin-bottom:18px}
.tabs button{padding:6px 0;border:0;border-radius:9px;background:transparent;color:rgba(255,255,255,.72);font:inherit;font-size:12.5px;cursor:pointer}
.tabs button.on{background:#fff;color:#7a0c17;font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.18)}
.tabs button:focus-visible{outline:2px solid #fff;outline-offset:1px}
.hero h1{margin:0;font-size:26px;letter-spacing:-.7px;font-weight:800;line-height:1.1}
.hsub{margin-top:5px;font-size:12.5px;color:rgba(255,255,255,.72);font-variant-numeric:tabular-nums}
.hsrow{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.hq{margin-top:14px;font-size:13.5px;line-height:1.5;padding:11px 13px;border-radius:10px;background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.10)}
.hq b{font-weight:700;color:#fff}
/* 8-3 ⑩ 도움말 (9/15) : 머리의 작은 ? → 그 탭의 표시 뜻이 내용 맨 위에 펼쳐진다. 뜻은 대조표 번호로 잇고 기준 숫자는 적지 않는다 */
.hrow{display:flex;align-items:center;gap:10px}
.hbtn{flex:none;width:24px;height:24px;border-radius:50%;border:1.5px solid rgba(255,255,255,.7);background:rgba(0,0,0,.15);color:#fff;font:inherit;font-size:13px;font-weight:800;line-height:1;cursor:pointer;padding:0}
.hbtn[aria-expanded="true"]{background:#fff;color:#7a0c17;border-color:#fff}
/* 9/27 다크전환 : 제목 줄 오른쪽 끝 모드 버튼 — 머리 ? 와 같은 흰 테두리. 글자는 누르면 갈 모드(밝을 때 ☾ 다크 · 다크일 때 ☀ 밝게), 어느 쪽을 보일지는 CSS 가 data-theme 로 */
.thm-btn{flex:none;margin-left:auto;display:inline-flex;align-items:center;height:24px;padding:0 10px 0 8px;border-radius:12px;border:1.5px solid rgba(255,255,255,.7);background:rgba(0,0,0,.15);color:#fff;font:inherit;font-size:12px;font-weight:700;line-height:1;cursor:pointer;white-space:nowrap}
.thm-btn span{display:inline-flex;align-items:center;gap:4px}
.thm-btn svg{width:13px;height:13px;flex:none}
.thm-btn:focus-visible{outline:2px solid #fff;outline-offset:2px}
/* 11/12 티마계획링크 : 머리 줄 '티마 · 계획 ↗' = 티마 앱(Tailscale · 내 기기끼리만) 첫 화면을 새 탭으로 — 계획 화면은 거기 머리 '계획'(같은 출처 길). /plan/ 바로 링크는 계획 서버가 다른 사이트에서 연 창을 403 으로 막아 안 씀(plan-view.ps1 연속 클릭 가로채기 막기 · 사용자 승인 배치) */
.hd-tima{flex:none;margin-left:auto;display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:12px;border:1.5px solid rgba(255,255,255,.7);background:rgba(0,0,0,.15);color:#fff;font-size:12px;font-weight:700;line-height:1;text-decoration:none;white-space:nowrap}
.hd-tima~.thm-btn{margin-left:0}
.hd-tima:focus-visible{outline:2px solid #fff;outline-offset:2px}
:root[data-theme="dark"] .thm-dk,:root:not([data-theme="dark"]) .thm-lt{display:none}
.help{background:var(--card);border:1.5px solid var(--roseDash);border-radius:16px;padding:12px 14px 10px;margin:0 0 14px;box-shadow:var(--shadow);font-size:12.5px;line-height:1.6}
.help-h{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.help-h b{font-size:14px;font-weight:800;color:var(--wine);flex:1}
.help-h button{padding:4px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card2);color:var(--wine);font:inherit;font-size:12px;cursor:pointer}
.help-lead{color:var(--sub);margin:0 0 6px}
.help-g{font-size:11px;font-weight:800;color:var(--wine);letter-spacing:.4px;margin:12px 0 2px;padding-bottom:2px;border-bottom:1px solid var(--rule)}
.help-r{display:grid;grid-template-columns:104px 1fr;gap:8px;padding:5px 0;border-top:1px solid var(--line2)}
.help-g + .help-r,.help summary + .help-r{border-top:0}
.help-r b{font-weight:700;color:var(--text)}
.help-r span{color:var(--ink2)}
.help details{margin-top:10px}
.help details summary{font-size:12.5px;font-weight:700;color:var(--wine);padding:6px 0;cursor:pointer}
.help-foot{font-size:11px;color:var(--muted);margin-top:10px;padding-top:8px;border-top:1px solid var(--rule)}
/* 구역 제목 옆 ? (9/15 저녁, 사용자 결정 — 탭 전체가 아니라 그 구역만 그 자리에서) : .label 의 ::after 선 뒤(order 2)에 붙고, 펼침은 제목 바로 아래 */
.hq2{order:2;flex:none;width:18px;height:18px;margin-left:6px;border-radius:50%;border:1px solid var(--roseDash);background:var(--card);color:var(--wine);font:inherit;font-size:11px;font-weight:800;line-height:1;padding:0;cursor:pointer;align-self:center}
.hq2[aria-expanded="true"]{background:var(--wineFill);color:#fff;border-color:var(--wineFill)}   /* 9/27 : 옛 --wine 은 다크에서 연분홍이라 흰 ? 가 안 보였다(대비 1.7:1) — 채운 바탕 짝 --wineFill (밝은 모드는 같은 #6e0b14) */
.rv-sec .hq2{order:0;margin-left:2px}
.help-inline{background:var(--noteBg);border:1px solid var(--noteLine);border-radius:12px;padding:4px 12px 6px;margin:-4px 0 10px;font-size:12px;line-height:1.55}
.help-inline .help-r:first-child{border-top:0}
/* 9/13 : 1px 이라도 스크롤하면 탭 막대를 위에 고정. 탭 위치와 배경(머리 높이만큼 늘인 같은 그라데이션)을 머리와 똑같이 맞춰 튀지 않게 */
.stick{position:fixed;top:0;left:0;right:0;z-index:20;color:#fff;background:linear-gradient(180deg,var(--heroA) calc(env(safe-area-inset-top, 0px) + 6px),var(--heroFade) calc(env(safe-area-inset-top, 0px) + 44px)),linear-gradient(135deg,var(--heroA) 0%,var(--heroB) 58%,var(--heroC) 100%);background-repeat:no-repeat;background-size:100% var(--heroH, 100%);visibility:hidden}
.stick.show{visibility:visible}
.stick.past{box-shadow:var(--heroShadow)}
.stick .wrap{padding:calc(14px + env(safe-area-inset-top, 0px)) 18px 6px}
.stick .tabs{margin:0}

.datebar{display:flex;align-items:center;gap:6px;margin:0 0 14px}
.datebar button{padding:6px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--wine);font:inherit;cursor:pointer}
.datebar button:disabled{color:var(--muted);opacity:.5;cursor:default}
.datebar select{flex:1;text-align:center;text-align-last:center;padding:6px}
select{font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:4px 6px}
button:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

.head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
/* 9/25 : 날짜 제목 다섯 곳(마감 확정·판정 전·잠정, 장중, 시계열) 같은 굵기·자간 — 전에는 마감 확정만 800, 나머지는 인라인 18px 뿐이라 기본 700 */
#live h1,#series h1{font-size:18px;margin:0;font-weight:800;letter-spacing:-.4px}
.head strong{font-size:17px;font-weight:800;letter-spacing:-.4px}
.status{font-size:12px;color:var(--muted);margin:4px 0 12px}
.label{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px;font-size:12px;font-weight:800;color:var(--wine);letter-spacing:.3px;margin:22px 2px 10px}
.label::after{content:"";flex:1;min-width:24px;height:1px;background:var(--rule);align-self:center;margin-left:4px}
.label .sub,.label .muted{font-weight:400}
.cols > div > .label:first-child{margin-top:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 14px;margin-bottom:10px;box-shadow:var(--shadow)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line2)}
.note{font-size:12.5px;line-height:1.6;padding:9px 11px;border-radius:10px;background:var(--warnBg);color:var(--warn);border:1px solid var(--warnLine);margin-top:8px}
.up{color:var(--up)}.down{color:var(--down)}.muted{color:var(--muted)}.sub{color:var(--sub)}.ok{color:var(--ok);font-weight:700}.bad{color:var(--bad);font-weight:700}
.list{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:0 14px;box-shadow:var(--shadow)}
.list .row:first-child{border-top:0}
.nowline{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:12px;color:var(--sub);margin:0 0 8px}
.nowline b{font-weight:800;color:var(--ink2)}.nowline .warn{color:var(--alert);font-weight:700}
.foot{font-size:11.5px;color:var(--muted);text-align:center;margin-top:22px;padding-top:14px;border-top:1px solid var(--rule)}
.empty{padding:24px 0;text-align:center;color:var(--muted)}
.rv-btnrow{text-align:center;margin:4px 0 22px}
.rv-btn{padding:8px 16px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--wine);font:inherit;font-size:12.5px;cursor:pointer}
.axis,.bars,.vals{display:grid;gap:3px;align-items:center;text-align:center}
.axis{font-size:10px;color:var(--muted);margin:2px 0 2px}
.axis span,.rk th{white-space:nowrap;letter-spacing:-0.2px}   /* 9/16 밤 (축머리글, 사용자 결정 ①) : 축·순위표 머리글 한 줄 위첨자 — 시 + 작은 분(정각은 시만). 자간을 살짝 좁혀 옆 칸과 안 닿게 */
.ax-m,.rk th sup.ax-m{font-size:7px;font-weight:400;color:inherit;vertical-align:top;line-height:1;position:relative;top:1px;margin-left:0.5px;letter-spacing:-0.3px}   /* .rk sup(₩ 표시용 굵은 10px)보다 우선 */
.rk table th{font-size:9px;letter-spacing:-0.3px}.rk th sup.ax-m{font-size:6.5px}   /* 순위표는 이름 칸이 있어 한 칸 16~18px → 항상 9px */
@media (max-width:389px){.axis{font-size:9px}.ax-m{font-size:6.5px}}   /* 가장 좁은 폰(375) : 축 한 칸 17px 라 9px 로 — 15²⁰ 실측 17px */
.vals{font-size:10px;color:var(--sub);margin-top:2px;font-variant-numeric:tabular-nums}
.bar{height:40px;position:relative}
.bar .mid{position:absolute;left:0;right:0;top:50%;border-top:1px solid var(--line)}
.bar i{position:absolute;left:18%;right:18%;border-radius:2px}
.bar i.p{bottom:50%;background:var(--up)}.bar i.n{top:50%;background:var(--down)}
.flag{font-size:10.5px;padding:1px 7px;border-radius:10px;background:var(--rose);color:var(--wine);margin-left:4px}
.flag.warn{background:var(--warnBg);color:var(--warn)}
.kmk{font-size:10.5px;color:var(--muted);margin-left:3px;font-weight:400}

.iq-rk{font-size:10.5px;padding:1px 7px;border-radius:10px;background:var(--chip);color:var(--chipInk);margin:0 5px 0 7px;white-space:nowrap}   /* 9/17 조회순위 해답지 : 거래대금 순위 칩 (사용자 결정 ②) — 전역 .chip 과 이름 안 겹치게 iq- 접두사 */

.iq-rt{white-space:nowrap}   /* 11/7 `해답지지움` : 해답지 전용 .iq-nm 규칙은 지움, 세 표 카드가 쓰는 .iq-rt 만 남김. 9/23 조회순위섹터 캡처 정정 : 섹터명이 붙어 한 줄에 안 들어가는 긴 이름은 글자 중간("와이즈플래닛컴퍼/니")이 아니라 이름째로 다음 줄, '선행' 칩과 오른쪽 등락률·순위·금액("11,089/억")은 안 끊긴다. 배치는 그대로 */
.row.iq3-row{display:block}.iq3-l1{display:flex;justify-content:space-between;align-items:center;gap:8px}.iq3-name{display:inline-block;font-weight:700}.iq3-l2{display:flex;flex-wrap:wrap;justify-content:space-between;column-gap:10px;padding:2px 0 0 1em}.iq3-seg{white-space:nowrap;font-variant-numeric:tabular-nums}   /* 10/6 조회순위세표 : 세 표 겹침 한 종목 = 두 줄(사용자 결정 10/6 밤) — 윗줄 이름(섹터 이름표는 해답지 .iq-sec) + 해답지 줄 오른쪽(.iq-rt · .iq-rk 그대로), 아랫줄(들여쓰기) 세 순위 · n/m회차.
   10/7 밤 `세표종목굵게` (사용자 결정 A안 · 이 카드만) : 섹터 이름표와 종목명이 한눈에 안 갈려 종목명만 700 — 9/27 '굵게 = 대장' 문법의 예외(이 카드는 대장 목록이 아니라 조회순위 종목 목록), 해답지 .iq-nm 은 보통 그대로 */
.iq3-code{font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}   /* 10/20 `세표종목코드` (사용자 요청 — 예시 '★반도체대형주 삼성전자 (132456)') : 종목명 오른쪽 ' (6자리 코드)'. 섹터 이름표(.iq-sec)와 같은 크기 · 색, 종목명 취소선(.iq-out)은 안 받는다. 표시만 */
.iq3-hi{font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums;white-space:nowrap}   /* 10/29 `세표120고가` (사용자 결정 — 예시 '로봇 원익홀딩스 (030530) -25%') : 코드 오른쪽 120일 신고가 선 대비 거리. 코드(.iq3-code)와 같은 크기 · 색 · 색칠 없음(기준 숫자 없음), 링크 밖. 표시만 */
.iq3-hi.iq3-near{display:inline-block;font-size:11px;line-height:16px;padding:0 6px;margin-left:3px;border-radius:10px;background:var(--rose);color:var(--wine);border:1px solid var(--roseLine)}   /* 11/2 `세표25칩` (사용자 결정 B안 · 취소선 제외 — 시안 그대로) : 120일 고가 거리 25% 안 종목의 숫자를 호가 통과 칩(.hg-on)과 같은 톤 칩으로. 다크는 변수만. 표시만 — 판정 · 채점에 안 쓴다 */
.iq3-lk{color:inherit;text-decoration:none}   /* 10/22 `세표영웅문링크` · `세표차트링크` : 종목명(호가주문) · 코드(종목차트)를 하나씩 감싼 링크 — 글자 모양 · 색 · 취소선은 안쪽 .iq3-name · .iq3-code 그대로(밑줄 · 링크색 없음, 사용자 결정 '예시대로') */
.iq3-l3{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;column-gap:10px;padding:3px 0 0 1em}.iq3-l3>:last-child{margin-left:auto}   /* 10/20 `세표네줄` (사용자 결정 — 사용자가 보낸 배치 그대로) : 셋째 줄 = 호가 칩(왼쪽) + '15위 안 n/m회차'(오른쪽). 자리가 모자라 밀려도 오른쪽 끝(margin-left:auto) — 375px 실측(오늘 · 10/19 · 경고칩 2개 가정)엔 밀림 0. 경고칩은 넷째 줄 .wc-line */
.iq3-lb{color:var(--sub)}.iq3-v{font-weight:700}.iq3-star{color:var(--brand);margin-right:3px}   /* 10/7 밤 `세표숫자별` (사용자 결정 — 추천대로) : 아랫줄 '누적 · 1시간 · 10분' 글자는 --sub, 순위 숫자만 700 — 모양만 가른다(순위 값에 따른 색 · 기준선 없음).
   ★ = '15위 안 n/m회차' 의 n = m (09:00 뒤 모든 회차 세 표 모두 15위 안), 윗줄 섹터 이름표 앞. 회차 수 하한 없음(새 숫자 0). 10/8 `세표빈별` : n = m − 1 (n ≥ 1) 은 같은 클래스로 ☆ */
.wc-st{font-size:12px;color:var(--sub);margin:2px 0 6px}.wc-line{display:flex;flex-wrap:wrap;gap:4px;padding:3px 0 0 1em}.wc-on,.wc-calc,.wc-na{font-size:10.5px;padding:1px 7px;border-radius:10px;white-space:nowrap}.wc-on{background:var(--warnBg);color:var(--warn)}.wc-calc{border:1px dashed var(--warn);color:var(--warn);padding:0 6px}.wc-na{border:1px solid var(--sub);color:var(--sub);padding:0 6px}   /* 10/13 `경고칩` (사용자 결정 ② 6 — 추천대로) : 세 표 겹침 카드 종목의 셋째 줄(칩이 있는 종목만, 윗줄 · 아랫줄 그대로). ① 지정 = 채움(우선주 · 신규주 .flag.warn 과 같은 톤) · ② 요건 = 점선 테두리 · 모름(지정? · 요건?) = 실선 --sub.
   테두리 칩은 padding 을 1px 줄여 채운 칩과 높이가 같다. 머리 상태 줄 .wc-st 는 읽을 글이라 --sub(.status 의 --muted 는 흰 카드 명암 2.99:1). 다크는 변수만(새 다크 규칙 0). 전역 .chip · .flag · .status 와 이름 안 겹치게 wc- 접두사 */
.iq3-tg{font:inherit;color:var(--sub);background:none;border:0;padding:0;margin:0;cursor:pointer;font-variant-numeric:tabular-nums;white-space:nowrap}.iq3-tl{padding:6px 0 2px 1em}.iq3-tl-g{display:grid;grid-template-columns:2.6em repeat(39,minmax(0,1fr));column-gap:1px;row-gap:2px;align-items:center}.iq3-tl-h{font-size:10.5px;line-height:13px;color:var(--sub);font-variant-numeric:tabular-nums}.iq3-tl-lb{font-size:11px;line-height:10px;color:var(--sub);white-space:nowrap}.iq3-c{height:9px;border-radius:1px}.iq3-tl-g .iq3-cr{margin-top:3px}.iq3-c1{background:var(--brand)}.iq3-c2{background:var(--roseDash)}.iq3-c0{background:var(--line)}.iq3-cv{background:var(--wine)}.iq3-tl-s{font-size:12px;color:var(--sub);padding-top:5px;font-variant-numeric:tabular-nums}   /* 11/11 `세표10분` : 세 표 겹침 카드 10분 칸 펼침 그래프(승인 시안 그대로 — docs\세표10분_시안) */
.iq3-fvw{display:inline-flex;align-items:center;white-space:nowrap}.iq3-fvb{font:inherit;font-size:17px;line-height:1;color:var(--muted);background:none;border:0;padding:6px 0 6px 10px;margin:-6px 0;cursor:pointer}.iq3-fvb.on{color:var(--brand)}.iq3-fv{background:var(--card);border:1px solid var(--roseLine);border-radius:16px;padding:4px 14px 6px;margin:0 0 10px;box-shadow:var(--shadow)}.iq3-fvh{font-size:12px;font-weight:800;color:var(--wine);padding:4px 0 2px}.iq3-fvl{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:5px 0;border-top:1px solid var(--line2)}.iq3-fvh+.iq3-fvl{border-top:0}.iq3-fvl .iq3-fvb{padding:6px 6px 6px 0;font-size:15px}.iq3-fvn{display:flex;align-items:center;min-width:0;white-space:nowrap;overflow:hidden}.iq3-fvs{display:flex;align-items:center;gap:8px;white-space:nowrap;font-variant-numeric:tabular-nums}.iq3-fvr{font-size:12px;color:var(--sub)}.iq3-fvr b{color:var(--text);font-weight:700}.iq3-fvx{color:var(--muted);font-weight:400}   /* 시안 `세표관심` */
.iq3-fvl{flex-wrap:wrap}.iq3-fvs{margin-left:auto}   /* 11/12 `세표관심` 사용자 결정 : 띠 줄은 넘칠 때만 순위 · 등락률을 아랫줄로(좁은 폭 · 긴 이름에서 이름이 잘리지 않게) — 다 들어가면 승인 시안 모양 그대로 */
.hg-on,.hg-no,.hg-na{font-size:10.5px;padding:0 6px;border-radius:10px;white-space:nowrap}.hg-on{background:var(--rose);color:var(--wine);border:1px solid var(--roseLine)}.hg-no{border:1px dashed var(--sub);color:var(--sub)}.hg-na{border:1px solid var(--sub);color:var(--sub)}   /* 10/16 `호가1억칩` (사용자 결정 ③ — 추천대로) : 세 표 겹침 카드 셋째 줄 맨 앞. 통과 = 채움(복기 '지킴' .b-ok 와 같은 톤 — 경고칩 .wc-on 의 경고 색과 가른다) · 1억 없음 = 점선 회색 · 못 받음(호가?) = 실선 회색. 높이는 .wc-* 와 같게(테두리 1px + padding 0). 다크는 변수만 */
.hg-c+.hg-c{border-left:1px solid var(--roseLine);margin-left:5px;padding-left:5px}.hg-no .hg-c+.hg-c{border-left:1px dashed var(--sub)}   /* 10/20 `호가칸막이` (사용자 결정 A — 375px 시안 그대로) : 호가 칩 안을 칸으로 나눠 얇은 세로 선 — 통과 '1억 | 가격 | 금액' 세 칸(실선 --roseLine = 칩 테두리 색) · 미달 '1억 없음 | 최대 n.nn억' 두 칸(점선 --sub = 칩 테두리 모양). 붙어 있으면 '1억 210,500원' 이 한 금액(1억 21만 500원)으로 읽혀서. 굵게 없음(굵게 = 종목명 · 순위). 호가? 는 그대로. 값 · 기준 그대로, 모양만 */
.gapline{font-size:11px;color:var(--muted);margin-top:4px}
.hint{font-size:11px;color:var(--wine);margin-top:6px}

/* 지수 5분봉 선 차트 (9/17 지수차트, 사용자 결정 1A 2A 3A) — 장중 탭 맨 위. 접두사 ix-. 선은 SVG(가로세로 따로 늘어남, 굵기는 고정), 글자는 HTML 을 % 위치로 */
.ix-card{padding:11px 12px 9px}

.ix-sw.ix-m3{border-top-color:var(--ixM3)}
.ix-sw.ix-mup{border-top-color:var(--up)}   /* 10/29 일봉 5일선 = 섹터 모멘텀 막대 빨강 · 20일선 = 파랑 (사용자 요청) */

/* 9/27 `일봉전환` (사용자 결정 9/26 ①~⑩) : [5분봉 | 일봉] 전환 단추(구역 제목 줄 ? 뒤) · 일봉 범례 셋 · 5분봉 날짜 칸 '갭 · 종가' 줄 · 마지막 칸 전일 종가 점선 · 일봉 가로축(달 · 기간) */

/* 시계열 탭 (9/14 밤, 8-3 ④) — 시각 × 종목 격자. 옆으로 스크롤(data-noswipe), 첫 열 고정 */
.sg{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-top:4px}
.sg table{border-collapse:separate;border-spacing:0;table-layout:fixed;font-size:11.5px}
.sg th{font-size:10px;font-weight:400;color:var(--muted);padding:2px 0 3px;text-align:center;white-space:nowrap}
.sg td{text-align:center;padding:4px 0;border-top:1px solid var(--line2);font-variant-numeric:tabular-nums;white-space:nowrap}
.sg th:first-child,.sg td:first-child{position:sticky;left:0;z-index:1;background:var(--card);text-align:left;padding-right:6px;max-width:96px;overflow:hidden;text-overflow:ellipsis}
.sg td.l1{color:var(--sub)}
.sg td.l2{background:var(--rose);color:var(--wine);font-weight:700}
.sg td.l3{background:var(--roseLine);color:var(--wine);font-weight:800}
.sg td.l4{background:var(--brand);color:var(--onFill);font-weight:800}
.sg td.dot{color:var(--brand);font-size:10px}
.sg td.top{font-weight:800;color:var(--wine)}
.sg td.up,.sg td.down{font-weight:600}
.sg-sc{font-size:10px;font-weight:400;color:var(--sub)}   /* 9/28 `시계열섹터이름표` : 격자 이름 칸 위 줄 = 15:20(장중은 마지막) 티마 카드 섹터명. 9/27 이름표 문법(보통 굵기 · --sub)에서 크기만 격자 머리글(.sg th)과 같은 10px — 격자 글자 11.5px 보다 작게. 전역 .sub 와 안 겹치게 sg- 접두사 */
.sg-sc,.sg-nm{overflow:hidden;text-overflow:ellipsis}   /* 이름표가 붙은 칸의 두 줄(이름표 · 종목명)도 줄마다 … — nowrap 은 .sg td 에서 물려받는다 */
.sg-lead{font-size:12.5px;line-height:1.6;margin:0 0 6px}
.sg-lead b{color:var(--wine)}
.sg-leg{font-size:11px;color:var(--muted);margin-top:6px;line-height:1.45}
/* 9/28 `조건식목록` — 상태 줄 아래 접힌 한 줄 '조건검색 두 식의 조건'. 접기 모양은 전역 details summary 그대로(빠진 종목 접힘과 같음), 새 색 없음 */
.sg-cdet{margin:-8px 0 6px}
.sg-cond{font-size:12.5px;line-height:1.6;padding:0 0 4px}
.sg-cond-i{padding-left:1.5em;text-indent:-.6em}
.sg-cond-i + .sg-cond-h{margin-top:4px}
.sg-cond-c{margin-top:6px;color:var(--sub)}
.sg-cond-c span{white-space:nowrap}
@media (min-width:860px){.wrap{max-width:960px}.hero .wrap{padding:calc(14px + env(safe-area-inset-top, 0px)) 12px 18px}.stick .wrap{padding:calc(14px + env(safe-area-inset-top, 0px)) 12px 6px}.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.cols > *{min-width:0}   /* 9/19 시계열PC : 격자 열(1fr)의 min-width 기본값 auto 는 안쪽 표(첫 열 96 + 34px × 회차)의 폭이라 두 열이 wrap 밖으로 밀렸다(980px 에서 738+738). 0 이면 열이 반씩 나뉘고 넓은 표는 .sg 안에서 옆으로 스크롤 */
#series .cols{display:block}   /* 9/19 시계열PC : 시계열 탭은 PC 에서도 한 열 — 표 다섯 장(최대 708px)이 936px 안에 통째로 보이게, 폰과 같은 순서 */}

/* 복기 탭 (시안 3 모양) — 다른 탭 클래스와 겹치지 않게 rv- 로 시작 */
.rv-note{border:1px solid var(--noteLine);border-radius:12px;background:var(--noteBg);padding:12px 13px;margin-bottom:22px;color:var(--sub);font-size:12px;line-height:1.72}
.rv-note b,.rv-warn b{color:var(--wine);font-weight:700}
.rv-sec{display:flex;align-items:baseline;gap:7px;margin:0 2px 10px}
.rv-sec h2{margin:0;font-size:12px;font-weight:800;color:var(--wine);letter-spacing:.6px}
.rv-sec .c{font-size:11.5px;color:var(--muted)}
.rv-sec .ln{flex:1;height:1px;background:var(--rule)}

@media (min-width:860px){.cols > section > .rv-sec:first-child{margin-top:0}}
.rv-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rv-stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 13px}
.rv-stat.hot{background:linear-gradient(165deg,var(--card) 0%,var(--rose) 100%);border-color:var(--roseLine)}
.rv-stat .k{font-size:11.5px;color:var(--sub)}
.rv-stat .v{font-size:24px;font-weight:800;letter-spacing:-.8px;font-variant-numeric:tabular-nums;margin-top:2px;line-height:1.15}
.rv-stat .v.big{font-size:26px;letter-spacing:-1px}
.rv-stat .v small{font-size:11.5px;font-weight:600;color:var(--muted);margin-left:5px;letter-spacing:0}

.rv-quad{display:grid;grid-template-columns:38px 1fr 1fr;grid-template-rows:auto 1fr 1fr;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px;margin-top:8px}

/* 11/11 `복기네칸거르기` (사용자 승인 예시) : 네 칸(0건 칸 밖)을 누르면 매매 목록이 그 칸의 카드만 — 누른 칸은 바깥 고리(--wine, 카드색 2px 틈), 매매 묶음 단추 아래 '● 정상만 12건 · 전체 보기 ✕' 한 줄(.rv-kf) */
.rv-quad .cell[role="button"]{cursor:pointer;-webkit-tap-highlight-color:transparent}

.rv-kf{display:flex;align-items:center;flex-wrap:wrap;gap:4px;margin:-4px 2px 10px;font-size:12.5px;color:var(--ink2)}
.rv-kf button{font:inherit;font-size:12px;font-weight:700;line-height:1;margin:0;padding:6px 9px;border:1px solid var(--roseDash);border-radius:8px;background:var(--card);color:var(--wine);cursor:pointer}
.rv-bars{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 13px;margin-top:8px;display:flex;flex-direction:column;gap:7px}
.rv-bars .r{display:flex;align-items:center;gap:9px;font-size:12px}
.rv-bars .lab{width:104px;flex:none;color:var(--sub)}
.rv-bars .tr{flex:1;height:8px;background:var(--barTrack);border-radius:5px;overflow:hidden}
.rv-bars .tr i{display:block;height:100%;background:linear-gradient(90deg,var(--barA),var(--barB));border-radius:5px}
.rv-bars .n{width:16px;text-align:right;font-weight:800;color:var(--wine);font-variant-numeric:tabular-nums}
/* 9/28 `복기매매묶음` (사용자 승인 예시) : '매매' 제목 아래 [지킨 매매 n | 어긴 매매 n | 누적 밖 n] — 누른 묶음의 카드만 보인다. 모양은 지수 차트 [5분봉 | 일봉](.ix-mode)의 테두리 · 누른 쪽 채운 바탕만 */
.rv-grp{display:inline-flex;max-width:100%;margin:0 2px 12px;border:1px solid var(--roseDash);border-radius:9px;overflow:hidden}
.rv-grp button{font:inherit;font-size:12px;font-weight:700;line-height:1;white-space:nowrap;margin:0;padding:8px 11px;border:0;background:var(--card);color:var(--wine);cursor:pointer}
.rv-grp button + button{border-left:1px solid var(--roseDash)}
.rv-grp button[aria-pressed="true"]{background:var(--wineFill);color:var(--onFill)}
.rv-grp button:focus-visible{outline:2px solid currentColor;outline-offset:-4px}   /* 전역 button:focus-visible(바깥 2px)는 틀의 overflow:hidden 에 잘린다 — 키보드 포커스 테를 단추 안쪽에, 글자색으로 */
.rv-legend{display:flex;flex-wrap:wrap;gap:10px 14px;font-size:11.5px;color:var(--sub);margin:0 2px 12px}
.rv-legend span{display:inline-flex;align-items:center;gap:5px}
.mk{flex:none;width:19px;height:19px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;font-style:normal}
.rv-legend .mk{width:15px;height:15px;font-size:9px}
.m-y{background:var(--rose);color:var(--wine)}.m-n{background:var(--brand);color:var(--onFill)}.m-na{background:var(--naBg);color:var(--naInk)}.m-q{background:var(--card);color:var(--brand);border:1.5px solid var(--roseLine)}
.rv-trade{position:relative;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 15px 13px 17px;margin-bottom:10px;overflow:hidden;box-shadow:var(--shadow)}
.rv-trade::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px}
.rv-trade.chk::before{background:repeating-linear-gradient(180deg,var(--brand) 0 7px,transparent 7px 12px)}
.rv-trade.ok::before{background:var(--okRail)}.rv-trade.luck::before{background:var(--wineFill)}.rv-trade.exec::before{background:var(--cocoa)}.rv-trade.skip::before{background:var(--muted2)}
.rv-th{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rv-th .nm{font-size:17px;font-weight:800;letter-spacing:-.4px}
.rv-th .mt{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
/* 9/29 `복기목록접기` : 카드는 머리 줄만 보이게 접어 두고 누르면 펼침. ▸ ▾ 는 '주문 기록'(.rv-og)과 같은 방식 — ::before 라 글자 밖, 색 --sub. 12px = 코드 전 계측에서 머리 줄 줄 수가 덜 바뀌는 쪽(사용자 결정 — 시험 카드 두 줄 감수) */
.rv-th{cursor:pointer}
.rv-th .nm::before{content:"▸";display:inline-block;width:1em;font-weight:400;color:var(--sub);font-size:12px}
.rv-th[aria-expanded="true"] .nm::before{content:"▾"}
.rv-badge{margin-left:auto;font-size:11px;font-weight:700;border-radius:20px;padding:3px 10px;white-space:nowrap}
.b-chk{background:var(--card);color:var(--brand);border:1.5px dashed var(--brand)}.b-ok{background:var(--rose);color:var(--wine);border:1px solid var(--roseLine)}.b-luck{background:var(--wineFill);color:var(--onFill)}.b-exec{background:var(--cocoa);color:var(--onFill)}.b-skip{background:var(--chip);color:var(--chipInk);border:1px solid var(--line)}
/* 10/20 `복기손익색` (사용자 승인 추천1) : 머리 줄 = 첫 줄 [▸ 종목명 ……… 수익률 배지] · 둘째 줄 날짜. 수익 빨강 · 손실 파랑은 데이터 = HTS 원색(--up · --down).
   배지 칸 최소 92px(가장 넓은 '▲ 운 · 가장 위험')로 숫자 오른쪽 끝을 세로로 맞춘다. 375px 계측 : 모든 카드 두 줄 46px(긴 이름 · ±12.3% 합성 자료 포함) */
.rv-trade.ok{color:inherit;font-weight:inherit}   /* 카드 클래스 ok 가 전역 .ok(초록 굵게)와 겹쳐 '정상' 카드 글자가 전부 초록 굵게 보이던 것을 끊는다 */
.rv-th .nm.rv-up,.rv-th .rv-rt.rv-up{color:var(--up)}.rv-th .nm.rv-down,.rv-th .rv-rt.rv-down{color:var(--down)}
.rv-th .rv-rb{margin-left:auto;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.rv-th .rv-rb .rv-badge{margin-left:0;min-width:92px;text-align:center}
.rv-th .rv-rt{font-size:14px;font-weight:800;letter-spacing:-.2px;font-variant-numeric:tabular-nums;color:var(--sub)}
.rv-th .mt{order:3;flex-basis:100%;padding-left:12px;margin-top:-6px}
.rv-chips{display:flex;flex-wrap:wrap;gap:5px;margin:9px 0 11px}
.rv-chip{font-size:11px;color:var(--chipInk);background:var(--chip);border-radius:14px;padding:3px 9px}
.rv-chip.red{color:var(--wine);background:var(--rose)}
.rv-kv{display:grid;grid-template-columns:repeat(4,1fr);background:var(--card2);border:1px solid var(--line2);border-radius:11px;overflow:hidden}
.rv-kv > div{padding:8px 6px;text-align:center}
.rv-kv > div + div{border-left:1px solid var(--line2)}
.rv-kv .k{font-size:10.5px;color:var(--muted)}
.rv-kv .v{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
.rv-kv .v.rate{font-weight:800}
.rv-kv .v.sm{font-size:11.5px;font-weight:600;line-height:1.3}   /* 9/19 금액 줄 (배치 A) : 수량 × 단가 · 추정자산 (출처) */
.rv-base{margin-top:9px;font-size:11.5px;line-height:1.7;color:var(--sub);background:var(--soft);border-radius:10px;padding:8px 10px}
.rv-base b{color:var(--text);font-weight:700}
.rv-base b.up{color:var(--up)}.rv-base b.down{color:var(--down)}
.rv-src{color:var(--muted2)}
.rv-rules{margin-top:11px}
.rv-rules .g{font-size:10.5px;color:var(--muted);letter-spacing:.5px;margin:9px 0 3px}
.rv-rules .g:first-child{margin-top:8px}
/* 9/28 `복기매매묶음` : '주문 기록' 묶음은 접어 두고 제목 줄(줄 전체 폭)을 누르면 펼침. ▸ ▾ 는 마감 탭 섹터 판정 목록 줄(.jl-nm)과 같은 방식 — ::before 라 글자 밖 */
.rv-rules .rv-og{cursor:pointer}
.rv-rules .rv-og::before{content:"▸";display:inline-block;width:1em;color:var(--sub)}   /* 9/29 사용자 결정 (나) : ▸ ▾ 만 한 단계 진하게(--sub) — 제목 글자는 다른 묶음 제목과 같은 --muted, 누르는 곳이라는 표시만 */
.rv-rules .rv-og[aria-expanded="true"]::before{content:"▾"}
.rv-rule{display:flex;align-items:flex-start;gap:9px;padding:3px 0;font-size:13px}
.rv-rule .mk{margin-top:1px}
.rv-rule .why{display:block;font-size:11.5px;color:var(--muted)}
.rv-say{margin-top:11px;font-size:12.5px;line-height:1.6;color:var(--ink2);background:var(--rose);border-radius:10px;padding:9px 11px}
.rv-foot{margin:24px 2px 0;font-size:11.5px;color:var(--muted);line-height:1.9;border-top:1px solid var(--rule);padding-top:14px}
.rv-foot b{color:var(--sub);font-weight:700}

<script>
const WD = '일월화수목금토';
const arr = x => Array.isArray(x) ? x : (x && Array.isArray(x.value) ? x.value : (x == null ? [] : [x]));
const num = s => { const v = parseFloat(String(s ?? '').replace(/,/g, '')); return isFinite(v) ? v : null; };
const has = s => s !== undefined && s !== null && String(s).trim() !== '';
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined && text !== null) e.textContent = text; return e; }
function add(parent, ...kids) { kids.forEach(k => { if (k) parent.appendChild(k); }); return parent; }
function pctEl(s) {
  const v = num(s);
  if (v === null) return el('span', 'muted', '—');
  return el('span', v > 0 ? 'up' : (v < 0 ? 'down' : ''), (v > 0 ? '+' : '') + v.toFixed(2) + '%');
}
async function getJson(path) {
  const res = await fetch(path + '?t=' + Date.now());
  if (!res.ok) throw new Error(path + ' ' + res.status);
  return res.json();
}

// ---- 우선주 표시 (9/15 저녁, 사용자 결정 : 우선주는 매매하지 않는다) ----

      if (secs) { td0 = el('td'); add(td0, el('div', 'sg-sc', secs.join('·')), add(el('div', 'sg-nm', nm), kMark(d, NC[nm]))); }   // 9/28 시계열섹터이름표 : 위 줄 섹터 이름표 · 아래 줄 종목명(+ (k)), 이름 칸 폭 96 그대로
      else { td0 = el('td', null, nm); add(td0, kMark(d, NC[nm])); }   // 이름표 없는 줄은 옛 모양 그대로 한 줄
      td0.title = nm; tr.appendChild(td0);   // (k) 9/15 저녁
      times.forEach((t, i) => { const c = cell(nm, t); const td = el('td', ((c && c.cls) ? c.cls : '') + (isAft1(times, i) ? ' aft1' : ''), c ? c.text : ''); if (c && c.title) td.title = c.title; tr.appendChild(td); });   // 9/15 저녁 : 16:00 앞 점선
      tb.appendChild(tr);
    });
    add(wrapEl, tb); return wrapEl;
  };
  // 행 순서 : 마지막 회차에 있는 것 먼저 → 걸린 회차 많은 순 → 처음 걸린 시각 이른 순
  const orderOf = (k, times) => {
    const names = [...new Set(times.flatMap(t => Object.keys(M[k][t] || {})))];
    const lastT = times[times.length - 1];
    const hits = nm => times.filter(t => hit(k, t, nm)).length;
    const first = nm => times.findIndex(t => hit(k, t, nm));
    return names.sort((a, b) => {
      const la = hit(k, lastT, a) ? 1 : 0, lb = hit(k, lastT, b) ? 1 : 0; if (la !== lb) return lb - la;
      const ha = hits(a), hb = hits(b); if (ha !== hb) return hb - ha;
      return first(a) - first(b);
    });
  };
  const cols = el('div', 'cols'); const c1 = el('div'); const c2 = el('div'); add(box, add(cols, c1, c2));

  // 1) 네 기준 겹침 — 칸 = 그 회차에 걸린 기준 수. 2개 이상 걸린 적 있는 종목만
  const allT = [...new Set(KEYS.flatMap(k => T[k]))].sort();
  const crit = (nm, t) => KEYS.filter(k => hit(k, t, nm));
  const allNames = [...new Set(KEYS.flatMap(k => Object.keys(M[k]).flatMap(t => Object.keys(M[k][t]))))];
  const maxC = nm => Math.max(0, ...allT.map(t => crit(nm, t).length));
  const lastAll = allT[allT.length - 1];
  const firstT2 = nm => allT.find(t => crit(nm, t).length >= 2);
  const ovNames = allNames.filter(nm => maxC(nm) >= 2).sort((a, b) => {
    const la = crit(a, lastAll).length, lb = crit(b, lastAll).length; if (la !== lb) return lb - la;
    const ma = maxC(a), mb = maxC(b); if (ma !== mb) return mb - ma;
    return allT.indexOf(firstT2(a)) - allT.indexOf(firstT2(b));
  });
  add(c1, labelWith('네 기준 겹침 (칸 = 그 회차에 걸린 기준 수)', 'series.overlap'));
  const ovCard = el('div', 'card');
  if (!allT.length) add(ovCard, el('div', 'empty', '이날은 시계열 기록 없음'));
  else {
    const lead = el('div', 'sg-lead');
    const nowHit = ovNames.filter(nm => crit(nm, lastAll).length >= 2);
    add(lead, el('span', 'sub', `${tLabel(lastAll)} 에 2개 이상 : `));
    if (!nowHit.length) add(lead, el('span', 'muted', '없음'));
    nowHit.forEach((nm, i) => { if (i) lead.appendChild(document.createTextNode(' · ')); add(lead, el('b', null, nm), el('span', null, ` ${crit(nm, lastAll).length}개 (${tLabel(firstT2(nm))} 부터)`)); });
    add(ovCard, lead);
    if (!ovNames.length) add(ovCard, el('div', 'empty', '2개 이상 겹친 종목 없음'));
    else add(ovCard, mkGrid(allT, ovNames, (nm, t) => { const c = crit(nm, t); return c.length ? { text: String(c.length), cls: 'l' + c.length, title: c.map(k => KN[k]).join(' · ') } : null; }, '종목'));
    add(ovCard, el('div', 'sg-leg', '기준 = 티마 대장 · 당일주도주_강의 · 120일 신고가_강의 · 조회순위 20위. 4 = 넷 다 · 빈칸 = 하나도 없음 (그 회차에 기록이 없는 기준은 0 으로 센다). 몇 개에 걸렸는가는 관찰이지 판정 조건이 아니다'));
  }
  add(c1, ovCard);

  // 2) 티마 대장 — 카드(섹터)마다 누적 거래대금 1위
  add(c1, labelWith('티마 대장 (카드별 누적 거래대금 1위)', 'series.tima'));
  const timaCard = el('div', 'card');
  if (!T.tima.length) add(timaCard, el('div', 'empty', '티마 기록 없음'));
  else {
    add(timaCard, mkGrid(T.tima, orderOf('tima', T.tima), (nm, t) => { const s = M.tima[t] && M.tima[t][nm]; return s ? { text: '●' + (s.length > 1 ? s.length : ''), cls: 'dot', title: s.join(' · ') } : null; }, '종목'));
    add(timaCard, el('div', 'sg-leg', '● = 그 회차 티마 카드 한 장의 대장 (●2 = 카드 두 장) · 개별이슈 카드 제외 · 이름은 OCR 글자 그대로'));
  }

  // 3) 당일주도주_강의 / 4) 120일 신고가_강의 — 영웅문 조건검색 (칸 = 그 회차 등락률, 반올림)
  const pctCell = k => (nm, t) => {
    const r = M[k][t] && M[k][t][nm]; if (!r) return null;
    const v = num(r['등락률']); const rv = v === null ? null : Math.round(v);
    return { text: rv === null ? '●' : (rv > 0 ? '+' : '') + rv, cls: v > 0 ? 'up' : (v < 0 ? 'down' : null), title: `${r['등락률']}%` + (has(r['현재가']) ? ` · ${r['현재가']}원` : '') };
  };
  /* 9/19 `조건검색본표` : 본표 = 기준 회차에 걸린 종목만 — 기준 회차 = 15:20 이하 마지막 회차(마감이면 15:20, 장중이면 지금까지 마지막). 판정이 당일주도주포함·120신고가포함 칸에 적는 것과 같은 회차라 새 숫자 없음 (대조표 C4·C5 — 검색식은 3시 종베 때 겹쳐 보는 것).
     그 전(9/14 밤~)은 한 회차라도 걸리면 줄이 생겨 오전에 한 번 걸린 종목이 다 올라왔다 (사용자 지적, 안 A 결정). 빠진 종목은 접힘 하나. 저녁 회차(점선 오른쪽)는 기준에서 뺀다 — 관찰만 */
  const condBase = condT.filter(t => t <= '1520').pop() || condT[condT.length - 1];
  const condGrid = (k, title, parent, judgeCol) => {
    add(parent, labelWith(title, 'series.' + k));

    else {
      const names = orderOf(k, condT); const bl = tLabel(condBase);

      if (rest.length) {

        add(det, mkGrid(condT, rest, pctCell(k), '종목')); add(card, det);
      }
      add(card, el('div', 'sg-leg', `칸 = 그 회차에 검색식에 걸림, 숫자는 등락률(반올림) · 빈칸 = 안 걸림 · 영웅문 조건식 그대로 · 본표 = ${bl} 에 걸린 종목(판정의 ${judgeCol} 칸과 같은 회차), 화면 기준일 뿐 판정에 안 씀`));
    }
    add(parent, card);
  };
  condGrid('lead', '당일주도주_강의 (조건검색)', c1, '당일주도주포함');
  condGrid('high', '120일 신고가_강의 (조건검색)', c2, '120신고가포함');

  // 5) 실시간 조회순위 — 1시간마다 찍은 1분 스냅샷 (6-18 ④)
  add(c2, labelWith('조회순위 (키움 실시간 조회 20위)', 'series.inq'));
  const inqCard = el('div', 'card');
  if (!T.inq.length) add(inqCard, el('div', 'empty', '조회순위 기록 없음 (9/11 부터)'));
  else {
    add(inqCard, el('div', 'note', '1시간마다 찍은 1분 스냅샷 — 회차 사이에 잠깐 치고 올라온 종목은 여기 안 잡힌다. 오래 걸려 있는 종목을 보는 표다'));
    const lastI = T.inq[T.inq.length - 1];
    const rk = (nm, t) => { const r = M.inq[t] && M.inq[t][nm]; return r ? (num(r['조회순위']) ?? 99) : 99; };
    const best = nm => Math.min(...T.inq.map(t => rk(nm, t)));
    const allI = [...new Set(T.inq.flatMap(t => Object.keys(M.inq[t] || {})))].sort((a, b) => {
      const la = rk(a, lastI), lb = rk(b, lastI); if (la !== lb) return la - lb;
      const ha = T.inq.filter(t => hit('inq', t, a)).length, hb = T.inq.filter(t => hit('inq', t, b)).length; if (ha !== hb) return hb - ha;

    /* 9/19 `조회순위본표` : 본표 = 5위 안(굵은 칸)에 INQ_MIN 회 이상 든 종목만 (대조표 D7 "5위 이내 꾸준히" 를 회차로 센 것 — 화면 표시 값, 판정에 안 씀).
       그 전(9/14 밤~)은 "10위 안 1회" 가 본표, "11~20위만" 접힘이었는데 한 번 튀어나온 종목이 다 올라와 표 목적(오래 걸려 있는 종목)과 안 맞았다 (사용자 지적, 추천 2회 결정). 접힘은 하나로 합침 */
    const INQ_TOP = 5, INQ_MIN = 2;
    const topN = nm => T.inq.filter(t => rk(nm, t) <= INQ_TOP).length;
    const main = allI.filter(nm => topN(nm) >= INQ_MIN), rest = allI.filter(nm => topN(nm) < INQ_MIN);
    if (main.length) add(inqCard, mkGrid(T.inq, main, inqCell, '종목'));
    else add(inqCard, el('div', 'empty', `${INQ_TOP}위 안 ${INQ_MIN}회 이상 든 종목 아직 없음`));
    if (rest.length) {
      const det = el('details'); add(det, el('summary', null, `나머지 ${rest.length}개 보기 (${INQ_TOP}위 안 ${INQ_MIN}회 미만 · 11~20위만)`));

  add(c2, inqCard);
  add(box, el('div', 'foot', `관찰 전용 — 기준 넷 다 강의 원문(대조표) 그대로, 겹침 수는 판정 조건이 아님 · 생성 ${d.generated || '—'}`));

/* ── 복기 탭 (9/13 시안 · 9/15 실자료 연결) ─────────────────────
   data/review.json 을 그린다 — pages-export.ps1 v1.8 이 PC 의 비공개 체결 원본(review-build.ps1)에서 허용 목록 칸만 골라 만든 파일.

   (review-build 의 '예외 · ' + 예외 목록 · '보유 중 (미청산)' 글자 — 그쪽이 바뀌면 같이 고친다). 지킨 = ok · chk · 어긴 = luck · exec (둘 다 '예외 · ' 칩 없음) · 누적 밖 = 그 밖 전부(시험 skip · 예외 칩 · 모르는 kind).

let RV_GRP = 'kept';

   누적 밖 카드는 같은 배지여도 안 보인다(네 칸 숫자는 누적 안 매매만 — 보이는 카드 수 = 칸 숫자). 풀기 = 같은 칸 다시 · 묶음 단추 · '전체 보기 ✕'. 한 열(폰)이면 매매 제목까지 내려 준다.
   고른 칸도 함수 밖(RV_GRP 처럼) — 자동 새로 읽기에도 그대로, 다시 그린 자료에 그 칸 카드가 없으면 푼다 */
const RV_KGRP = { ok: 'kept', chk: 'kept', luck: 'broke', exec: 'broke' };

function rvExc(t) { return arr(t.chips).map(c => String(arr(c)[0] ?? '')).filter(s => s.indexOf('예외 · ') === 0); }

}

    const b = el('div', 'rv-stat' + (cls ? ' ' + cls : ''));
    const vv = el('div', 'v' + (vcls ? ' ' + vcls : ''), v); vv.appendChild(el('small', null, small));
    add(b, el('div', 'k', k), vv);
    if (meter) { const m = el('div', 'rv-meter' + (meter[1] ? ' ' + meter[1] : '')); const i = el('i'); i.style.width = meter[0] + '%'; add(b, add(m, i)); }
    return b;
  };
  add(stats,
    stat('hot', '기준 준수율', (total ? Math.round(kept / total * 100) : 0) + '%', 'big', `${kept} / ${total}`, [total ? Math.round(kept / total * 100) : 0, '']),
    stat('', '연속 손실', String(streak), 'big', '일 · 3일이면 쉬는 날', [Math.round(Math.min(streak, 3) / 3 * 100), 'loss']),
    stat('', '지킨 매매 평균 수익률', rvPct(sm.keptAvg), rvSign(sm.keptAvg), `${sm.keptCount ?? 0}건`),
    stat('', '어긴 매매 평균 수익률', rvPct(sm.brokeAvg), rvSign(sm.brokeAvg), `${sm.brokeCount ?? 0}건`));
  add(s1, stats);
  if (arr(rv.warn).length) add(s1, rvSegs(el('div', 'rv-warn'), rv.warn));

  const q = rv.quad || {};
  const quad = el('div', 'rv-quad');
  const qCells = [];   /* 11/11 `복기네칸거르기` : 누를 수 있는 칸(0건 밖) — pickKind 는 아래 매매 구역에서 만든다(누름은 그린 뒤라 그때는 있다) */
  const cell = (cls, k, n, t) => {
    const c = el('div', 'cell ' + cls); add(c, el('div', 'n', String(n ?? 0)), el('div', 't', t));
    if ((num(n) ?? 0) > 0) {
      c.dataset.kind = k; c.setAttribute('role', 'button'); c.tabIndex = 0; c.setAttribute('aria-pressed', 'false');
      c.onclick = () => pickKind(k);
      c.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pickKind(k); } };
      qCells.push(c);
    }
    return c;
  };
  add(quad, el('div'), el('div', 'ax', '수익'), el('div', 'ax', '손실'),
    el('div', 'ax', '지킴'), cell('q-ok', 'ok', q.ok, RV_BADGE.ok), cell('q-chk', 'chk', q.chk, RV_BADGE.chk),
    el('div', 'ax', '어김'), cell('q-luck', 'luck', q.luck, RV_BADGE.luck), cell('q-exec', 'exec', q.exec, RV_BADGE.exec));
  add(s1, quad);

  const vio = arr(rv.violations);
  if (vio.length) {
    const max = Math.max(1, ...vio.map(v => num(v[1]) ?? 0));
    const bars = el('div', 'rv-bars');
    vio.forEach(v => { const r = el('div', 'r'); const tr = el('span', 'tr'); const i = el('i'); i.style.width = Math.round((num(v[1]) ?? 0) / max * 100) + '%'; add(r, el('span', 'lab', v[0]), add(tr, i), el('span', 'n', String(v[1]))); bars.appendChild(r); });
    add(s1, bars);
  }

  const mtHead = sec('매매', '최근 순', 'mt', 'review.trades');
  add(s2, mtHead);
  /* 9/28 `복기매매묶음` : 묶음 단추 — 누르면 카드를 숨기고 보이기만(다시 그리지 않음 — 펴 둔 ? · 펼친 주문 기록 그대로). 숫자는 카드 수뿐 */
  const grpOf = trades.map(rvGroup);
  if (!RV_KGRP[RV_KIND] || !trades.some((t, i) => grpOf[i] === RV_KGRP[RV_KIND] && t.kind === RV_KIND)) RV_KIND = '';
  if (RV_KIND) RV_GRP = RV_KGRP[RV_KIND];
  if (!RV_GRPS.some(g => g[0] === RV_GRP)) RV_GRP = 'kept';
  const grpRow = el('div', 'rv-grp'); grpRow.setAttribute('role', 'group'); grpRow.setAttribute('aria-label', '매매 묶음 고르기');
  const cards = [];
  const none = el('div', 'empty');
  /* 11/11 `복기네칸거르기` : 네 칸으로 거른 동안만 보이는 한 줄 — '● 정상만 12건 · ' + [전체 보기 ✕](누르면 그 묶음 전체) */
  const kf = el('div', 'rv-kf'); const kfTxt = el('span'); const kfX = el('button', null, '전체 보기 ✕'); kfX.type = 'button';
  kfX.onclick = () => { RV_KIND = ''; showGrp(); };
  add(kf, kfTxt, kfX);
  const showGrp = () => {
    grpRow.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.grp === RV_GRP ? 'true' : 'false'));
    let n = 0;
    cards.forEach(c => { const on = c.dataset.grp === RV_GRP && (!RV_KIND || c.dataset.kind === RV_KIND); c.hidden = !on; if (on) n++; });
    none.textContent = (RV_GRPS.find(g => g[0] === RV_GRP) || RV_GRPS[0])[2]; none.hidden = n > 0;
    qCells.forEach(c => c.setAttribute('aria-pressed', c.dataset.kind === RV_KIND ? 'true' : 'false'));
    kf.hidden = !RV_KIND; kfTxt.textContent = RV_KIND ? `${RV_BADGE[RV_KIND]}만 ${n}건 · ` : '';
  };
  const pickKind = k => {
    const off = RV_KIND === k;
    RV_KIND = off ? '' : k; RV_GRP = RV_KGRP[k];
    showGrp();
    if (off || window.matchMedia('(min-width:860px)').matches) return;   /* 두 열(PC)은 매매가 옆에 보인다 — 한 열(폰)일 때만 매매 제목까지 내림(위 고정 머리 높이만큼 덜) */
    const stick = document.getElementById('stick');   /* 바로 옮긴다(화면의 다른 scrollTo 와 같게) — behavior 'smooth' 는 앱 미리보기 창 · 헤드리스에서 한 칸도 안 움직였다(11/11 실측) */
    window.scrollTo(0, Math.max(0, mtHead.getBoundingClientRect().top + window.scrollY - (stick ? stick.offsetHeight : 0) - 8));
  };
  RV_GRPS.forEach(([k, name]) => {
    const b = el('button', null, `${name} ${grpOf.filter(g => g === k).length}`); b.type = 'button'; b.dataset.grp = k;
    b.onclick = () => { if (RV_GRP === k && !RV_KIND) return; RV_GRP = k; RV_KIND = ''; showGrp(); };
    add(grpRow, b);
  });
  add(s2, grpRow);
  add(s2, kf);
  const leg = el('div', 'rv-legend');
  [['y', 'm-y', '지킴'], ['n', 'm-n', '어김'], ['na', 'm-na', '해당 없음'], ['q', 'm-q', '사람 확인 필요']].forEach(([k, c, t]) => { const s = el('span'); add(s, el('i', 'mk ' + c, RV_MARK[k]), document.createTextNode(t)); leg.appendChild(s); });
  add(s2, leg);
  add(s2, none);
  const acctOn = new Set(trades.map(t => t.account).filter(Boolean)).size > 1;   /* 10/20 `복기손익색` : 계좌가 하나뿐이면 머리 줄에 별칭을 안 붙인다(사용자 결정 — 지금은 연습계좌 하나). 둘 이상이 되면 다시 붙는다 */

  trades.forEach((t, ti) => {
    const kind = RV_BADGE[t.kind] ? t.kind : 'ok';
    /* 보유 중 = '예외 · ' 칩 글자에 '보유 중' — 배지 '○ 보유 중' · 띠 회색(시험 배지 .b-skip · .rv-trade.skip 과 같은 모양). 묶음은 t.kind 로 가리므로 class 는 모양만. ✕ 는 규칙 줄에 그대로 */
    const hold = rvExc(t).some(s => s.indexOf('보유 중') >= 0);
    const card = el('article', 'rv-trade ' + (hold ? 'skip' : kind));
    card.dataset.grp = grpOf[ti]; card.dataset.kind = String(t.kind ?? ''); cards.push(card);
    const th = el('div', 'rv-th');
    /* 10/20 `복기손익색` : 수익 = 빨강 · 손실 = 파랑(t.rate = 수수료 · 세금 뺀 수익률) — 종목명과 배지 앞 숫자. 0 = 회색 '0.0%' · 보유 중 = 색 · 숫자 없음 · 시험 매매도 손익대로(돈이 오간 사실 — 회색 띠 · 배지가 '복기 제외' 를 말한다) */
    const nmSg = hold ? '' : rvSign(t.rate);
    add(th, el('span', 'nm' + (nmSg ? ' rv-' + nmSg : ''), t.name), el('span', 'mt', `${t.dates || ''}${acctOn && t.account ? ' · ' + t.account : ''}${t.track ? ' · ' + t.track + '트랙' : ''}`),
      add(el('span', 'rv-rb'), !hold && has(t.rate) ? el('span', 'rv-rt' + (nmSg ? ' rv-' + nmSg : ''), nmSg ? rvPct(t.rate) : '0.0%') : null, el('span', 'rv-badge b-' + (hold ? 'skip' : kind), hold ? RV_HOLD : RV_BADGE[kind])));
    add(card, th);
    /* 9/29 `복기목록접기` : 머리 줄 아래는 덩어리 하나(주문 기록의 into 처럼 클래스 없는 div)에 담아 처음엔 접어 둔다.
       접힌 카드는 아무 데나(틀 여백 포함), 펼친 카드는 머리 줄만 누르면 여닫음 — 덩어리 안(칩 · 표 · 규칙 줄 · 주문 기록) 누름은 거른다.
       키보드(Enter · Space)는 머리 줄에만 — 카드에 달면 '주문 기록' 제목의 Enter · Space 가 카드까지 접는다. 다시 그리면 전부 접힘 */
    const body = el('div'); body.hidden = true;
    th.setAttribute('role', 'button'); th.tabIndex = 0; th.setAttribute('aria-expanded', 'false');
    const flipCard = () => { body.hidden = !body.hidden; th.setAttribute('aria-expanded', body.hidden ? 'false' : 'true'); };
    card.onclick = e => { if (body.contains(e.target)) return; if (body.hidden || th.contains(e.target)) flipCard(); };
    th.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); flipCard(); } };
    const chips = el('div', 'rv-chips');
    arr(t.chips).forEach(c => chips.appendChild(el('span', 'rv-chip' + (c[1] === 'red' ? ' red' : ''), c[0])));
    add(body, chips);
    const kv = el('div', 'rv-kv');
    const cellKv = (k, v, cls) => { const c = el('div'); add(c, el('div', 'k', k), el('div', 'v' + (cls ? ' ' + cls : ''), v)); return c; };
    add(kv, cellKv('매수', t.buy || '—'), cellKv('매도', t.sell || '—'), cellKv('수익률', rvPct(t.rate), 'rate ' + rvSign(t.rate)), cellKv('비중', has(t.weight) ? t.weight + '%' : '—'));
    add(body, kv);
    /* 9/19 사용자 결정 (배치 A) : 금액 두 줄 — pages-export v2.5 가 내보내는 칸이 있을 때만. 계좌는 별칭(account)뿐, 번호 없음 */
    if (has(t.buyAmt) || has(t.asset)) {
      const won = v => { const n = num(v); return n === null ? '—' : (n < 0 ? '−' : '') + Math.abs(Math.round(n)).toLocaleString('ko-KR'); };
      const wonS = v => { const n = num(v); return n === null ? '—' : (n < 0 ? '−' : '+') + Math.abs(Math.round(n)).toLocaleString('ko-KR'); };
      const qp = (q, p) => (num(q) !== null && num(q) > 0) ? won(q) + '주 × ' + won(p) : '—';
      const src = s => { s = String(s || ''); if (s.indexOf('api:') === 0 && s.length >= 12) return 'API ' + (+s.slice(8, 10)) + '/' + (+s.slice(10, 12)); if (s === 'manual') return '수동'; return ''; };
      const kv2 = el('div', 'rv-kv');
      add(kv2, cellKv('매수 금액', won(t.buyAmt)), cellKv('매도 금액', won(t.sellAmt)), cellKv('순손익', wonS(t.net), 'rate ' + rvSign(t.net)), cellKv('수수료·세금', has(t.fee) ? won(t.fee) + (t.feeKnown ? '' : ' ?') : '—'));
      add(body, kv2);
      const kv3 = el('div', 'rv-kv');
      add(kv3, cellKv('매수 수량 × 단가', qp(t.buyQty, t.buyAvg), 'sm'), cellKv('매도 수량 × 단가', qp(t.sellQty, t.sellAvg), 'sm'), cellKv('추매 금액', won(t.addAmt), 'sm'),
        cellKv('추정자산', has(t.asset) ? won(t.asset) + (src(t.assetSrc) ? ' (' + src(t.assetSrc) + ')' : '') : '—', 'sm'));
      add(body, kv3);
    }
    if (arr(t.base).length) add(body, rvSegs(el('div', 'rv-base'), t.base));
    const rules = el('div', 'rv-rules');
    arr(t.rules).forEach(g => {
      const gh = el('div', 'g', g[0]); rules.appendChild(gh);
      /* 9/28 `복기매매묶음` : '주문 기록' 묶음만 접어 둔다 — 제목 줄을 누르기 · Enter · Space 로 펼침/접힘, 건수는 안 붙임(기록이지 검사가 아니고 횟수를 세지 않는다 — review-build v1.7) */
      let into = rules;
      if (g[0] === '주문 기록') {
        into = el('div'); into.hidden = true;
        gh.classList.add('rv-og'); gh.setAttribute('role', 'button'); gh.tabIndex = 0; gh.setAttribute('aria-expanded', 'false');
        const flip = () => { into.hidden = !into.hidden; gh.setAttribute('aria-expanded', into.hidden ? 'false' : 'true'); };
        gh.onclick = flip; gh.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); flip(); } };
      }
      arr(g[1]).forEach(it => {
        const mk = RV_MARK[it[0]] ? it[0] : 'q';
        const r = el('div', 'rv-rule'); const sp = el('span', null, it[1]);
        if (has(it[2])) sp.appendChild(el('span', 'why', it[2]));
        add(r, el('i', 'mk m-' + mk, RV_MARK[mk]), sp); into.appendChild(r);
      });
      if (into !== rules) rules.appendChild(into);
    });
    add(body, rules);
    if (has(t.say)) add(body, el('div', 'rv-say', t.say));
    add(card, body);
    add(s2, card);
  });
  showGrp();

  const foot = el('p', 'rv-foot');
  add(foot, el('b', null, '공개 항목'), document.createTextNode(' : 종목 · 계좌 별칭 · 매수·매도 시각 · 수익률 % · 비중 % · 규칙 체크 · 네 칸 분류 · 금액 · 수량 × 단가 · 순손익 · 수수료·세금 · 추매 금액 · 추정자산 (9/18 밤 사용자 결정으로 금액 공개)'), el('br'),
    el('b', null, '올리지 않는 것'), document.createTextNode(' : 주문번호 · 종목코드 · 계좌번호 (계좌는 별칭만)'), el('br'),
    document.createTextNode('수익률은 수수료·세금을 뺀 값 · 비중은 매수 직전 추정자산 대비 · 후보는 15:20 판정 · 거래대금 KRX+NXT 통합(9/17 부터) · 가격 KRX'));
  add(box, foot);
  if (CUR === 'review') setHero('review');
}

   "폰 화면의 이 표시가 무슨 뜻이고 보고 나서 뭘 하나" 만 답한다. 규칙이 강의 어디서 왔나는 강의기준_대조표(M·T·D·C·P·E·S·U 번호),

    ['범례 아래 숫자 줄', '평소에는 마지막 봉의 시각과 지수 · 이평 값. 그림을 짚고 옆으로 움직이면 세로선이 선 그 봉의 값으로 바뀌고, 손을 떼면 마지막 봉으로 돌아간다. 일봉은 날짜(장중 오늘 점은 5분봉 시각).'],
    ['몇 시 봉까지', '실시간이 아니다 — 장중(09:01~15:41)에는 5분마다 받은 봉까지. 화면을 열어 두면 1분마다 새 봉이 왔는지 확인해 이 그림만 바꾼다(올라오는 데 1~2분). 다른 구역은 그대로 회차(매시 07분쯤 · 14:52 · 15:27) 자료. 15:30 종가 봉은 장 마감 뒤 회차에 실린다.'],
    ['판정과 무관', '보기만 하는 그림. 판정 · 채점에 안 들어가고 기준값도 없다 — 시장 판단은 관문1(M1 · M2)과 그 참고 줄(M6) — 15:50 확정 알림. 5 · 20일선은 강의 M6 이 말하는 선을 그리기만 한다 — 위/아래 색이나 "조심" 표시는 없다(판단은 사람).']],
  'live.flow': [
    ['막대 (빨강 / 파랑)', '티마 카드(섹터)마다 회차별 모멘텀 = 그 구간에 들어온 돈의 비중 − 누적 비중(%p). 빨강 = 양수(돈이 더 들어오는 중, 가속), 파랑 = 음수(아침에 끝난 테마, 감속). 막대 길이는 09:00~15:20 최대값 기준 — 15:40(종가 단일가 유입) · 저녁 막대는 같은 눈금이라 넘치면 꽉 찬 막대. 이슈가 살아있나(T6) · 무게추가 어디로 가나(T5)를 보는 자리.'],
    ['섹터 이름 옆 %', '집중도 = 그 카드 상위 4종목 거래대금 ÷ KRX+NXT 통합 상위100 주식 합 (9/17 부터. 9/16 까지는 KRX 거래대금 ÷ KRX 시장 총거래대금이라 숫자가 작다). "시장의 돈이 어디 있나"(M7). 정렬에만 쓰고 기준값은 없다.'],
    ['가속 · 감속 · 양수 n/m', '마지막 회차 모멘텀의 부호와, 기록된 회차 중 양수였던 횟수. 판정은 15:20 한 구간 값만 쓴다 — 하루 흐름은 판정에 안 들어간다.'],
    ['카드 2장 13시', '같은 회차 티마에 같은 이름 카드가 두 장 있었다(섹터 금액 큰 쪽을 씀).'],
    ['괴리', '거래대금 1위와 등락률 1위가 다른 종목. 대장은 거래대금 1위(D2 실질적 대장)이고, 사람이 차트로 확인한다(관문4).'],
    ['▾ 종목 순위 보기', '섹터를 누르면 회차별 카드 안 누적 거래대금 순위표. 빨간 칸 = 1위 · ₩ = 그 구간 돈이 가장 많이 들어온 종목 · — = 카드 4종목에 없음. "대장 변천" = 1위가 바뀐 흐름(D3 1·2등 체인지 유의). 우선주(주황) = 매매하지 않는 종목(사용자 결정 9/15), 표시만. 신규주(주황) = 상장 30일(달력일) 이내 — 매수 기준 밖(사용자 결정 9/29), 표시만. (k) = KRX 전용(NXT 불가) — 다음날 매도 09:00 부터, 없으면 NXT 도 되는 종목이라 08:00 부터. 머리글은 이름 칸 때문에 좁아서 같은 시가 이어지면 분 위첨자만(15 ²⁰ ⁴⁰ = 15:00·15:20·15:40).'],
    ['15:20 에 없는 카드', '마지막 회차 카드에서 사라진 섹터. 테마 종료 · 이름 바뀜 · OCR 오독 중 하나.'],
    ['점선 (16:00 앞) · 머리글 15²⁰', '점선 오른쪽 = KRX 애프터마켓(16:00~20:00, 9/14 개설) 회차. 열 머리글은 시 + 작은 위첨자 분 — 정각은 시만(10 · 18), 나머지는 15²⁰ · 15⁴⁰ · 19⁵⁰ · 20⁰²(= 15:20 …). 15:20 을 그대로 쓰면 옆 칸과 겹쳐서(9/16 밤, 사용자 결정). 15:40 은 장후 시간외 종가라 점선 왼쪽. 같은 계산(통합 스냅 금액 · 통합 상위100 분모 — 9/17 부터)이지만 판정은 15:20 한 구간뿐 — 저녁 흐름은 관찰만(사용자 결정 9/15).']],
  'live.inq3': [
    ['누적 n · 1시간 n · 10분 n (둘째 줄)', '키움 실시간 종목조회 순위를 세 간격(당일 누적 · 1시간 · 10분)으로 받은 각 20위 표에서 그 종목의 순위. 세 표 모두 20위 안인 종목만, 당일누적 순위 순. 제목 시각 = 15:20 이하 마지막 수집 회차(15:02 화면이면 15:00, 15:12 화면이면 15:10, 저녁에는 15:20) — 회차 사이의 순위는 모른다. 키움은 당일누적 표를 30분, 1시간 표를 정각마다 새로 매겨서 15:10 · 15:20 회차의 이 두 표는 15:00 것과 같고, 10분 표만 새 값이다.'],
    ['등락률 (윗줄 오른쪽) · [n위] n억 (둘째 줄 오른쪽)', '등락률 = 그 회차 10분 표의 값(10분 단위 기준 시각 — 정각 회차면 거의 그 시각). [n위] 와 n억 = 같은 회차 KRX+NXT 통합 거래대금 100위 안 순위와 누적 거래대금. 100위 밖은 금액 없음. "상위" 숫자 기준은 없다 — 금액을 보고 사람이 가린다.'],
    ['섹터명 (이름 앞)', '같은 회차 티마 카드의 섹터명. 두 카드에 든 종목은 · 로 둘 다, 카드에 없으면 안 붙는다. 15:10 회차(15:12 화면)는 이름표 전용 티마 캡처(10/16 부터)의 섹터명 — 판정 계산에는 안 들어가 15:20 판정은 그대로다. 그 전 날짜 · 그 캡처가 실패한 날은 아무 종목에도 안 붙는다.'],
    ['(005930) (이름 뒤)', '그 종목의 6자리 종목코드 — 키움 조회순위 자료의 코드 그대로. HTS 에서 찾을 때 쓴다. 종목명이 그어져도 코드는 긋지 않는다. 표시만 — 판정 · 채점에 안 쓴다.'],   // 10/20 `세표종목코드`
    ['-25% (코드 뒤)', '120일 신고가 선까지의 거리 = 현재가 ÷ 선 − 1, 정수로 반올림. 선 = 키움 KRX 일봉 고가(꼬리 끝) 120봉 중 가장 높은 값, 오늘 봉 포함 — HTS #신고가 수식 highest(h, 120) 과 같다. 그래서 0% 이하이고, 0% 는 선에서 0.5% 안(정수 반올림) — 사실상 120일 신고가 자리. 현재가 = 그 회차 수집 끝에 받은 KRX 현재가 — 15:20 카드는 15:40 에 다시 받은 그날 15:30 종가(15:27 화면은 15:20 무렵 값). 상장 120거래일이 안 된 종목은 상장 뒤 전체 봉. 값을 못 받은 종목은 비운다. HTS 차트 오른쪽 위 HC 는 화면에 보이는 기간의 최고가 대비라 이 값과 다르다. 보기만 — 판정 · 채점에 안 쓴다.'],   // 10/29 `세표120고가` · 11/8 이월 11 '0% 는 선에서 0.5% 안' (사용자 승인 문구)
    ['-13% 칩 (코드 뒤)', '위 거리가 25% 안(화면 숫자로 -24% 까지)인 종목은 숫자를 칩으로 표시한다. 종목명이 그어진 종목은 칩 없이 숫자만 — 훑을 때 건너뛰라는 표시와 겹치지 않게. 25 는 사용자가 정한 숫자로 강의 기준이 아니다. 판정 · 채점에 안 쓴다.'],   // 11/2 `세표25칩`
    ['종목명 · (005930) 누르기', '안드로이드에서 종목명을 누르면 영웅문S# 호가주문, (005930) 을 누르면 종목차트가 그 종목으로 바로 바뀐다(확인 창 없음). 화면만 바꾸고 주문은 안 낸다 — 주문 전에 영웅문 쪽 종목명을 본다. 반응이 없거나 오류 화면이면 키움이 주소를 바꾼 것 — 뒤로 가기 뒤 돋보기로. PC 에서는 누를 수 없다.'],   // 10/22 `세표영웅문링크` · `세표차트링크` (사용자 결정 A안 — 예시 글자 그대로)
    ['♡ · ♥ (등락률 옆)', '눌러서 그 종목을 고른다(♥) — 고른 종목은 제목 밑 \'관심\' 띠에 모인다. 다시 누르면 빠진다(♡). 대금 35위 밖 접힘 안 종목도 고를 수 있다. 사람이 고른 표시일 뿐 — 판정 · 채점 · 정렬 · 기록에 안 쓴다.'],   // 11/12 `세표관심` (사용자 승인 문구 그대로)
    ['관심 n (제목 밑 띠)', '고른 순서대로 한 종목 한 줄 : ★·☆ · 종목명(카드와 같은 취소선 · 안드로이드면 누르면 영웅문 호가주문) · 누적 · 1시간 · 10분 순위 · 등락률. 지금 회차 세 표에 없는 종목은 이름이 회색이고 \'이 회차 세 표 밖\'. 띠의 ♥ 를 누르면 빠진다. 이 폰 브라우저에만 날짜별로 남는다 — 다음 날은 빈 띠, 다른 폰 · PC 에는 안 보이고, 브라우저 사이트 데이터를 지우면 사라진다.'],
    ['~~종목명~~ 취소선', '훑을 때 건너뛰라는 표시 — 다섯 중 하나면 긋는다. ① 거래대금 35위 밖(100위 밖 포함) — 이 종목은 위 목록에서 빠져 아래 ▸ 대금 35위 밖 접힘 안에 그어진 채로 있다. 35 = 강의 당일주도주 검색식의 "거래대금 순위 상위 35"(대조표 C4). 대금 순위 값이 없으면(윗줄 · 둘째 줄 오른쪽이 빈 줄) 이 이유로는 긋지 않고 위에 둔다. ② 섹터명이 개별이슈뿐 — 다른 테마 카드에도 들면 긋지 않는다. ③ 종목명에 레버리지. ④ 섹터명 없음 = 그 회차 캡처된 티마 카드(카드당 4종목)에 없는 종목 — 테마주라도 그 회차 카드 4종목 밖이면 그어진다. 그 회차 티마 캡처가 없으면(10/16 전의 15:12 화면 · 캡처 실패) ② · ④ 는 모르므로 긋지 않는다. ⑤ 신규주 = 상장 30일 이내("신규주" 표시와 같은 목록, 섹터명과 무관) — 상장일을 모르는 종목은 긋지 않는다. 판정에 안 쓴다 — ★ · ☆ · 코드 · 오른쪽 숫자 · 둘째 줄부터는 그대로 둔다.'],   // 10/19 세표35숨김 (사용자 결정) : ① 은 접힘 안에서 보인다
    ['15위 안 n/m회차 (셋째 줄 오른쪽)', '09:00 칸부터 제목 회차 칸까지 자료가 있는 10분 칸 m 개 중 이 종목이 세 표 모두 15위 안이었던 칸 n 개. 칸 = 키움 10분 표의 기준 시각(09:00 · 09:10 … 15:20, 하루 39칸) — 수집 회차의 칸(09:05 회차 = 09:00 칸 · 10:00 ~ 14:00 정각 · 14:50 · 15:00 · 15:10 · 15:20)은 수집 회차 자료, 나머지 29칸은 따로 10분마다 받는 자료다. 자료가 없는 칸은 m 에 안 세고, 한 간격만 못 받은 칸은 m 에 세고 n 에 안 센다. 카드에 나오는 종목은 제목 회차에 세 표 모두 20위 안인 종목 그대로 — 칸 수만 15위로 센다(사용자가 정한 숫자). 누르면 그래프가 펼쳐진다(▸ → ▾). 10분 자료가 없는 날(11/11 까지)은 칸 대신 수집 회차(약 1시간)로 센다 — ▸ · 그래프 없음.'],   // 11/11 `세표10분`
    ['★ (이름 앞)', '15위 안 n/m회차 에서 n = m — 09:00 칸부터 제목 회차까지 자료가 있는 모든 10분 칸에서 세 표 모두 15위 안이었던 종목. 첫 칸뿐인 아침엔 15위 안 종목이 모두 붙고, 한 간격이라도 못 받은 칸이 있는 날은 아무도 안 붙는다(n/m 과 같은 뜻 — 칸 수 하한은 두지 않는다). 10분 자료가 없는 날은 칸 대신 수집 회차로 같은 뜻(n = m).'],   // 11/11 `세표10분`
    ['☆ (이름 앞)', '15위 안 n/m회차 에서 빠진 칸(m − n)이 m 의 10% 미만인 종목 — 딱 10% 는 안 붙는다. 15:02 화면(37칸)은 3칸 빠짐까지 ☆, 4칸이면 없음 · 오전은 10:40 칸(11칸)이 오기 전엔 한 칸만 빠져도 없음. 어느 칸이 빠졌는지는 ▸ 그래프로 본다. 10% 는 사용자가 정한 숫자로 강의 기준이 아니다. 못 받은 칸이 있는 날은 원래 ★ 종목이 ☆ 로 나올 수 있다(n/m 과 같은 뜻). 10분 자료가 없는 날은 옛 뜻 — n = m − 1(딱 한 수집 회차만 빠짐, 09:05 화면 0/1 엔 안 붙음).'],   // 11/11 `세표10분` (사용자 결정 10%)
    ['수집 실패 · 수집 전', '그 회차에 한 간격이라도 못 받았으면 겹침을 세지 않고 못 받은 간격만 한 줄. 그래프에서는 한 간격을 못 받은 10분 칸이면 그 줄 칸이 빈 자리 · 겹침 줄은 안 겹침 색(m 에 세고 n 에 안 셈), 그 칸 자료가 아예 없는 지난 칸이면 네 줄 모두 빈 자리(m 에 안 셈). 세 간격 수집은 10/7 부터라 그 전 날짜는 "수집 전" 한 줄뿐 — 키움 조회에 날짜 칸이 없어 지난 날짜로는 만들 수 없다(10분 칸도 같은 이유로 11/12 부터).'],   // 11/11 `세표10분`
    ['그래프 (▸ 를 눌러 펼친 칸)', '셋째 줄 오른쪽 "15위 안 n/m회차 ▸" 를 누르면 그 종목 줄 끝에 펼쳐지고(▾) 다시 누르면 접힌다 — 처음엔 모두 접힘. 가로 = 09:00 ~ 15:20 의 10분 칸 39개(위 숫자 9 ~ 15 = 시), 네 줄 = 누적 · 1시간 · 10분 표의 그 칸 순위와 겹침. 칸 색 : 빨강 = 15위 안 · 연분홍 = 16 ~ 20위 · 옅은 칸 = 20위 밖, 겹침 줄은 세 표 모두 15위 안인 칸만 진한 색(나머지는 옅은 칸). 아직 안 온 칸 · 자료 없는 칸 · 못 받은 간격은 빈 자리. 밑 글 = 처음 겹친 칸과 지금 겹침이 몇 칸째 이어지는지("지금 연속 n회차" 의 회차 = 10분 칸, 끊겼으면 마지막 겹친 칸) · 겹친 칸이 없으면 "15위 안 겹침 없음". 10분 자료가 없는 날은 ▸ · 그래프가 없다. 보기만 — 정렬 · 판정 · 채점에 안 쓴다.'],   // 11/11 `세표10분` (승인 시안)
    ['▸ 대금 35위 밖 n종목', '세 표 모두 20위 안인 종목 중 거래대금 35위 밖(100위 밖 포함 — 취소선 ①)을 위 목록에서 빼 카드 밑에 접어 둔 것 — 누르면 펼쳐진다. 대장 후보(35위 안)를 빨리 훑게 하려는 것(10/19 사용자 결정). 안의 줄 모양 · 순서(당일누적 순)는 위와 같다. 35위 밖이 없으면 이 줄이 없고, 모두 35위 밖이면 위에 "대금 35위 안 종목 없음". 대금 순위 값이 없는 종목과 ② ~ ④ 로만 그어진 종목은 위에 그대로 둔다. 판정에 안 쓴다.'],   // 10/19 세표35숨김 (사용자 결정)
    ['[1억 | 8,600원 | 1.75억] 연분홍 칩 (셋째 줄 왼쪽)', '호가 한 칸 1억 통과 — 대조표 C10(강의 "1억을 세팅하라"). 그 회차 수집 끝에 받은 KRX+NXT 통합 호가의 매수 1~10호가 중 한 칸이라도 가격 × 잔량이 1억 이상이면 붙는다. 칩 안 세 칸(얇은 세로 선으로 가름) = 1억 통과 | 가장 두꺼운 매수 칸의 가격 | 그 칸 금액(억, 소수 둘째 자리). 이 카드에서 강의 숫자로 색을 가르는 것은 이 칩뿐이다.'],
    ['[1억 없음 | 최대 0.37억] 점선 칩', '매수 10칸 모두 1억 미만 — 숫자는 가장 두꺼운 칸의 금액(칸막이 선도 점선). C10 은 미달이면 그 종목은 사지 않는다는 기준이지만, 빼는 것은 사람(관문6)이 한다 — 화면이 종목을 지우지 않는다.'],
    ['호가? (회색 칩)', '그 회차 호가를 못 받았다는 표시 — 1억이 없다는 뜻이 아니다(조회 실패 · 시간 초과 · 토큰 없음 · 그 회차 호가 파일 없음). 15:20 카드에선 15:10 에 호가를 안 받은 종목(15:20 에 10분 표에 새로 든 종목)도 호가? 다. 호가 칩은 10/19 부터라 그 전 날짜엔 아무 칩도 없다.'],
    ['호가 칩은 순간 값', '09:05 ~ 15:20 수집 회차 끝에 한 번 받은 값이다(14:50 · 15:00 · 15:10 · 15:20 은 경고칩 계산이 끝난 뒤라 조금 늦다). 호가는 1초 뒤에도 바뀌고 걸었다 빼는 물량도 있어 사기 직전엔 HTS 호가창으로 다시 본다. 15:20 카드(15:27 · 저녁 · 다음 날 아침 화면)의 칩은 15:10 회차 호가다 — 15:20 회차는 종가 동시호가 중이라 키움이 매수 칸을 3칸 · 몇십 주만 줘서 화면에 쓰지 않는다. 판정 · 채점에 안 쓴다.'],
    ['[단기과열] 채운 칩 (넷째 줄 — 경고칩이 있는 종목만)', '오늘 이미 걸린 상태 — 07:30 종목마스터(키움 종목정보)의 값 그대로 : 단기과열 · 투자경고 · 투자위험 · 정리매매 · 투자주의 · 관리종목 · 거래정지 · 환기종목(투자주의환기종목). 지정 · 해제는 장 마친 뒤 공시라 아침 값을 쓴다. 키움 칸 하나가 관리종목 · 거래정지 · 환기종목이면 그 이름이 보이는 대신 투자주의는 가려질 수 있다.'],
    ['[단기과열 예고] 점선 칩', '오늘 이 가격으로 마감하면 요건에 닿는다 — 뉴하트 1강 HTS 수식(단기과열적출 · 단기과열발동 · 투자경고예고)을 글자 그대로 키움 일봉(KRX 단독)에 넣어 계산. 오늘 봉 = 그 회차(14:50 · 15:00 · 15:10 · 15:20) 진행 값이라 마감 값과 다를 수 있다. 지난 종가는 정규장 15:30 종가로 되돌려 쓰지만 고가 · 저가 · 거래대금은 애프터마켓 체결이 섞인 값이다. 영웅문 HTS 일봉 화살표는 애프터마켓까지 든 종가로 그려서 가끔 하루 갈린다(10/13 대조 10종목 25거래일 중 3일 — 동양고속 10/8 예고 · 코셈 9/28 · 9/29). 같은 종류가 이미 지정이면(단기과열 → 단기과열 예고 · 발동, 투자경고 · 투자위험 → 투자경고 예고) 안 보인다. 우선주 · 일봉이 56일 안 되는 신규주는 계산하지 않는다(칩 없음).'],
    ['지정? · 요건? (회색 칩)', '모른다는 표시 — 칩이 없는 것(해당 없음)과 다르다. 지정? = 종목마스터가 오늘 것이 아님(07:30 갱신 실패) · 투자주의 칸이 없는 마스터 · 이 종목 계산 기록 없음. 요건? = 일봉을 못 받음 · 오늘 봉 없음 · 종가 되돌리기 실패 · 토큰 없음 · 시간 초과(이유 수는 제목 밑 줄).'],
    ['경고칩 줄 (제목 밑)', '14:50 · 15:00 · 15:10 · 15:20 수집 회차 끝에 계산한다(화면보다 약 2분 앞 값). "경고칩 hh:mm:ss 계산 · 마스터 m/d" = 그 회차 계산 시각과 쓴 종목마스터 날짜, 뒤의 불명 · 실패 · 시간초과 = 이 카드에 보이는 종목 중 회색 칩 수. "경고칩 없음 — 이 회차 계산 안 됨" = 그 회차 계산 파일이 없다 — 종목 줄에 칩이 없어도 해당 없음이 아니다. 15:20 카드는 줄 끝에 "· 호가 hh:mm:ss" — 호가 칩이 쓴 15:10 호가를 받은 시각. 관문6(사람 판단)을 돕는 표시일 뿐 판정 · 채점에 안 쓴다.'],
    ['기준 없음', '세 간격 · 14위는 사용자 매수 습관이지 강의 기준이 아니다(강의 D7 은 30초 간격 유지, 5위 이내는 상따 문맥). 그래서 순위 값에 따른 기준선 · 색은 없다(굵은 숫자는 글자와 가르는 모양일 뿐, ★ 은 사용자 숫자 15 의 모든 칸, ☆ 은 빠진 칸 10% 미만 — 10분 자료가 없는 날은 한 회차 빠짐) — 14 는 사람이 눈으로 본다. 관문6(사람 판단)을 돕는 표시일 뿐 판정 · 채점에 안 쓴다.']],
  'series.overlap': [
    ['칸 숫자', '그 회차에 걸린 기준 수(진할수록 많음). 2개 이상 걸린 적 있는 종목만. 몇 개인가는 관찰이지 판정 조건이 아니다.'],
    ['n시에 2개 이상', '마지막 회차에 두 기준 넘게 걸린 종목과 언제부터인지.'],
    ['(k) — 격자 다섯 장 공통', 'KRX 전용 종목(NXT 불가). 다음날 매도 09:00 부터, 없으면 NXT 도 되는 종목이라 08:00 부터. 이름은 조건검색 · 조회순위 · 티마 종목 행의 코드로 맞춘다 — 티마 대장(OCR 이름)에만 걸린 종목은 코드가 없어 표시 없음.'],
    ['점선 (16:00 앞) — 격자 공통', '점선 오른쪽 = 애프터마켓 회차(16:00~20:02). 조건검색 · 조회순위도 저녁에 그대로 수집한다. 관찰만, 판정은 15:20.'],
    ['섹터명 (이름 위) — 격자 다섯 장 공통', '15:20(장중엔 지금까지 마지막 회차) 티마 카드의 섹터명. 빈칸 = 그 회차 캡처된 티마 카드(카드당 4종목)에 없는 종목. 두 카드에 든 종목은 · 로 둘 다. 관찰 표시일 뿐 판정에 안 쓴다.']],
  'series.tima': [
    ['●', '그 회차 티마 카드 한 장의 누적 거래대금 1위(●2 = 카드 두 장). 개별이슈 카드 제외, 이름은 OCR 글자 그대로.']],
  'series.lead': [
    ['칸', '영웅문 조건검색 당일주도주_강의(C4 거래대금 + 등락률)에 그 회차 걸린 종목. 숫자 = 등락률 반올림, 빈칸 = 안 걸림.'],
    ['본표 · 접힘', '15:20(장중엔 지금까지 마지막 회차)에 걸린 종목만 본표 — 판정이 당일주도주포함 칸에 적는 것과 같은 회차(C4·C5). 오전에만 걸렸다 빠진 종목 등 나머지는 아래 접힘. 저녁 회차는 기준에서 뺀다(관찰만). 화면 기준일 뿐 판정에 안 쓴다.']],
  'series.high': [
    ['칸', '영웅문 조건검색 120일 신고가_강의(C3)에 그 회차 걸린 종목. 숫자 = 등락률 반올림, 빈칸 = 안 걸림.'],
    ['본표 · 접힘', '당일주도주 카드와 같은 규칙 — 15:20(장중엔 지금까지 마지막 회차)에 걸린 종목만 본표, 나머지는 아래 접힘. 판정의 120신고가포함 칸과 같은 회차. 화면 기준일 뿐 판정에 안 쓴다.']],
  'series.inq': [
    ['숫자 · 굵게', '1시간마다 찍은 1분 스냅샷(D7). 숫자 = 그 회차 조회순위, 굵게 = 5위 안, 빈칸 = 20위 밖.'],
    ['스냅샷의 한계', '회차 사이에 잠깐 오른 종목은 안 잡힌다 — 오래 걸려 있는 종목을 보는 표.'],
    ['본표 · 접힘', '5위 안(굵은 칸)에 2회 이상 든 종목만 본표. 나머지(2회 미만 · 11~20위만)는 아래 접힘. D7 "5위 이내 꾸준히" 를 회차로 센 화면 기준이라 판정에 안 쓴다.']],
  'review.sum': [
    ['기준 준수율', '규칙을 다 지킨 매매 ÷ 전체.'],
    ['연속 손실', '손실 날이 이어진 날수 — 그날 산 종목들의 순손익 합이 마이너스인 날. 쉬는 날 판단은 계좌 규칙(대조표 8절).'],
    ['지킨 / 어긴 매매 평균 수익률', '수수료 · 세금을 뺀 수익률의 평균. 두 값이 벌어지면 기준은 맞고 실행이 문제였다는 뜻.'],
    ['네 칸', '지킴 × 수익 = 정상 / 지킴 × 손실 = 기준 점검(기준이 틀렸나, 월 1회 점검 재료) / 어김 × 수익 = 운(가장 위험, 습관이 된다) / 어김 × 손실 = 실행 문제(내가 안 지켰나). 칸을 누르면 매매 목록에 그 칸의 매매만 보인다(폰은 매매 제목까지 내려 간다) — 같은 칸을 다시 누르거나 \'전체 보기 ✕\' · 묶음 단추를 누르면 풀린다. 0건 칸은 안 눌린다.'],
    ['어긴 유형 막대', '어긴 규칙별 건수. 누적 밖 카드(보유 중 · 당일 매도 · 이틀 이상 보유 · NXT·애프터 매수만)의 ✕ 도 센다 — 시험 매매만 뺀다.']],

// 9/13 : 터치로 좌우로 밀면 옆 탭 (왼쪽으로 밀면 다음 탭). 양 끝에서는 멈춤.
// 화면 가장자리 24px 안에서 시작한 밀기는 폰의 뒤로 가기 몫이라 무시.
// 나중에 옆으로 스크롤하는 넓은 표를 넣으면 그 요소에 data-noswipe 를 붙인다.
let SWIPE = null;
document.addEventListener('touchstart', e => {
  const t = e.touches[0];
  SWIPE = null;
  if (e.touches.length !== 1 || t.clientX < 24 || t.clientX > window.innerWidth - 24) return;
  if (e.target.closest && e.target.closest('input, select, textarea, [data-noswipe]')) return;
  SWIPE = { x: t.clientX, y: t.clientY, at: Date.now() };
}, { passive: true });
document.addEventListener('touchend', e => {
  const s = SWIPE; SWIPE = null;
  if (!s || e.touches.length) return;
  const t = e.changedTouches[0];
  const dx = t.clientX - s.x, dy = t.clientY - s.y;
  if (Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.5 || Date.now() - s.at > 800) return;
  if (String(window.getSelection ? window.getSelection() : '').trim()) return;
  const i = TAB_ORDER.indexOf(CUR) + (dx < 0 ? 1 : -1);
  if (i >= 0 && i < TAB_ORDER.length) switchTab(TAB_ORDER[i], 'swipe');
}, { passive: true });
document.addEventListener('touchcancel', () => { SWIPE = null; }, { passive: true });

function syncStick() {
  const heroH = HERO_EL.offsetHeight;
  const on = window.scrollY > 0;
  STICK.style.setProperty('--heroH', heroH + 'px');
  STICK.classList.toggle('show', on);
  STICK.classList.toggle('past', window.scrollY >= heroH - STICK.offsetHeight);   // 머리가 다 지나간 뒤에만 그림자
  STICK.setAttribute('aria-hidden', on ? 'false' : 'true');
}
window.addEventListener('scroll', syncStick, { passive: true });
window.addEventListener('resize', syncStick);
syncStick();

let LAST_LOAD = 0;
async function loadAll() {
  LAST_LOAD = Date.now();
  const bar = document.getElementById('datebar');
  const sel = bar.querySelector('select');
  // 지난 날짜를 보고 있었으면 그 날짜를 다시, 최근을 보고 있었으면 새 최근을 불러온다
  const viewing = sel && DATES.length && sel.value !== DATES[0] ? sel.value : null;
  let dates = [];
  try { dates = arr((await getJson('data/dates.json')).dates); } catch (e) { }
  DATES = dates.map(String).filter(x => x >= AL_FROM).sort().reverse();   // 9/28 `옛날짜빼기` : 9/16 이전(KRX 자)은 날짜 줄에 안 넣는다
  loadDate(viewing && DATES.includes(viewing) ? viewing : null, DATES);
  try { renderReview(await getJson('data/review.json')); }   // 9/15 : 실자료 (pages-export v1.8). 시안은 화면의 버튼으로
  catch (e) { const b = document.getElementById('review'); b.innerHTML = ''; add(b, el('div', 'empty', '복기 자료를 못 불러왔습니다 : ' + e.message)); }
}
loadAll();
// 9/13 : 홈 화면 앱(특히 아이폰)은 새로고침 버튼이 없어서, 5분 넘게 떠나 있다 돌아오면 자료를 다시 불러온다
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  if (Date.now() - LAST_LOAD > 5 * 60 * 1000) loadAll(); else pollIndexLive(true);   /* 9/17 지수5분 : 5분 안에 돌아왔으면 지수 그림만 확인 */
});
</script>
