<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>종베 기록</title>
<!-- 9/13 : 폰 홈 화면에 앱처럼 추가 -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#7a0c17" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#3e0710" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="종베">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* 9/13 빨강 톤 통일 — 기준 화면 D:\stock\close_mockup_red.html · review_mockup4.html
   꾸밈 = 와인·크림슨·연분홍 / 데이터 = HTS 원색(상승·대장·누적 1위 빨강, 하락 파랑) / 주의 = 주황 */
:root{
  --bg:#fbf5f4;--card:#fff;--card2:#fcf7f7;--soft:#fbf7f7;--line:#f0dfdf;--line2:#f3e6e6;--rule:#ecd9d9;
  --text:#231416;--ink2:#5b3a3d;--sub:#7b6264;--muted:#a98f91;--muted2:#bda3a4;--chip:#f5eded;--chipInk:#5b4447;
  --brand:#c1121f;--wine:#6e0b14;--wineFill:#6e0b14;--rose:#fdecee;--roseLine:#f6ccd1;--roseDash:#e79ba1;--cocoa:#332123;--onFill:#fff;
  --naBg:#efe7e7;--naInk:#9a8a8b;--noteBg:#fff9f9;--noteLine:#e6cccd;
  --meterTrack:#f6dada;--lossTrack:#f3e7e7;--lossFill:#c9a3a5;--barTrack:#f6e4e4;--barA:#a10f1b;--barB:#e5383b;--okRail:#f0b3b8;
  --up:#ff0000;--down:#0000ff;--r1Bg:#ffe3e3;
  --warn:#7a4a06;--warnBg:#faeeda;--warnLine:#ecd3a8;--alert:#b45309;--ok:#2f6b12;--bad:#c1121f;
  --shadow:0 2px 10px rgba(110,11,20,.05);
  --heroA:#7a0c17;--heroFade:rgba(122,12,23,0);--heroB:#c1121f;--heroC:#e5383b;--heroShadow:0 6px 18px rgba(122,12,23,.18);
  --ixM1:#d9480f;--ixM2:#1098ad;--ixM3:#9c36b5;   /* 9/17 지수차트 이평 20·60·120 — 밝은·어두운 카드 배경 둘 다 색각 분리 검증 통과한 값이라 다크에서도 같은 값 */
}
@media (prefers-color-scheme:dark){:root{
  --bg:#140b0d;--card:#1f1215;--card2:#26171b;--soft:#23151a;--line:#3a2529;--line2:#33222a;--rule:#3a2529;
  --text:#f4e8e9;--ink2:#dcc3c6;--sub:#b39699;--muted:#8c7275;--muted2:#75606a;--chip:#2c1c20;--chipInk:#dcc3c6;
  --brand:#f04a56;--wine:#ffb3ba;--wineFill:#7d1320;--rose:#3a1a20;--roseLine:#5a2a32;--roseDash:#8a3a44;--cocoa:#44302f;--onFill:#fff;
  --naBg:#2c1f22;--naInk:#8c7275;--noteBg:#1f1215;--noteLine:#4a2e33;
  --meterTrack:#3a2226;--lossTrack:#33242a;--lossFill:#8c6468;--barTrack:#35211f;--barA:#b3202c;--barB:#f04a56;--okRail:#7a3a42;
  --up:#ff4d4d;--down:#6b7dff;--r1Bg:#4a1717;
  --warn:#fac775;--warnBg:#412402;--warnLine:#6a4a1a;--alert:#e08a3c;--ok:#97c459;--bad:#f09595;
  --shadow:0 2px 10px rgba(0,0,0,.35);
  --heroA:#3e0710;--heroFade:rgba(62,7,16,0);--heroB:#7a0c17;--heroC:#a81c28;--heroShadow:0 6px 18px rgba(0,0,0,.45);
}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 "Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:480px;margin:0 auto;padding:14px 12px calc(32px + env(safe-area-inset-bottom, 0px))}

/* 머리 : 시안 3 틀 + 시안 1 색 + 시안 2 탭 막대 */
/* 9/13 : 윗변은 폰 상태 표시줄 색(theme-color = --heroA) 한 색으로 시작해 아래로 대각선 그라데이션에 섞임 */
.hero{color:#fff;background:linear-gradient(180deg,var(--heroA) calc(env(safe-area-inset-top, 0px) + 6px),var(--heroFade) calc(env(safe-area-inset-top, 0px) + 44px)),linear-gradient(135deg,var(--heroA) 0%,var(--heroB) 58%,var(--heroC) 100%);box-shadow:var(--heroShadow)}
.hero .wrap{padding:calc(14px + env(safe-area-inset-top, 0px)) 18px 18px}
.tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px;padding:3px;border-radius:12px;background:rgba(0,0,0,.18);margin-bottom:18px}
.tabs button{padding:6px 0;border:0;border-radius:9px;background:transparent;color:rgba(255,255,255,.72);font:inherit;font-size:12.5px;cursor:pointer}
.tabs button.on{background:#fff;color:#7a0c17;font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.18)}
.tabs button:focus-visible{outline:2px solid #fff;outline-offset:1px}
.hero h1{margin:0;font-size:26px;letter-spacing:-.7px;font-weight:800;line-height:1.1}
.hsub{margin-top:5px;font-size:12.5px;color:rgba(255,255,255,.72);font-variant-numeric:tabular-nums}
.hsrow{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.rm-links{flex:none;margin-top:5px;font-size:12.5px;color:rgba(255,255,255,.72);white-space:nowrap}
.rm-link{color:rgba(255,255,255,.72);text-decoration:none;border-bottom:1px dotted rgba(255,255,255,.45)}
.hq{margin-top:14px;font-size:13.5px;line-height:1.5;padding:11px 13px;border-radius:10px;background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.10)}
.hq b{font-weight:700;color:#fff}
/* 8-3 ⑩ 도움말 (9/15) : 머리의 작은 ? → 그 탭의 표시 뜻이 내용 맨 위에 펼쳐진다. 뜻은 대조표 번호로 잇고 기준 숫자는 적지 않는다 */
.hrow{display:flex;align-items:center;gap:10px}
.hbtn{flex:none;width:24px;height:24px;border-radius:50%;border:1.5px solid rgba(255,255,255,.7);background:rgba(0,0,0,.15);color:#fff;font:inherit;font-size:13px;font-weight:800;line-height:1;cursor:pointer;padding:0}
.hbtn[aria-expanded="true"]{background:#fff;color:#7a0c17;border-color:#fff}
.help{background:var(--card);border:1.5px solid var(--roseDash);border-radius:16px;padding:12px 14px 10px;margin:0 0 14px;box-shadow:var(--shadow);font-size:12.5px;line-height:1.6}
.help-h{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.help-h b{font-size:14px;font-weight:800;color:var(--wine);flex:1}
.help-h button{padding:4px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card2);color:var(--wine);font:inherit;font-size:12px;cursor:pointer}
.help-lead{color:var(--sub);margin:0 0 6px}
.help-g{font-size:11px;font-weight:800;color:var(--wine);letter-spacing:.4px;margin:12px 0 2px;padding-bottom:2px;border-bottom:1px solid var(--rule)}
.help-r{display:grid;grid-template-columns:104px 1fr;gap:8px;padding:5px 0;border-top:1px solid var(--line2)}
.help-g + .help-r,.help summary + .help-r{border-top:0}
.help-r b{font-weight:700;color:var(--text)}
.help-r span{color:var(--ink2)}
.help details{margin-top:10px}
.help details summary{font-size:12.5px;font-weight:700;color:var(--wine);padding:6px 0;cursor:pointer}
.help-foot{font-size:11px;color:var(--muted);margin-top:10px;padding-top:8px;border-top:1px solid var(--rule)}
/* 구역 제목 옆 ? (9/15 저녁, 사용자 결정 — 탭 전체가 아니라 그 구역만 그 자리에서) : .label 의 ::after 선 뒤(order 2)에 붙고, 펼침은 제목 바로 아래 */
.hq2{order:2;flex:none;width:18px;height:18px;margin-left:6px;border-radius:50%;border:1px solid var(--roseDash);background:var(--card);color:var(--wine);font:inherit;font-size:11px;font-weight:800;line-height:1;padding:0;cursor:pointer;align-self:center}
.hq2[aria-expanded="true"]{background:var(--wine);color:#fff;border-color:var(--wine)}
.rv-sec .hq2{order:0;margin-left:2px}
.help-inline{background:var(--noteBg);border:1px solid var(--noteLine);border-radius:12px;padding:4px 12px 6px;margin:-4px 0 10px;font-size:12px;line-height:1.55}
.help-inline .help-r:first-child{border-top:0}
/* 9/13 : 1px 이라도 스크롤하면 탭 막대를 위에 고정. 탭 위치와 배경(머리 높이만큼 늘인 같은 그라데이션)을 머리와 똑같이 맞춰 튀지 않게 */
.stick{position:fixed;top:0;left:0;right:0;z-index:20;color:#fff;background:linear-gradient(180deg,var(--heroA) calc(env(safe-area-inset-top, 0px) + 6px),var(--heroFade) calc(env(safe-area-inset-top, 0px) + 44px)),linear-gradient(135deg,var(--heroA) 0%,var(--heroB) 58%,var(--heroC) 100%);background-repeat:no-repeat;background-size:100% var(--heroH, 100%);visibility:hidden}
.stick.show{visibility:visible}
.stick.past{box-shadow:var(--heroShadow)}
.stick .wrap{padding:calc(14px + env(safe-area-inset-top, 0px)) 18px 6px}
.stick .tabs{margin:0}

.datebar{display:flex;align-items:center;gap:6px;margin:0 0 14px}
.datebar button{padding:6px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--wine);font:inherit;cursor:pointer}
.datebar button:disabled{color:var(--muted);opacity:.5;cursor:default}
.datebar select{flex:1;text-align:center;text-align-last:center;padding:6px}
select{font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:4px 6px}
button:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

.head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
/* 9/25 : 날짜 제목 다섯 곳(마감 확정·판정 전·잠정, 장중, 시계열) 같은 굵기·자간 — 전에는 마감 확정만 800, 나머지는 인라인 18px 뿐이라 기본 700 */
#close h1,#live h1,#series h1{font-size:18px;margin:0;font-weight:800;letter-spacing:-.4px}
.head strong{font-size:17px;font-weight:800;letter-spacing:-.4px}
.status{font-size:12px;color:var(--muted);margin:4px 0 12px}
.badge{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;background:var(--warnBg);color:var(--warn);white-space:nowrap}
.badge.cand{background:var(--brand);color:var(--onFill)}
.label{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px;font-size:12px;font-weight:800;color:var(--wine);letter-spacing:.3px;margin:22px 2px 10px}
.label::after{content:"";flex:1;min-width:24px;height:1px;background:var(--rule);align-self:center;margin-left:4px}
.label .sub,.label .muted{font-weight:400}
.cols > div > .label:first-child{margin-top:8px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.metric{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 4px;text-align:center}
.metric .k{font-size:10.5px;color:var(--muted)}.metric .v{font-size:16px;font-weight:800;font-variant-numeric:tabular-nums}
.metric .g1th{font-size:10px;color:var(--muted);margin-top:2px;white-space:nowrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 14px;margin-bottom:10px;box-shadow:var(--shadow)}
.card.cand{border:1.5px solid var(--roseDash)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line2)}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0 9px}
.chip{font-size:11px;padding:3px 9px;border-radius:14px;background:var(--chip);color:var(--chipInk)}
/* 8-3 ② 후보 카드 펼치기 (9/14 밤) : 주의 칩(비중 축소·JBT·연속양봉 부담) = 주황, 종목 트랙 = 작은 회색 */
.chip.warn{background:var(--warnBg);color:var(--warn)}
.trk{font-size:10px;color:var(--muted);margin-left:4px;font-variant-numeric:tabular-nums}
.d1{font-size:11.5px;white-space:nowrap}
/* 9/19 후보 카드 종목 줄 : 순번 칸(.srl "대장 ·2등 ·3등 ·4등 ")을 고정 폭으로 두고 D+1 결과 둘째 줄(.d1ln)을 같은 폭만큼 들여쓴다 — 이름 밑에서 시작. 폭(--srlw)은 헤드리스 375px 계측값 */
.card.cand{--srlw:28px}   /* 9/19 계측 : 옛 "대장 " 글자 폭 27.72px (2등·3등·4등 은 24px 대) → 28px 로 네 줄 이름 시작점 통일 */
.srl{display:inline-block;min-width:var(--srlw)}
.row.hasd1{padding-bottom:2px}
.d1ln{display:block;white-space:normal;padding:0 0 8px var(--srlw)}
.tenmark{font-weight:800}.tenmark.ok{color:var(--ok)}.tenmark.x{color:var(--bad)}   /* 9/16 조기채점 : 10시 +4% 도달 ✓ · 미달 ✕ */
.note{font-size:12.5px;line-height:1.6;padding:9px 11px;border-radius:10px;background:var(--warnBg);color:var(--warn);border:1px solid var(--warnLine);margin-top:8px}
.up{color:var(--up)}.down{color:var(--down)}.muted{color:var(--muted)}.sub{color:var(--sub)}.ok{color:var(--ok);font-weight:700}.bad{color:var(--bad);font-weight:700}.acc{color:var(--brand);font-weight:700}
.list{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:0 14px;box-shadow:var(--shadow)}
.list .row:first-child{border-top:0}
label.chk{display:flex;gap:9px;align-items:center;padding:5px 0}
label.chk input{width:16px;height:16px;accent-color:var(--brand)}
label.chk.top{align-items:flex-start}label.chk.top input{margin-top:3px;flex:none}
.chk .hint{display:block;margin-top:2px}
.gblk{padding:6px 0}.gblk+.gblk{border-top:1px solid var(--line2);margin-top:4px}
.gblk h3{font-size:12.5px;font-weight:800;color:var(--wine);margin:2px 0 4px}.gblk h3 em{font-style:normal;font-weight:400;color:var(--muted)}
.gblk .sub{font-size:11.5px;padding:2px 0 2px 25px}.gblk .ix20 .up,.gblk .ix20 .down{font-weight:700}
/* 9/19 값상자 (사용자 결정 A) : 관문6 체크 항목 밑 값 줄(코스피·20일선 / 1억 = 약 n주)을 항목 글자 위치에 맞춘 연한 상자에 — 왼쪽 설명 · 오른쪽 끝 핵심 숫자 굵게.
   PC 두 열에서 오른쪽이 비어 왼쪽으로 쏠려 보이던 것. 값·계산 불변, 표시만. 접두사 g6v- (전역 .sub·.muted 와 안 겹침) */
.g6v{margin:3px 0 6px 25px;padding:2px 10px;border-radius:9px;background:var(--soft);border:1px solid var(--line2);font-size:11.5px;color:var(--sub)}
.g6v-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:4px 0}
.g6v-row+.g6v-row{border-top:1px solid var(--line2)}
.g6v-row .g6v-l{min-width:0;flex:1 1 auto}
.g6v-row .g6v-v{flex:none;font-weight:700;color:var(--text);white-space:nowrap;font-variant-numeric:tabular-nums}
.g6v-row .g6v-v.up{color:var(--up)}.g6v-row .g6v-v.down{color:var(--down)}
.g6v-row.muted .g6v-v{font-weight:400;color:var(--muted)}
.idxline{font-size:12px;margin:2px 0 10px}.idxline .seg{white-space:nowrap}.idxline .up,.idxline .down{font-weight:700}
/* 9/14 목업 B — 피뢰침 카드 (8-3 ②, 시안 pirochim_mockup.html). 카드·칩·색은 어종 카드 그대로, 아래는 피뢰침에만 있는 조각 */
.meta{font-size:12px;color:var(--muted);font-weight:400}
.facts{font-size:12px;color:var(--muted);margin:-4px 0 4px;font-variant-numeric:tabular-nums}
.guide{margin-top:8px;font-size:12px;color:var(--sub)}
.cond{margin:2px 0 4px}
.cond div{display:flex;gap:10px;align-items:baseline;padding:5px 0;border-top:1px solid var(--line2);font-size:13px}
.cond div:first-child{border-top:0}
.cond .k{color:var(--sub);width:80px;flex:none}.cond .v{font-variant-numeric:tabular-nums}
.cond .mark{margin-left:auto;font-size:12px;color:var(--ok);font-weight:700}.cond .mark.x{color:var(--bad)}
.state{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 14px;font-size:13px;color:var(--muted);margin-bottom:10px}
.state.fail{border-left:4px solid var(--alert);padding-left:11px;color:var(--text)}
.state.prov{border-left:4px solid var(--warn);padding-left:11px;background:var(--warnBg);border-color:var(--warnLine);color:var(--warn);font-weight:800}
.state.fail b{color:var(--alert);font-weight:800}
.state.fail .why{display:block;font-size:12px;margin-top:2px;color:var(--sub)}
details.more{margin:0 0 10px}
details.more summary{cursor:pointer;font-size:12.5px;color:var(--sub);padding:7px 2px;list-style:none}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:"▸ ";color:var(--muted)}
details.more[open] summary::before{content:"▾ "}
details.more .card{margin-top:6px}
details.more .card strong{font-size:14.5px}
/* 9/23 잠정 자세히 (A안, 사용자 결정) : 확정 뒤 "14:50 후보 : … → 15:00 후보 : …" 줄 아래 접힌 "▸ 자세히" — 그날 잠정 화면의 "섹터 판정 (잠정)" 목록 둘. pv- 접두사 (rules\screen.md) */
.pv-det{margin:-6px 0 12px}
.pv-det .pv-h{font-size:12px;font-weight:800;color:var(--muted);margin:8px 0 4px}
.pv-det .list{margin-bottom:6px}
.links{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0 2px}
.links .who{font-size:12px;color:var(--ink2);font-weight:700;margin-right:2px}
.links a{font-size:11.5px;padding:3px 10px;border-radius:14px;border:1px solid var(--line);background:var(--card2);color:var(--wine);text-decoration:none;font-weight:700}
.nowline{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:12px;color:var(--sub);margin:0 0 8px}
.nowline b{font-weight:800;color:var(--ink2)}.nowline .warn{color:var(--alert);font-weight:700}
.foot{font-size:11.5px;color:var(--muted);text-align:center;margin-top:22px;padding-top:14px;border-top:1px solid var(--rule)}
.empty{padding:24px 0;text-align:center;color:var(--muted)}
.rv-btnrow{text-align:center;margin:4px 0 22px}
.rv-btn{padding:8px 16px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--wine);font:inherit;font-size:12.5px;cursor:pointer}
.axis,.bars,.vals{display:grid;gap:3px;align-items:center;text-align:center}
.axis{font-size:10px;color:var(--muted);margin:2px 0 2px}
.axis span,.rk th{white-space:nowrap;letter-spacing:-0.2px}   /* 9/16 밤 (축머리글, 사용자 결정 ①) : 축·순위표 머리글 한 줄 위첨자 — 시 + 작은 분(정각은 시만). 자간을 살짝 좁혀 옆 칸과 안 닿게 */
.ax-m,.rk th sup.ax-m{font-size:7px;font-weight:400;color:inherit;vertical-align:top;line-height:1;position:relative;top:1px;margin-left:0.5px;letter-spacing:-0.3px}   /* .rk sup(₩ 표시용 굵은 10px)보다 우선 */
.rk table th{font-size:9px;letter-spacing:-0.3px}.rk th sup.ax-m{font-size:6.5px}   /* 순위표는 이름 칸이 있어 한 칸 16~18px → 항상 9px */
@media (max-width:389px){.axis{font-size:9px}.ax-m{font-size:6.5px}}   /* 가장 좁은 폰(375) : 축 한 칸 17px 라 9px 로 — 15²⁰ 실측 17px */
.vals{font-size:10px;color:var(--sub);margin-top:2px;font-variant-numeric:tabular-nums}
.bar{height:40px;position:relative}
.bar .mid{position:absolute;left:0;right:0;top:50%;border-top:1px solid var(--line)}
.bar i{position:absolute;left:18%;right:18%;border-radius:2px}
.bar i.p{bottom:50%;background:var(--up)}.bar i.n{top:50%;background:var(--down)}
.flag{font-size:10.5px;padding:1px 7px;border-radius:10px;background:var(--rose);color:var(--wine);margin-left:4px}
.flag.warn{background:var(--warnBg);color:var(--warn)}
.kmk{font-size:10.5px;color:var(--muted);margin-left:3px;font-weight:400}
.iq-out{text-decoration:line-through;color:var(--muted)}   /* 9/17 사용자 결정 ① : 대금 35위 밖(강의 당일주도주 검색식 숫자, 대조표 C4)은 종목명만 취소선 + 회색. 오른쪽 숫자·선행은 그대로. 판정에 안 씀 */
.iq-rk{font-size:10.5px;padding:1px 7px;border-radius:10px;background:var(--chip);color:var(--chipInk);margin:0 5px 0 7px;white-space:nowrap}   /* 9/17 조회순위 해답지 : 거래대금 순위 칩 (사용자 결정 ②) — 전역 .chip 과 이름 안 겹치게 iq- 접두사 */
.iq-sec{font-size:12px;color:var(--sub)}   /* 9/23 조회순위섹터 : 종목명 앞 같은 회차 티마 카드의 섹터명 (사용자 제안 → 추천안 셋, 화면 표시일 뿐 판정에 안 씀). 전역 .sub·.chip 과 이름 안 겹치게 iq- 접두사 */
.iq-nm .iq-name{display:inline-block}.iq-nm .flag{white-space:nowrap}.iq-rt{white-space:nowrap}   /* 9/23 조회순위섹터 캡처 정정 : 섹터명이 붙어 한 줄에 안 들어가는 긴 이름은 글자 중간("와이즈플래닛컴퍼/니")이 아니라 이름째로 다음 줄, '선행' 칩과 오른쪽 등락률·순위·금액("11,089/억")은 안 끊긴다. 배치는 그대로 */
.gapline{font-size:11px;color:var(--muted);margin-top:4px}
.hint{font-size:11px;color:var(--wine);margin-top:6px}
.secblk.tap{cursor:pointer}
.rk{margin-top:8px;padding:8px;border-radius:10px;background:var(--soft);border:1px solid var(--line2)}
.rk .lead{font-size:12px;margin-bottom:6px}
.rk table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:12px}
.rk th{font-size:10px;font-weight:400;color:var(--muted);padding:2px 0}
.rk td{text-align:center;padding:4px 0;border-top:1px solid var(--line2);font-variant-numeric:tabular-nums}
.rk td.nm{text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rk td.r1{background:var(--r1Bg);font-weight:700}   /* 9/19 사용자 결정 : 누적 1위는 배경만, 빨간 글자색 뺌 (배경과 같은 조건이라 중복 · 굵게는 유지) */
.aft1{border-left:2px dashed var(--wine)!important}   /* 9/15 저녁 : 16:00 앞 구분선 — 애프터마켓 첫 열 (축·막대·값·순위표·시계열 격자 공통) */
.axis .aft1,.vals .aft1{margin-left:-1px}
.rk sup{color:var(--text);font-size:10px;font-weight:600;margin-left:1px}
.lead1{color:var(--up);font-weight:800}
.rk .leg{font-size:11px;color:var(--muted);margin-top:6px;line-height:1.4}
.secblk{padding:10px 0;border-top:1px solid var(--line2)}
/* 지수 5분봉 선 차트 (9/17 지수차트, 사용자 결정 1A 2A 3A) — 장중 탭 맨 위. 접두사 ix-. 선은 SVG(가로세로 따로 늘어남, 굵기는 고정), 글자는 HTML 을 % 위치로 */
.ix-card{padding:11px 12px 9px}
.ix-head{display:flex;align-items:baseline;flex-wrap:wrap;gap:6px}
.ix-name{font-size:13px;font-weight:800;color:var(--wine)}
.ix-last{font-size:15px;font-weight:800;font-variant-numeric:tabular-nums}
.ix-diff{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--sub)}
.ix-diff.ix-up{color:var(--up)}
.ix-diff.ix-dn{color:var(--down)}
.ix-leg{display:grid;grid-template-columns:auto repeat(4,minmax(0,1fr));align-items:center;gap:1px 8px;max-width:430px;margin:4px 0 7px;font-size:11px;color:var(--sub);font-variant-numeric:tabular-nums;white-space:nowrap}
.ix-k{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.ix-sw{display:inline-block;width:12px;height:0;border-top:2px solid var(--text)}
.ix-sw.ix-m1{border-top-color:var(--ixM1)}
.ix-sw.ix-m2{border-top-color:var(--ixM2)}
.ix-sw.ix-m3{border-top-color:var(--ixM3)}
.ix-kv{color:var(--text);font-weight:600}
.ix-when{color:var(--text);font-weight:800}
.ix-plot{position:relative;height:118px;margin-right:56px;touch-action:pan-y;cursor:crosshair;-webkit-user-select:none;user-select:none}
.ix-plot svg{display:block;width:100%;height:100%;overflow:visible}
.ix-plot path,.ix-plot line{fill:none;vector-effect:non-scaling-stroke}
.ix-grid{stroke:var(--line2);stroke-width:1}
.ix-day{stroke:var(--rule);stroke-width:1}
.ix-lastl{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3}
.ix-l0{stroke:var(--text);stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
.ix-l1{stroke:var(--ixM1);stroke-width:1.2;stroke-linejoin:round}
.ix-l2{stroke:var(--ixM2);stroke-width:1.2;stroke-linejoin:round}
.ix-l3{stroke:var(--ixM3);stroke-width:1.2;stroke-linejoin:round}
.ix-cross{stroke:var(--sub);stroke-width:1;visibility:hidden}
.ix-y,.ix-tag{position:absolute;left:100%;transform:translateY(-50%);font-size:10px;white-space:nowrap;font-variant-numeric:tabular-nums}
.ix-y{margin-left:6px;color:var(--muted)}
.ix-tag{margin-left:3px;padding:1px 3px;border-radius:4px;background:var(--cocoa);color:var(--onFill);font-weight:700}
.ix-x{display:grid;margin:4px 56px 0 0;font-size:10px;color:var(--muted);text-align:center}
.ix-x b{color:var(--text);font-weight:700}
details summary{cursor:pointer;color:var(--sub);font-size:12px;padding:8px 0}
/* 시계열 탭 (9/14 밤, 8-3 ④) — 시각 × 종목 격자. 옆으로 스크롤(data-noswipe), 첫 열 고정 */
.sg{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-top:4px}
.sg table{border-collapse:separate;border-spacing:0;table-layout:fixed;font-size:11.5px}
.sg th{font-size:10px;font-weight:400;color:var(--muted);padding:2px 0 3px;text-align:center;white-space:nowrap}
.sg td{text-align:center;padding:4px 0;border-top:1px solid var(--line2);font-variant-numeric:tabular-nums;white-space:nowrap}
.sg th:first-child,.sg td:first-child{position:sticky;left:0;z-index:1;background:var(--card);text-align:left;padding-right:6px;max-width:96px;overflow:hidden;text-overflow:ellipsis}
.sg td.l1{color:var(--sub)}
.sg td.l2{background:var(--rose);color:var(--wine);font-weight:700}
.sg td.l3{background:var(--roseLine);color:var(--wine);font-weight:800}
.sg td.l4{background:var(--brand);color:var(--onFill);font-weight:800}
.sg td.dot{color:var(--brand);font-size:10px}
.sg td.top{font-weight:800;color:var(--wine)}
.sg td.up,.sg td.down{font-weight:600}
.sg-lead{font-size:12.5px;line-height:1.6;margin:0 0 6px}
.sg-lead b{color:var(--wine)}
.sg-leg{font-size:11px;color:var(--muted);margin-top:6px;line-height:1.45}
@media (min-width:860px){.wrap{max-width:960px}.hero .wrap{padding:calc(14px + env(safe-area-inset-top, 0px)) 12px 18px}.stick .wrap{padding:calc(14px + env(safe-area-inset-top, 0px)) 12px 6px}.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.cols > *{min-width:0}   /* 9/19 시계열PC : 격자 열(1fr)의 min-width 기본값 auto 는 안쪽 표(첫 열 96 + 34px × 회차)의 폭이라 두 열이 wrap 밖으로 밀렸다(980px 에서 738+738). 0 이면 열이 반씩 나뉘고 넓은 표는 .sg 안에서 옆으로 스크롤 */
#series .cols{display:block}   /* 9/19 시계열PC : 시계열 탭은 PC 에서도 한 열 — 표 다섯 장(최대 708px)이 936px 안에 통째로 보이게, 폰과 같은 순서 */}

/* 복기 탭 (시안 3 모양) — 다른 탭 클래스와 겹치지 않게 rv- 로 시작 */
.rv-note{border:1px solid var(--noteLine);border-radius:12px;background:var(--noteBg);padding:12px 13px;margin-bottom:22px;color:var(--sub);font-size:12px;line-height:1.72}
.rv-note b,.rv-warn b{color:var(--wine);font-weight:700}
.rv-sec{display:flex;align-items:baseline;gap:7px;margin:0 2px 10px}
.rv-sec h2{margin:0;font-size:12px;font-weight:800;color:var(--wine);letter-spacing:.6px}
.rv-sec .c{font-size:11.5px;color:var(--muted)}
.rv-sec .ln{flex:1;height:1px;background:var(--rule)}
.rv-sec.mt{margin-top:26px}
@media (min-width:860px){.cols > section > .rv-sec:first-child{margin-top:0}}
.rv-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rv-stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 13px}
.rv-stat.hot{background:linear-gradient(165deg,var(--card) 0%,var(--rose) 100%);border-color:var(--roseLine)}
.rv-stat .k{font-size:11.5px;color:var(--sub)}
.rv-stat .v{font-size:24px;font-weight:800;letter-spacing:-.8px;font-variant-numeric:tabular-nums;margin-top:2px;line-height:1.15}
.rv-stat .v.big{font-size:26px;letter-spacing:-1px}
.rv-stat .v small{font-size:11.5px;font-weight:600;color:var(--muted);margin-left:5px;letter-spacing:0}
.rv-stat.hot .v{color:var(--brand)}
.rv-meter{height:5px;border-radius:5px;background:var(--meterTrack);margin-top:9px;overflow:hidden}
.rv-meter i{display:block;height:100%;background:linear-gradient(90deg,var(--wineFill),var(--barB));border-radius:5px}
.rv-meter.loss{background:var(--lossTrack)}.rv-meter.loss i{background:var(--lossFill)}
.rv-warn{margin-top:8px;background:var(--card);border:1px solid var(--roseLine);border-radius:14px;padding:11px 13px 11px 14px;font-size:12.5px;line-height:1.65;color:var(--ink2);position:relative;overflow:hidden}
.rv-warn::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--brand)}
.rv-quad{display:grid;grid-template-columns:38px 1fr 1fr;grid-template-rows:auto 1fr 1fr;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px;margin-top:8px}
.rv-quad .ax{font-size:11px;color:var(--muted);display:flex;align-items:center;justify-content:center;letter-spacing:.4px}
.rv-quad .cell{border-radius:11px;padding:10px 11px;min-height:64px}
.rv-quad .n{font-size:21px;font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums}
.rv-quad .t{font-size:11.5px;margin-top:3px}
.q-ok{background:var(--rose);color:var(--wine)}
.q-chk{background:var(--card);color:var(--brand);border:1.5px dashed var(--roseDash)}
.q-luck{background:var(--wineFill);color:var(--onFill)}
.q-exec{background:var(--cocoa);color:var(--onFill)}
.q-luck .t,.q-exec .t{color:rgba(255,255,255,.86)}
.rv-bars{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 13px;margin-top:8px;display:flex;flex-direction:column;gap:7px}
.rv-bars .r{display:flex;align-items:center;gap:9px;font-size:12px}
.rv-bars .lab{width:104px;flex:none;color:var(--sub)}
.rv-bars .tr{flex:1;height:8px;background:var(--barTrack);border-radius:5px;overflow:hidden}
.rv-bars .tr i{display:block;height:100%;background:linear-gradient(90deg,var(--barA),var(--barB));border-radius:5px}
.rv-bars .n{width:16px;text-align:right;font-weight:800;color:var(--wine);font-variant-numeric:tabular-nums}
.rv-legend{display:flex;flex-wrap:wrap;gap:10px 14px;font-size:11.5px;color:var(--sub);margin:0 2px 12px}
.rv-legend span{display:inline-flex;align-items:center;gap:5px}
.mk{flex:none;width:19px;height:19px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;font-style:normal}
.rv-legend .mk{width:15px;height:15px;font-size:9px}
.m-y{background:var(--rose);color:var(--wine)}.m-n{background:var(--brand);color:var(--onFill)}.m-na{background:var(--naBg);color:var(--naInk)}.m-q{background:var(--card);color:var(--brand);border:1.5px solid var(--roseLine)}
.rv-trade{position:relative;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 15px 13px 17px;margin-bottom:10px;overflow:hidden;box-shadow:var(--shadow)}
.rv-trade::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px}
.rv-trade.chk::before{background:repeating-linear-gradient(180deg,var(--brand) 0 7px,transparent 7px 12px)}
.rv-trade.ok::before{background:var(--okRail)}.rv-trade.luck::before{background:var(--wineFill)}.rv-trade.exec::before{background:var(--cocoa)}.rv-trade.skip::before{background:var(--muted2)}
.rv-th{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rv-th .nm{font-size:17px;font-weight:800;letter-spacing:-.4px}
.rv-th .mt{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.rv-badge{margin-left:auto;font-size:11px;font-weight:700;border-radius:20px;padding:3px 10px;white-space:nowrap}
.b-chk{background:var(--card);color:var(--brand);border:1.5px dashed var(--brand)}.b-ok{background:var(--rose);color:var(--wine);border:1px solid var(--roseLine)}.b-luck{background:var(--wineFill);color:var(--onFill)}.b-exec{background:var(--cocoa);color:var(--onFill)}.b-skip{background:var(--chip);color:var(--chipInk);border:1px solid var(--line)}
.rv-chips{display:flex;flex-wrap:wrap;gap:5px;margin:9px 0 11px}
.rv-chip{font-size:11px;color:var(--chipInk);background:var(--chip);border-radius:14px;padding:3px 9px}
.rv-chip.red{color:var(--wine);background:var(--rose)}
.rv-kv{display:grid;grid-template-columns:repeat(4,1fr);background:var(--card2);border:1px solid var(--line2);border-radius:11px;overflow:hidden}
.rv-kv > div{padding:8px 6px;text-align:center}
.rv-kv > div + div{border-left:1px solid var(--line2)}
.rv-kv .k{font-size:10.5px;color:var(--muted)}
.rv-kv .v{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
.rv-kv .v.rate{font-weight:800}
.rv-kv .v.sm{font-size:11.5px;font-weight:600;line-height:1.3}   /* 9/19 금액 줄 (배치 A) : 수량 × 단가 · 추정자산 (출처) */
.rv-base{margin-top:9px;font-size:11.5px;line-height:1.7;color:var(--sub);background:var(--soft);border-radius:10px;padding:8px 10px}
.rv-base b{color:var(--text);font-weight:700}
.rv-base b.up{color:var(--up)}.rv-base b.down{color:var(--down)}
.rv-src{color:var(--muted2)}
.rv-rules{margin-top:11px}
.rv-rules .g{font-size:10.5px;color:var(--muted);letter-spacing:.5px;margin:9px 0 3px}
.rv-rules .g:first-child{margin-top:8px}
.rv-rule{display:flex;align-items:flex-start;gap:9px;padding:3px 0;font-size:13px}
.rv-rule .mk{margin-top:1px}
.rv-rule .why{display:block;font-size:11.5px;color:var(--muted)}
.rv-say{margin-top:11px;font-size:12.5px;line-height:1.6;color:var(--ink2);background:var(--rose);border-radius:10px;padding:9px 11px}
.rv-foot{margin:24px 2px 0;font-size:11.5px;color:var(--muted);line-height:1.9;border-top:1px solid var(--rule);padding-top:14px}
.rv-foot b{color:var(--sub);font-weight:700}
/* 검증 탭 (9/16 밤 검증탭, 인계문서 8-6 ⓐ~ⓓ · 9/24 세 줄 · 관문 순서 표 · 표와 목록 합침 · 목록 두 줄) — 관문 순서, 줄별 표 + 통계(줄을 누르면 표 아래 대장 목록), KRX 자 참고 띠 */
.vf-tbl{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 10px 4px;margin-bottom:10px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.vf-tbl table{border-collapse:collapse;width:100%;font-size:11.5px}
.vf-tbl th{font-size:10px;font-weight:400;color:var(--muted);padding:4px 3px;text-align:right;white-space:nowrap}
.vf-tbl th:first-child,.vf-tbl td:first-child{text-align:left;padding-left:0;white-space:nowrap}
.vf-tbl td{padding:6px 3px;border-top:1px solid var(--line2);text-align:right;font-variant-numeric:tabular-nums;vertical-align:top;white-space:nowrap}
.vf-tbl td.w{white-space:normal;text-align:left;line-height:1.4;min-width:118px}
.vf-tbl tr.main td{font-weight:800;color:var(--wine)}
.vf-tbl tr.main td:first-child{color:var(--brand)}
.vf-tbl .ref{font-size:9.5px;font-weight:400;color:var(--muted);margin-left:3px}
.vf-tbl td.nt{white-space:normal;text-align:left;color:var(--muted);font-size:11px;font-weight:400}
/* 관문 순서 표 (9/24 `검증탭공부` 사용자 요청) — 설계 번호 ↔ 15:20 판정이 실제로 묻는 순서. 글이 칸 안에서 줄바꿈 */
.vf-gate{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 10px 4px;margin-bottom:10px}
.vf-gate table{border-collapse:collapse;width:100%;font-size:11.5px}
.vf-gate th{font-size:10px;font-weight:400;color:var(--muted);padding:4px 3px;text-align:left;white-space:nowrap}
.vf-gate td{padding:6px 3px;border-top:1px solid var(--line2);text-align:left;vertical-align:top;line-height:1.4}
.vf-gate th:first-child,.vf-gate td:first-child{padding-left:0;width:1%;color:var(--muted);font-variant-numeric:tabular-nums}
.vf-gate td:nth-child(2){white-space:nowrap}
.vf-list{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px 12px;margin-bottom:10px}
/* 9/24 B안 : 늘 두 줄 — 날짜 칸(34px) | 1줄 섹터 · 대장 · 관망 / 2줄(들여 씀) ✓✕⏳ 고정 칸 + 결과. 옛 한 줄 flex(길면 저절로 줄바꿈) 대신 */
.vf-row{display:grid;grid-template-columns:34px minmax(0,1fr);column-gap:6px;padding:7px 0;border-top:1px solid var(--line2);font-size:12.5px}
.vf-row:first-child{border-top:0}
.vf-row .d{color:var(--muted);font-size:11.5px;font-variant-numeric:tabular-nums;padding-top:1px}
.vf-row .l1{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 6px;min-width:0}
.vf-row .nm{font-weight:700}
.vf-row .l2{grid-column:2;margin-top:3px;font-size:11.5px;color:var(--sub)}
.vf-row .l2 .mk{display:inline-block;width:16px}
.vf-row .l2 .chip{margin-left:5px}   /* 9/24 실전 토막 칩 (15:40 봉만 · 한 시장만) */
.vf-row .l2 .vf-rt{display:inline-block;white-space:nowrap;margin-left:.3em}   /* 9/24 실전 토막은 통째로 다음 줄로 (앞 글자는 제자리) */
.vf-row .wait{color:var(--muted)}
.vf-band{display:flex;align-items:center;gap:8px;margin:22px 2px 10px;font-size:11.5px;font-weight:800;color:var(--sub);letter-spacing:.4px}
.vf-band::before,.vf-band::after{content:"";flex:1;height:1px;background:var(--rule)}
.vf-band span{white-space:nowrap}
/* 9/24 표 줄 누르기 → 표 아래 대장 목록 (접힌 목록 details.vf-more 대신). ▸ 닫힘 · ▾ 지금 열린 줄 */
.vf-tbl tr[data-key]{cursor:pointer}
.vf-tbl tr[data-key] td:first-child::before{content:"▸ ";color:var(--muted);font-weight:400}
.vf-tbl tr[data-key].on td:first-child::before{content:"▾ ";color:var(--wine)}
.vf-tbl tr[data-key].on td:first-child{font-weight:800}
.vf-selh{font-size:11.5px;font-weight:700;color:var(--sub);margin:0 2px 6px}
/* ── 마감 탭 "최근 거래일" (9/19 사용자 결정 A안 + ✓✕ 보임) — 검증 탭과 같은 verify.json 자료, 후보 없는 날까지 한 줄씩. 줄을 누르면 그 날짜 마감 탭 ── */
.rc-list{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px 12px;margin-bottom:10px}
.rc-row{display:flex;align-items:baseline;gap:8px;padding:7px 0;border-top:1px solid var(--line2);font-size:12.5px;cursor:pointer}
.rc-row:first-child{border-top:0}
.rc-row .d{flex:none;width:50px;color:var(--muted);font-size:11.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.rc-row.cur .d{color:var(--brand);font-weight:800}
.rc-row .b{flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:2px 12px}
.rc-row .nm{font-weight:700;white-space:nowrap}
.rc-row .none,.rc-row .wait{color:var(--muted)}
.rc-row.krx .nm{font-weight:400;color:var(--sub)}   /* 통합 자 전(KRX 자) — 참고, 표본 아님 */
.rc-row .chip{margin-left:5px}
.rc-row .pc{font-size:11.5px;margin-left:4px;font-variant-numeric:tabular-nums}   /* ✓ ✕ 옆 10시까지 고가 % (9/19 "붙여줘") */
.rc-more{display:flex;justify-content:flex-end;margin:-4px 2px 0}
.rc-more button{font-size:12px;color:var(--sub);background:none;border:0;padding:4px 2px;cursor:pointer;font-family:inherit}
</style>

<body>
<header class="hero">
  <div class="wrap">

    <div class="hsrow"><div class="hsub" id="heroSub">15:20 KRX 기준 · NXT 제외</div><div class="rm-links"><a class="rm-link" href="roadmap.html">로드맵 ↗</a> · <a class="rm-link" href="manual.html">설명서 ↗</a></div></div>

  <section id="series" hidden><div class="empty">불러오는 중</div></section>

</div>
<script>
const WD = '일월화수목금토';
const arr = x => Array.isArray(x) ? x : (x && Array.isArray(x.value) ? x.value : (x == null ? [] : [x]));
const num = s => { const v = parseFloat(String(s ?? '').replace(/,/g, '')); return isFinite(v) ? v : null; };
const has = s => s !== undefined && s !== null && String(s).trim() !== '';
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined && text !== null) e.textContent = text; return e; }
function add(parent, ...kids) { kids.forEach(k => { if (k) parent.appendChild(k); }); return parent; }
function pctEl(s) {
  const v = num(s);
  if (v === null) return el('span', 'muted', '—');
  return el('span', v > 0 ? 'up' : (v < 0 ? 'down' : ''), (v > 0 ? '+' : '') + v.toFixed(2) + '%');
}
// 9/16 `조기채점` : D+1 결과 조각 — "→ 10시 고가 +2.08% ✕ · D+1 종가 −4.74%" (사용자 승인 형식). 10시 7칸은 D+1 10:07 StockLive 회차(next-day -TenOnly)가, D+1 종가는 20:05 가 채운다.
//   9/19 : 후보 카드에서 종목 줄 안 → 종목 줄 아래 둘째 줄(이름 밑 들여쓰기)로 옮기며 화살표 "→" 를 뺐다 (사용자 결정 추천안). 피뢰침 카드의 같은 조각도 화살표 없음 — 한 조각 한 형식
//   result_log 의 D1_10시고가% · 목표4%_10시(Y/N = 10:00 봉까지 고가 +4% 도달) · D1종가%. 둘 다 없으면 null (호출한 쪽이 "결과 대기" 문구). 채점 기준 S1 · S9 그대로, 표시만
//   9/19 A안 : 고가 ✓✕ 뒤에 '· 저가 −x%' (D1_10시저가%, 10:00 봉까지 최저 — 견뎌야 했던 눌림. 검증 탭 한 줄과 같은 말·같은 값). 기록 칸은 next-day v1.3 부터 있던 것, 기준값 없음. 사용자 제안 → Claude 찬성 → 예시 A/B → 사용자 결정 "a로 하자"
function d1Frag(res, cls) {
  if (!res) return null;
  const ten = has(res['D1_10시고가%']), cl = has(res['D1종가%']);
  if (!ten && !cl) return null;
  const f = el('span', cls || 'd1');
  if (ten) {
    const ok = res['목표4%_10시'] === 'Y';
    add(f, el('span', 'sub', '10시 고가 '), pctEl(res['D1_10시고가%']), el('span', 'tenmark' + (ok ? ' ok' : ' x'), ok ? ' ✓' : ' ✕'));
    if (has(res['D1_10시저가%'])) add(f, el('span', 'sub', ' · 저가 '), pctEl(res['D1_10시저가%']));   /* 9/19 A안 */
  }
  if (cl) add(f, el('span', 'sub', (ten ? ' · ' : '') + 'D+1 종가 '), pctEl(res['D1종가%']));
  return f;
}
function shortTime(s) {
  if (!has(s)) return '—';
  const today = new Date(); const pad = n => String(n).padStart(2, '0');
  const t = `${today.getFullYear()}-${pad(today.getMonth() + 1)}-${pad(today.getDate())}`;
  return s.startsWith(t) ? s.slice(11, 16) : s.slice(5, 16).replace('-', '/');
}
async function getJson(path) {
  const res = await fetch(path + '?t=' + Date.now());
  if (!res.ok) throw new Error(path + ' ' + res.status);
  return res.json();
}

function renderClose(d, dates) {
  const box = document.getElementById('close'); box.innerHTML = '';
  const g = d.gate1 || {};
  const ymd = String(d.date || '');
  const wd = has(g['요일']) ? g['요일'] : WD[new Date(+ymd.slice(0, 4), +ymd.slice(4, 6) - 1, +ymd.slice(6, 8)).getDay()];

  add(box, nowLine(d));   // 8-3 ③ 지금 / 자료
  const stockMap = {}; arr(d.stocks).forEach(s => { stockMap[s['섹터명']] = arr(s['종목']); });
  const resMap = {}; arr(d.result).forEach(r => { resMap[r['섹터'] + '|' + r['종목']] = r; });
  const inqMap = {}; arr(d.inq).forEach(r => { inqMap[String(r['코드'])] = r['조회순위']; });
  const j1450 = arr(d.judge1450);   // 9/16 `1450회차` : 14:52 에(9/19 `잠정3분` 전에는 14:57) 14:50 자료로 미리 돌린 잠정 판정 (JSON v9, pages-export v2.1). 없으면 빈 배열
  const j1500 = arr(d.judge1500);   // 9/19 `잠정1500` : 15:02 에 15:00 자료로 미리 돌린 잠정 판정 (JSON v12, pages-export v2.6). 없으면 빈 배열 (9/18 이전 JSON 은 키 자체가 없음 → arr 이 [])
  const jProv = j1500.length ? j1500 : j1450;   // 마지막 잠정 하나 (9/19 사용자 결정 B : 띠·후보 카드·섹터 판정 목록은 마지막 잠정, 둘 다 있으면 "잠정 흐름" 한 줄)
  const provAt = j1500.length ? '15:00' : '14:50';
  const provSecs = j => j.filter(r => r['판정'] === '후보').map(r => r['섹터명']);
  const secText = a => a.length ? a.join(', ') : '없음';
  const sameSecs = (a, b) => a.slice().sort().join() === b.slice().sort().join();   // 섹터 집합 비교 (judge-match.ps1 과 같은 뜻)
  // 8-3 ① 장중 갱신 (9/14) — 판정 전 JSON(stage 'live') 이면 후보·관문1 을 그리지 않는다.
  //   "후보 없음" 으로 읽히면 안 되기 때문 (4절 : 종베 후보는 마감 탭에만, 판정은 15:50 에 한 번). 장중 자료는 장중 탭.
  if (d.stage === 'live') {
    if (!jProv.length) {
      add(box, el('h1', null, `${+ymd.slice(4, 6)}/${+ymd.slice(6, 8)} (${wd}) 판정 전`));
      box.lastChild.style.fontSize = '18px'; box.lastChild.style.margin = '0';
      add(box, el('div', 'state', `종베 판정은 15:50 에 한 번 나옵니다 (15:20 KRX 기준). 지금은 ${has(d.at) ? tLabel(d.at) + ' 까지의 ' : ''}장중 자료만 있습니다 — 장중 탭에서 보세요`));
      add(box, rcBlock(ymd));   // 9/19 최근 거래일 — 제목·상태 글 아래 (B안 뒤에도 같은 자리)
      add(box, el('div', 'foot', `검증 기간 — 기록만, 매매 안 함 · 생성 ${d.generated || '—'}`));
      return;
    }
    // 9/16 잠정 14:50 (사용자 결정 : 노란 띠 + 같은 후보 카드, 첫 탭은 그대로 장중) — 14:52(9/19 전에는 14:57)~15:50 사이. 15:50 뒤에는 stage 'close' 라 이 분기를 안 탄다.
    //   관문1·피뢰침·관문6 은 그리지 않는다 (15:50 확정 자료). 표본은 15:20 판정만 — 여기 후보는 표본이 아니다 (인계문서 8-5 27번).
    //   9/17 사용자 결정 A : 섹터 판정 목록은 후보 유무와 상관없이 항상 (14:50 자료) — "후보 없음" 인 날 왜 없는지가 그 자리에서 보이게. 확정 화면과 같은 judgeList
    //   9/19 `잠정1500` 사용자 결정 B : 15:02 부터는 15:00 잠정이 띠·카드·목록(jProv), 14:50 은 "잠정 흐름" 한 줄로만 (14:50 → 15:00 후보 섹터, 같음/다름)
    add(box, el('div', 'state prov', `⏳ 잠정 ${provAt} · 15:50 확정 전 · 표본 아님`));
    add(box, el('h1', null, `${+ymd.slice(4, 6)}/${+ymd.slice(6, 8)} (${wd}) ${provAt} 잠정`));
    box.lastChild.style.fontSize = '18px'; box.lastChild.style.margin = '0';
    add(box, el('div', 'status', `관문1 — (15:50 기록) · ${provAt} 자료로 미리 돌린 판정이라 15:50 확정과 다를 수 있다 · 피뢰침은 15:20 판정만`));
    if (j1450.length && j1500.length) {
      const a = provSecs(j1450), b = provSecs(j1500);
      add(box, el('div', 'status', `잠정 흐름 : 14:50 ${secText(a)} → 15:00 ${secText(b)} ${sameSecs(a, b) ? '(같음)' : '(다름)'}`));
    }
    add(box, rcBlock(ymd));   // 9/19 B안 최근 거래일 — 상태 줄 아래, 잠정 후보 카드 앞 (잠정 후보는 안 들어간다, 15:20 표본만)
    const c1p = el('div'); add(box, c1p);
    const pc = jProv.filter(r => r['판정'] === '후보');
    add(c1p, labelWith(pc.length ? '종베 후보 (잠정)' : '종베 후보 (잠정) — 없음', 'close.cand'));
    candCards(c1p, pc);
    add(c1p, labelWith('섹터 판정 (잠정)', 'close.judge'));
    judgeList(c1p, jProv);
    add(box, el('div', 'foot', `검증 기간 — 기록만, 매매 안 함 · 잠정 ${provAt} · 생성 ${d.generated || '—'}`));
    return;
  }
  const head = el('div', 'head');
  const left = el('div');
  add(left, el('h1', null, `${+ymd.slice(4, 6)}/${+ymd.slice(6, 8)} (${wd}) ${String(d.at).slice(0, 2)}:${String(d.at).slice(2)} 판정`));
  const right = el('div'); right.style.display = 'flex'; right.style.gap = '6px'; right.style.alignItems = 'center';
  if (has(g['비고'])) add(right, el('span', 'badge', g['비고']));
  add(box, add(head, left, right));

  // 9/19 A안 : 상태 줄(수집·OCR 경고·push)은 "이 JSON 을 마지막으로 만든 시점" 의 파이프라인 상태라 최신 날짜에서만 뜻이 있다.
  //   지난 날짜 JSON 은 20:05 D+1 채점 때 다시 만들어져 그날 값이 찍히므로(9/16·17 → 9/18 값) 지난 날짜에서는 줄을 숨긴다. nowLine 의 "지난 날짜 보는 중" 과 같은 판별
  if (!isPastView(ymd)) {
    const st = d.status || {};
    const pushOk = String(st.push || '').includes('OK');
    const status = el('div', 'status');
    add(status, el('span', null, `수집 ${shortTime(st['수집'])} · OCR 경고 ${st['OCR경고오늘'] ?? '—'} · push `),
      el('span', pushOk ? 'ok' : 'bad', has(st.push) ? shortTime(st.push) + (pushOk ? '' : ' 확인') : '—'));
    add(box, status);
  }
  add(box, rcBlock(ymd));   // 9/19 B안 최근 거래일 — 날짜 제목·상태 줄 아래, 관문1 앞 (9/19 오전 A안 맨 아래 → 같은 날 오후 사용자 결정 "추세 먼저, 당일 상세는 그 다음")

  const cols = el('div', 'cols'); const c1 = el('div'); const c2 = el('div'); add(box, add(cols, c1, c2));

  const gl = el('div', 'label');
  add(gl, el('span', null, '관문1 오늘 할 장인가 '), el('span', g['관문1'] === '통과' ? 'ok' : 'bad', g['관문1'] || '—'));
  if (has(g['걸린조건'])) add(gl, el('span', 'sub', ' · ' + g['걸린조건']));
  add(gl, helpBtn(gl, 'close.gate1'));
  add(c1, gl);
  const m4 = el('div', 'grid4');
  // 9/19 기준값 줄 (사용자 결정 A 안, 주 1회 화면·표시) : 그날 gate_log 의 임계값 칸("상한가3/상승45%/B수10/B비중2%")을 그대로 읽어 각 칸 아래 "기준 n↑".
  //   같거나 크면 통과, 넷 다 넘어야 통과(gate1-log). 여기서 숫자를 정하지 않는다 — 칸이 없으면 줄을 안 그린다. 임계값이 바뀌어도 지난 날짜는 그날 기록된 기준이 보인다
  const thr = {}; String(g['임계값'] || '').split('/').forEach(p => { const mm = p.match(/^(상한가|상승|B수|B비중)([\d.]+)%?$/); if (mm) thr[mm[1]] = num(mm[2]); });
  [['상한가', g['상한가'], '', thr['상한가']], ['상승비율', g['상승비율%'], '%', thr['상승']], ['B트랙', g['B트랙수'], '개', thr['B수']], ['B비중', g['B비중%'], '%', thr['B비중']]].forEach(([k, v, u, t]) => {
    const m = el('div', 'metric'); add(m, el('div', 'k', k), el('div', 'v', has(v) ? v + u : '—'));
    if (t !== null && t !== undefined) add(m, el('div', 'g1th', '기준 ' + t + u + '↑'));
    m4.appendChild(m);
  });
  add(c1, m4);
  // 8-3 ⑤ 지수 위치 (9/14 밤, `지수선` 세션) — gate_log v1.2 의 코스피 5·20일선(키움 ka20006 지수 일봉, 과거 소급).
  //   값·위/아래 는 CSV 그대로(이평위치·5일선대비%·20일선대비%), 통과 기준 없음 — 관문1 옆 참고 한 줄. 5·20일선이 없는 날은 줄 자체를 안 그린다

    const byConc = (a, b) => (num((bySec[b][lastT] || {})['집중도%']) ?? -1) - (num((bySec[a][lastT] || {})['집중도%']) ?? -1);
    const liveNames = Object.keys(bySec).filter(n => bySec[n][lastT]).sort(byConc);
    const goneNames = Object.keys(bySec).filter(n => !bySec[n][lastT]);
    const mkAxis = () => { const ax = el('div', 'axis'); ax.style.gridTemplateColumns = gridCols; times.forEach((t, i) => ax.appendChild(tStack(el('span', isAft1(times, i) ? 'aft1' : null), t))); return ax; };
    const stockMapL = {}; arr(d.stocks).forEach(s => { stockMapL[s['섹터명']] = arr(s['종목']); });
    const stBy = {};
    arr(d.stockFlow).forEach(r => {
      if (r['섹터명'] === '개별이슈') return;
      const tt = String(r['시각']);
      const m = ((stBy[r['섹터명']] = stBy[r['섹터명']] || {})[tt] = stBy[r['섹터명']][tt] || {});
      const prev = m[r['종목명']];
      if (!prev || (num(r['누적억']) ?? 0) > (num(prev['누적억']) ?? 0)) m[r['종목명']] = r;
    });
    const mkRank = n => {
      const sb = stBy[n]; if (!sb) return null;
      const tms = Object.keys(sb).sort();
      const ranked = {}; const flowTop = {};
      tms.forEach(tt => {
        const rs = Object.values(sb[tt]).sort((a, b) => (num(b['누적억']) ?? 0) - (num(a['누적억']) ?? 0));
        ranked[tt] = rs.map(r => r['종목명']);
        const withFlow = rs.filter(r => has(r['구간증분억']));
        if (withFlow.length >= 2) flowTop[tt] = withFlow.slice().sort((a, b) => (num(b['구간증분억']) ?? 0) - (num(a['구간증분억']) ?? 0))[0]['종목명'];
      });
      const seq = [];
      tms.forEach(tt => { const top = ranked[tt][0]; if (top && (!seq.length || seq[seq.length - 1][1] !== top)) seq.push([tt, top]); });
      const lastTm = tms[tms.length - 1];
      const names = [...new Set(tms.flatMap(tt => ranked[tt]))].sort((a, b) => {
        const ra = ranked[lastTm].indexOf(a), rb = ranked[lastTm].indexOf(b);
        const va = ra < 0 ? 99 : ra, vb = rb < 0 ? 99 : rb;
        if (va !== vb) return va - vb;
        return Math.min(...tms.map(tt => { const i = ranked[tt].indexOf(a); return i < 0 ? 99 : i; })) - Math.min(...tms.map(tt => { const i = ranked[tt].indexOf(b); return i < 0 ? 99 : i; }));
      });
      const box = el('div', 'rk'); box.hidden = true;
      const lead = el('div', 'lead');
      add(lead, el('span', 'sub', '대장 변천 : '), el('span', null, seq.length <= 1 ? `${seq[0] ? seq[0][1] : '—'} ${seq[0] ? tLabel(seq[0][0]) + ' 부터 1위 유지' : ''}` : seq.map(([tt, nm]) => `${tLabel(tt)} ${nm}`).join(' → ')));
      add(box, lead);
      const tb = el('table'); const cg = el('colgroup');
      const c0 = el('col'); c0.style.width = '26%'; /* 9/16 밤 (축머리글) : 30% → 26% — 시각 칸을 넓혀 15²⁰ 15⁴⁰ 이 안 닿게 (이름은 ellipsis) */ cg.appendChild(c0); tms.forEach(() => cg.appendChild(el('col'))); tb.appendChild(cg);
      const hr = el('tr'); hr.appendChild(el('th')); tms.forEach((tt, i) => hr.appendChild(tStack(el('th', isAft1(tms, i) ? 'aft1' : null), tt, i ? tms[i - 1] : undefined))); tb.appendChild(hr);
      names.forEach(nm => {
        const tr = el('tr'); const tdn = el('td', 'nm', nm);
        const cd = tms.map(tt => (sb[tt][nm] || {})['종목코드']).find(Boolean); if (isPref(cd)) tdn.appendChild(el('span', 'flag warn', '우선주'));   // 9/15 저녁
        add(tdn, kMark(d, cd));   // (k) 9/15 저녁
        tr.appendChild(tdn);
        tms.forEach((tt, ti) => {
          const i = ranked[tt].indexOf(nm);
          const td = el('td', (i === 0 ? 'r1' : '') + (isAft1(tms, ti) ? ' aft1' : ''), i < 0 ? '—' : String(i + 1));
          if (i >= 0 && flowTop[tt] === nm) td.appendChild(el('sup', null, '₩'));
          const r = sb[tt][nm]; if (r) td.title = `누적 ${r['누적억']}억 · 구간 ${r['구간증분억'] || '—'}억 · ${r['등락률']}%`;
          tr.appendChild(td);
        });
        tb.appendChild(tr);
      });
      add(box, tb);
      add(box, el('div', 'leg', '숫자 = 카드 안 누적 거래대금 순위 · 빨간 칸 = 누적 1위 · ₩ = 그 구간 돈이 가장 많이 들어온 종목 (앞 기록이 1시간보다 멀면 구간도 길어짐) · — = 티마 카드(4종목)에 없음 (순위 하락이 아님)'));
      return box;
    };
    const mkBlk = n => {
      const present = times.map(t => bySec[n][t]).filter(Boolean);
      const last = present[present.length - 1];
      const lm = num(last['모멘텀']);
      const posN = present.filter(r => (num(r['모멘텀']) ?? 0) > 0).length;
      const blk = el('div', 'secblk');
      const top = el('div', 'head');
      const nm = el('span'); add(nm, el('strong', null, n + ' '), el('span', 'muted', has(last['집중도%']) ? last['집중도%'] + '%' : ''));
      if (dupAt[n]) add(nm, el('span', 'flag', '카드 2장 ' + [...new Set(dupAt[n])].map(tLabel).join(',')));
      const gapNow = bySec[n][lastT] && bySec[n][lastT]['괴리'] === 'Y';
      if (gapNow) add(nm, el('span', 'flag warn', '괴리'));
      let tag = '—', cls = 'sub';
      if (!bySec[n][lastT]) { tag = tLabel(last['시각']) + ' 이후 없음'; cls = 'muted'; }
      else if (lm !== null && lm > 0) { tag = `가속 · 양수 ${posN}/${present.length}`; cls = 'up'; }
      else if (lm !== null && lm < 0) { tag = `감속 · 양수 ${posN}/${present.length}`; cls = 'down'; }
      add(top, nm, el('span', cls, tag));
      add(blk, top);
      const bars = el('div', 'bars'); bars.style.gridTemplateColumns = gridCols;
      const vals = el('div', 'vals'); vals.style.gridTemplateColumns = gridCols;
      times.forEach((t, ti) => {
        const r = bySec[n][t]; const v = r ? num(r['모멘텀']) : null;
        const b = el('div', 'bar' + (isAft1(times, ti) ? ' aft1' : '')); add(b, el('span', 'mid'));
        if (v !== null && v !== 0) { const bar = el('i', v > 0 ? 'p' : 'n'); bar.style.height = Math.min(19, Math.max(2, Math.round(Math.abs(v) / maxAbs * 19))) + 'px'; b.appendChild(bar); }
        bars.appendChild(b);
        const v1 = v === null ? null : Math.round(v * 10) / 10;
        const vi = v === null ? null : Math.round(Math.abs(v));   /* 9/19 : 반올림해 10 이 되면 정수만 (9.5 → 10 · 10.3 → 10 · 14.7 → 15), 아니면 소수 한 자리 — 두 자리 값이 옆 칸과 겹치지 않게 (사용자 결정) */
        vals.appendChild(el('span', isAft1(times, ti) ? 'aft1' : null, v1 === null ? '' : (vi >= 10 ? String(v < 0 ? -vi : vi) : v1.toFixed(1))));
      });
      add(blk, bars, vals);
      if (gapNow) {
        const hiL = (stockMapL[n] || []).slice().sort((a, b) => (num(b['등락률']) ?? -999) - (num(a['등락률']) ?? -999))[0];
        add(blk, el('div', 'gapline', `괴리 : 대금 1위 ${bySec[n][lastT]['거래대금1위'] || '—'}` + (hiL ? ` / 등락 1위 ${hiL['종목명']} ${hiL['등락률']}%` : '')));
      }
      const rkBox = mkRank(n);
      if (rkBox) {
        const hint = el('div', 'hint', '▾ 종목 순위 보기');
        add(blk, hint, rkBox);
        blk.classList.add('tap');
        blk.onclick = () => { rkBox.hidden = !rkBox.hidden; hint.textContent = rkBox.hidden ? '▾ 종목 순위 보기' : '▴ 접기'; };
      }
      return blk;
    };
    const list = el('div', 'card');
    add(list, mkAxis());
    liveNames.forEach(n => list.appendChild(mkBlk(n)));
    add(c1, list);
    if (goneNames.length) {
      const det = el('details'); add(det, el('summary', null, `${tLabel(lastT)} 에 없는 카드 ${goneNames.length}개 (테마 종료 · 이름 바뀜 · 오독)`));
      const list4 = el('div', 'card'); add(list4, mkAxis());
      goneNames.forEach(n => list4.appendChild(mkBlk(n)));
      add(det, list4); add(c1, det);
    }
  }

  const inq = arr(d.inq).slice().sort((a, b) => (num(a['조회순위']) ?? 99) - (num(b['조회순위']) ?? 99));
  add(c2, labelWith('조회순위 해답지' + (has(d.inqTime) ? ` (${tLabel(d.inqTime)} 키움 실시간 조회 20위)` : ''), 'live.inq'));
  if (!inq.length) { add(c2, el('div', 'empty', '이날은 조회순위 수집 전 (9/11 부터)')); }
  else {
    const outs = inq.filter(r => !has(r['거래대금순위']));
    add(c2, el('div', 'status', `20위 중 거래대금 100위 밖 ${outs.length}개` + (outs.length ? ' : ' + outs.map(r => r['종목명']).join(' · ') : '')));
    /* 9/23 `조회순위섹터` (사용자 제안 → 추천안 셋 채택) : 종목명 앞에 같은 회차 티마 카드의 섹터명. stockFlow 에서 inqTime 회차 행을 종목코드로 맞춘다 — JSON·pages-export 변경 0.
       ① 같은 회차 카드만 (빈칸 = 그 회차 캡처된 카드(카드당 4종목)에 없는 종목, 뜻이 하나) ② 두 카드에 들면 '·' 로 둘 다 (9/17 한화시스템 조선/기자재·방산 — 5일 1건, 고르는 규칙 없음) ③ 없으면 아무것도 안 붙임.
       화면 표시일 뿐 판정에 안 쓴다. 15:20 회차 실측 9/17~23 대응 10~14/20 */
    const iqSec = {};   // 종목코드 → 섹터명 목록
    arr(d.stockFlow).forEach(s => {
      if (String(s['시각']) !== String(d.inqTime) || !has(s['섹터명'])) return;
      const c = String(s['종목코드'] || '').trim(); if (!c) return;
      if (!iqSec[c]) iqSec[c] = [];
      if (!iqSec[c].includes(s['섹터명'])) iqSec[c].push(s['섹터명']);
    });
    const mkRow = r => {
      const row = el('div', 'row');
      const rk = num(r['거래대금순위']);
      const IQ_OUT = 35;   /* 9/17 사용자 결정 ① : 대금 35위 밖은 종목명만 취소선. 35 = 강의 당일주도주 검색식 "거래대금 순위 상위 35"(대조표 C4). 화면 표시일 뿐 판정에 안 쓴다 */
      const out35 = rk === null || rk > IQ_OUT;
      const secs = iqSec[String(r['코드'])];   /* 9/23 조회순위섹터 : 이름 앞 섹터명, 없으면 아무것도 안 붙임 (③) */
      const nm = el('span', 'iq-nm'); add(nm, el('span', 'sub', r['조회순위'] + '. '), secs ? el('span', 'iq-sec', secs.join('·') + ' ') : null, el('span', 'iq-name' + (out35 ? ' iq-out' : ''), r['종목명']));
      if (r['구분'] === 'ETF') add(nm, el('span', 'muted', ' ETF'));
      add(nm, kMark(d, r['코드']));   // (k) 9/15 저녁
      if ((num(r['조회순위']) ?? 99) <= 5 && (rk === null || rk > 20)) add(nm, el('span', 'flag', '선행'));
      const eok = num(r['거래대금억']);   /* 9/17 사용자 결정 ② : '대금' 글자 빼고 순위 + 금액(억). 뜻은 도움말 ? 에 */
      /* 9/17 사용자 결정 ② (2차) : 순위는 칩, 금액은 본문 글자 — 'n위 n억' 숫자 두 개가 붙어 한 덩어리로 읽히던 것을 가름 */
      const rt = el('span', 'iq-rt'); add(rt, pctEl(r['등락률']), el('span', 'iq-rk', rk === null ? '100위 밖' : `${rk}위`));
      if (rk !== null && eok !== null) add(rt, el('span', 'sub', `${eok.toLocaleString()}억`));
      return add(row, nm, rt);
    };
    const list2 = el('div', 'list');
    inq.slice(0, 10).forEach(r => list2.appendChild(mkRow(r)));
    add(c2, list2);
    if (inq.length > 10) {
      const det = el('details'); add(det, el('summary', null, `11~${inq.length}위 보기`));
      const list3 = el('div', 'list'); inq.slice(10).forEach(r => list3.appendChild(mkRow(r)));
      add(det, list3); add(c2, det);
    }
    add(c2, el('div', 'status', '선행 = 조회 5위 안 + 거래대금 20위 밖 (인계문서 4절 정의). 관찰 표시일 뿐 판정에 안 쓴다'));
  }
  add(box, el('div', 'foot', `관찰 전용 · 생성 ${d.generated || '—'}`));
}

/* ── 시계열 탭 (9/14 밤, 8-3 ④ · 인계문서 8-0★ D) ─────────────────────────
   강의 네 기준(티마 대장 / 당일주도주_강의 / 120일 신고가_강의 / 실시간 조회순위)을 시각 × 종목 격자로.
   값은 JSON 그대로(sectorFlow·condFlow·condTimes·inqFlow, pages-export v1.5). 화면이 하는 계산은 "그 회차에 몇 기준에 걸렸나" 를 세는 것뿐.
   조회순위는 회차마다 찍은 1분 스냅샷(인계 6-18 ④) — 회차 사이에 잠깐 오른 종목은 안 잡힌다. 판정에 안 쓴다. */
function renderSeries(d) {
  const box = document.getElementById('series'); box.innerHTML = '';
  const ymd = String(d.date || '');
  const g = d.gate1 || {};
  const wd = has(g['요일']) ? g['요일'] : WD[new Date(+ymd.slice(0, 4), +ymd.slice(4, 6) - 1, +ymd.slice(6, 8)).getDay()];
  add(box, nowLine(d));
  const h = el('h1', null, `${+ymd.slice(4, 6)}/${+ymd.slice(6, 8)} (${wd}) 강의 네 기준 격자`); h.style.fontSize = '18px'; h.style.margin = '0'; add(box, h);
  const serLast = [...new Set([...arr(d.condTimes).map(String), ...arr(d.inqFlow).map(r => String(r['시각'])), ...arr(d.sectorFlow).map(r => String(r['시각']))])].sort().pop() || '';   // 9/15 저녁 : 저녁 회차 포함 마지막 시각
  add(box, el('div', 'status', (d.stage === 'live' ? (has(d.at) ? `${tLabel(d.at)} 까지 · 판정 전 · ` : '수집 전 · ') : (serLast > '1530' ? `${tLabel(serLast)} 까지 (16:00 부터 애프터마켓, 점선 오른쪽) · ` : '15:20 까지 · ')) + '시각 × 종목, 칸 = 그 회차에 걸려 있었나 · 관찰 전용, 판정에 안 쓴다'));

  // 네 기준 → M[기준][시각][종목명] = 값. 티마 대장은 sectorFlow 의 거래대금1위(개별이슈 카드 제외, 장중 탭과 같음), 이름은 OCR 글자라 코드 없이 종목명으로 맞춘다
  const KEYS = ['tima', 'lead', 'high', 'inq'];
  const KN = { tima: '티마 대장', lead: '당일주도주', high: '120일 신고가', inq: '조회순위' };
  const M = { tima: {}, lead: {}, high: {}, inq: {} };
  const put = (k, t, nm, v) => { if (!has(nm)) return; const m = (M[k][t] = M[k][t] || {}); m[nm] = v; };
  arr(d.sectorFlow).forEach(r => {
    if (r['섹터명'] === '개별이슈') return;
    const nm = r['거래대금1위']; if (!has(nm)) return;
    const t = String(r['시각']); const m = (M.tima[t] = M.tima[t] || {}); (m[nm] = m[nm] || []).push(r['섹터명']);
  });
  arr(d.condFlow).forEach(r => {
    const t = String(r['시각']);
    if (r['조건식'] === '당일주도주_강의') put('lead', t, r['종목명'], r);
    else if (r['조건식'] === '120일 신고가_강의') put('high', t, r['종목명'], r);
  });
  arr(d.inqFlow).forEach(r => put('inq', String(r['시각']), r['종목명'], r));
  // (k) 9/15 저녁 : 격자 행은 이름뿐이라 종목명 → 코드 를 cond · inq · 티마 종목 행에서 모은다. 티마 대장(OCR 이름)만 걸린 종목은 코드가 없어 표시 없음
  const NC = {};
  const putNC = (nm, cd) => { if (has(nm) && has(cd) && !NC[nm]) NC[nm] = cd; };
  arr(d.condFlow).forEach(r => putNC(r['종목명'], r['코드'])); arr(d.inqFlow).forEach(r => putNC(r['종목명'], r['코드']));
  arr(d.stockFlow).forEach(r => putNC(r['종목명'], r['종목코드'])); arr(d.stocks).forEach(s => arr(s['종목']).forEach(r => putNC(r['종목명'], r['종목코드'])));
  const condT = [...new Set(arr(d.condTimes).map(String))].sort();
  const T = {
    tima: [...new Set(Object.keys(M.tima))].sort(),
    lead: condT, high: condT,
    inq: [...new Set(Object.keys(M.inq))].sort()
  };
  const hit = (k, t, nm) => !!(M[k][t] && M[k][t][nm]);

  // 격자 한 장 : times 열 × names 행, cell(nm, t) → {text, cls, title} 또는 null(빈칸)
  const mkGrid = (times, names, cell, head) => {
    const wrapEl = el('div', 'sg'); wrapEl.setAttribute('data-noswipe', '');
    const nameW = 96;
    const tb = el('table'); tb.style.minWidth = (nameW + 34 * times.length) + 'px';
    const cg = el('colgroup'); const c0 = el('col'); c0.style.width = nameW + 'px'; cg.appendChild(c0);
    times.forEach(() => { const c = el('col'); c.style.width = '34px'; cg.appendChild(c); }); tb.appendChild(cg);
    const hr = el('tr'); hr.appendChild(el('th', null, head || '')); times.forEach((t, i) => hr.appendChild(el('th', isAft1(times, i) ? 'aft1' : null, tShort(t)))); tb.appendChild(hr);
    names.forEach(nm => {
      const tr = el('tr'); const td0 = el('td', null, nm); td0.title = nm; add(td0, kMark(d, NC[nm])); tr.appendChild(td0);   // (k) 9/15 저녁
      times.forEach((t, i) => { const c = cell(nm, t); const td = el('td', ((c && c.cls) ? c.cls : '') + (isAft1(times, i) ? ' aft1' : ''), c ? c.text : ''); if (c && c.title) td.title = c.title; tr.appendChild(td); });   // 9/15 저녁 : 16:00 앞 점선
      tb.appendChild(tr);
    });
    add(wrapEl, tb); return wrapEl;
  };
  // 행 순서 : 마지막 회차에 있는 것 먼저 → 걸린 회차 많은 순 → 처음 걸린 시각 이른 순
  const orderOf = (k, times) => {
    const names = [...new Set(times.flatMap(t => Object.keys(M[k][t] || {})))];
    const lastT = times[times.length - 1];
    const hits = nm => times.filter(t => hit(k, t, nm)).length;
    const first = nm => times.findIndex(t => hit(k, t, nm));
    return names.sort((a, b) => {
      const la = hit(k, lastT, a) ? 1 : 0, lb = hit(k, lastT, b) ? 1 : 0; if (la !== lb) return lb - la;
      const ha = hits(a), hb = hits(b); if (ha !== hb) return hb - ha;
      return first(a) - first(b);
    });
  };
  const cols = el('div', 'cols'); const c1 = el('div'); const c2 = el('div'); add(box, add(cols, c1, c2));

  // 1) 네 기준 겹침 — 칸 = 그 회차에 걸린 기준 수. 2개 이상 걸린 적 있는 종목만
  const allT = [...new Set(KEYS.flatMap(k => T[k]))].sort();
  const crit = (nm, t) => KEYS.filter(k => hit(k, t, nm));
  const allNames = [...new Set(KEYS.flatMap(k => Object.keys(M[k]).flatMap(t => Object.keys(M[k][t]))))];
  const maxC = nm => Math.max(0, ...allT.map(t => crit(nm, t).length));
  const lastAll = allT[allT.length - 1];
  const firstT2 = nm => allT.find(t => crit(nm, t).length >= 2);
  const ovNames = allNames.filter(nm => maxC(nm) >= 2).sort((a, b) => {
    const la = crit(a, lastAll).length, lb = crit(b, lastAll).length; if (la !== lb) return lb - la;
    const ma = maxC(a), mb = maxC(b); if (ma !== mb) return mb - ma;
    return allT.indexOf(firstT2(a)) - allT.indexOf(firstT2(b));
  });
  add(c1, labelWith('네 기준 겹침 (칸 = 그 회차에 걸린 기준 수)', 'series.overlap'));
  const ovCard = el('div', 'card');
  if (!allT.length) add(ovCard, el('div', 'empty', '이날은 시계열 기록 없음'));
  else {
    const lead = el('div', 'sg-lead');
    const nowHit = ovNames.filter(nm => crit(nm, lastAll).length >= 2);
    add(lead, el('span', 'sub', `${tLabel(lastAll)} 에 2개 이상 : `));
    if (!nowHit.length) add(lead, el('span', 'muted', '없음'));
    nowHit.forEach((nm, i) => { if (i) lead.appendChild(document.createTextNode(' · ')); add(lead, el('b', null, nm), el('span', null, ` ${crit(nm, lastAll).length}개 (${tLabel(firstT2(nm))} 부터)`)); });
    add(ovCard, lead);
    if (!ovNames.length) add(ovCard, el('div', 'empty', '2개 이상 겹친 종목 없음'));
    else add(ovCard, mkGrid(allT, ovNames, (nm, t) => { const c = crit(nm, t); return c.length ? { text: String(c.length), cls: 'l' + c.length, title: c.map(k => KN[k]).join(' · ') } : null; }, '종목'));
    add(ovCard, el('div', 'sg-leg', '기준 = 티마 대장 · 당일주도주_강의 · 120일 신고가_강의 · 조회순위 20위. 4 = 넷 다 · 빈칸 = 하나도 없음 (그 회차에 기록이 없는 기준은 0 으로 센다). 몇 개에 걸렸는가는 관찰이지 판정 조건이 아니다'));
  }
  add(c1, ovCard);

  // 2) 티마 대장 — 카드(섹터)마다 누적 거래대금 1위
  add(c1, labelWith('티마 대장 (카드별 누적 거래대금 1위)', 'series.tima'));
  const timaCard = el('div', 'card');
  if (!T.tima.length) add(timaCard, el('div', 'empty', '티마 기록 없음'));
  else {
    add(timaCard, mkGrid(T.tima, orderOf('tima', T.tima), (nm, t) => { const s = M.tima[t] && M.tima[t][nm]; return s ? { text: '●' + (s.length > 1 ? s.length : ''), cls: 'dot', title: s.join(' · ') } : null; }, '종목'));
    add(timaCard, el('div', 'sg-leg', '● = 그 회차 티마 카드 한 장의 대장 (●2 = 카드 두 장) · 개별이슈 카드 제외 · 이름은 OCR 글자 그대로'));
  }
  add(c1, timaCard);

  // 3) 당일주도주_강의 / 4) 120일 신고가_강의 — 영웅문 조건검색 (칸 = 그 회차 등락률, 반올림)
  const pctCell = k => (nm, t) => {
    const r = M[k][t] && M[k][t][nm]; if (!r) return null;
    const v = num(r['등락률']); const rv = v === null ? null : Math.round(v);
    return { text: rv === null ? '●' : (rv > 0 ? '+' : '') + rv, cls: v > 0 ? 'up' : (v < 0 ? 'down' : null), title: `${r['등락률']}%` + (has(r['현재가']) ? ` · ${r['현재가']}원` : '') };
  };
  /* 9/19 `조건검색본표` : 본표 = 기준 회차에 걸린 종목만 — 기준 회차 = 15:20 이하 마지막 회차(마감이면 15:20, 장중이면 지금까지 마지막). 판정이 당일주도주포함·120신고가포함 칸에 적는 것과 같은 회차라 새 숫자 없음 (대조표 C4·C5 — 검색식은 3시 종베 때 겹쳐 보는 것).
     그 전(9/14 밤~)은 한 회차라도 걸리면 줄이 생겨 오전에 한 번 걸린 종목이 다 올라왔다 (사용자 지적, 안 A 결정). 빠진 종목은 접힘 하나. 저녁 회차(점선 오른쪽)는 기준에서 뺀다 — 관찰만 */
  const condBase = condT.filter(t => t <= '1520').pop() || condT[condT.length - 1];
  const condGrid = (k, title, parent, judgeCol) => {
    add(parent, labelWith(title, 'series.' + k));
    const card = el('div', 'card');
    if (!condT.length) add(card, el('div', 'empty', '조건검색 기록 없음 (9/14 부터)'));
    else {
      const names = orderOf(k, condT); const bl = tLabel(condBase);
      const main = names.filter(nm => hit(k, condBase, nm)), rest = names.filter(nm => !hit(k, condBase, nm));
      if (!names.length) add(card, el('div', 'empty', '걸린 종목 없음'));
      else if (main.length) add(card, mkGrid(condT, main, pctCell(k), '종목'));
      else add(card, el('div', 'empty', `${bl} 에 걸린 종목 없음`));
      if (rest.length) {
        const det = el('details'); add(det, el('summary', null, `빠진 종목 ${rest.length}개 보기 (${bl} 엔 안 걸림)`));
        add(det, mkGrid(condT, rest, pctCell(k), '종목')); add(card, det);
      }
      add(card, el('div', 'sg-leg', `칸 = 그 회차에 검색식에 걸림, 숫자는 등락률(반올림) · 빈칸 = 안 걸림 · 영웅문 조건식 그대로 · 본표 = ${bl} 에 걸린 종목(판정의 ${judgeCol} 칸과 같은 회차), 화면 기준일 뿐 판정에 안 씀`));
    }
    add(parent, card);
  };
  condGrid('lead', '당일주도주_강의 (조건검색)', c1, '당일주도주포함');
  condGrid('high', '120일 신고가_강의 (조건검색)', c2, '120신고가포함');

  // 5) 실시간 조회순위 — 1시간마다 찍은 1분 스냅샷 (6-18 ④)
  add(c2, labelWith('조회순위 (키움 실시간 조회 20위)', 'series.inq'));
  const inqCard = el('div', 'card');
  if (!T.inq.length) add(inqCard, el('div', 'empty', '조회순위 기록 없음 (9/11 부터)'));
  else {
    add(inqCard, el('div', 'note', '1시간마다 찍은 1분 스냅샷 — 회차 사이에 잠깐 치고 올라온 종목은 여기 안 잡힌다. 오래 걸려 있는 종목을 보는 표다'));
    const lastI = T.inq[T.inq.length - 1];
    const rk = (nm, t) => { const r = M.inq[t] && M.inq[t][nm]; return r ? (num(r['조회순위']) ?? 99) : 99; };
    const best = nm => Math.min(...T.inq.map(t => rk(nm, t)));
    const allI = [...new Set(T.inq.flatMap(t => Object.keys(M.inq[t] || {})))].sort((a, b) => {
      const la = rk(a, lastI), lb = rk(b, lastI); if (la !== lb) return la - lb;
      const ha = T.inq.filter(t => hit('inq', t, a)).length, hb = T.inq.filter(t => hit('inq', t, b)).length; if (ha !== hb) return hb - ha;
      return best(a) - best(b);
    });
    const inqCell = (nm, t) => { const r = M.inq[t] && M.inq[t][nm]; if (!r) return null; const v = num(r['조회순위']); return { text: r['조회순위'], cls: v !== null && v <= 5 ? 'top' : null, title: `${r['조회순위']}위 · ${r['등락률']}%` }; };
    /* 9/19 `조회순위본표` : 본표 = 5위 안(굵은 칸)에 INQ_MIN 회 이상 든 종목만 (대조표 D7 "5위 이내 꾸준히" 를 회차로 센 것 — 화면 표시 값, 판정에 안 씀).
       그 전(9/14 밤~)은 "10위 안 1회" 가 본표, "11~20위만" 접힘이었는데 한 번 튀어나온 종목이 다 올라와 표 목적(오래 걸려 있는 종목)과 안 맞았다 (사용자 지적, 추천 2회 결정). 접힘은 하나로 합침 */
    const INQ_TOP = 5, INQ_MIN = 2;
    const topN = nm => T.inq.filter(t => rk(nm, t) <= INQ_TOP).length;
    const main = allI.filter(nm => topN(nm) >= INQ_MIN), rest = allI.filter(nm => topN(nm) < INQ_MIN);
    if (main.length) add(inqCard, mkGrid(T.inq, main, inqCell, '종목'));
    else add(inqCard, el('div', 'empty', `${INQ_TOP}위 안 ${INQ_MIN}회 이상 든 종목 아직 없음`));
    if (rest.length) {
      const det = el('details'); add(det, el('summary', null, `나머지 ${rest.length}개 보기 (${INQ_TOP}위 안 ${INQ_MIN}회 미만 · 11~20위만)`));
      add(det, mkGrid(T.inq, rest, inqCell, '종목')); add(inqCard, det);
    }
    add(inqCard, el('div', 'sg-leg', `숫자 = 그 회차 조회순위 (굵게 = ${INQ_TOP}위 안) · 빈칸 = 20위 밖 · 8시대 회차는 장 전 · 본표 = ${INQ_TOP}위 안 ${INQ_MIN}회 이상 (D7 "5위 이내 꾸준히", 화면 기준일 뿐 판정에 안 씀)`));
  }
  add(c2, inqCard);
  add(box, el('div', 'foot', `관찰 전용 — 기준 넷 다 강의 원문(대조표) 그대로, 겹침 수는 판정 조건이 아님 · 생성 ${d.generated || '—'}`));
}

/* ── 검증 탭 (9/16 밤 `검증탭`, 인계문서 8-6 ⓐ~ⓓ · 8-4 "검증 탭 골격 앞당김") ─────────────────────
   data/verify.json (pages-export.ps1 v2.3 — result_log 전 행·전 칸 그대로) 을 그린다. 표본 수·적중률·평균·중앙값·최악은 전부 여기서 센다.
   ⓐ 표본 1 = 후보 섹터 1개, 채점은 그 섹터 대장(역할 '대장') 1종목. 관망 후보도 표본에 넣되 [관망] 표시. 2등·3등은 JSON 에만(참고 기록).
   ⓑ 적중률 = 대장 '목표4%_10시' Y ÷ 채점된 대장 수(D+1 미도래는 '채점 대기' 로 따로 셈). 피뢰침은 별도 계열 — result_log 에 채점 칸이 없어 자리만.
   ⓒ 후보 · 관문3 제외 · 배경 세 줄 한 표. 표본 30 은 후보 줄만, 나머지 줄은 '참고'.
      9/24 사용자 결정 (`검증탭공부`) : 관문2 제외 · 관문4 제외 줄 삭제 — close-judge 는 그 이름을 안 내서 늘 0 이었다.
      관문2(모멘텀 0 이하) 탈락은 판정 이름이 '배경', 관문4 탈락 '대장없음' 은 카드 4종목 금액이 다 빈 자료 빈칸이라 채점할 대장이 없다.
      9/24 같은 세션 : 검증 탭 맨 위에 '관문 순서' 표 — 설계할 때 번호(관문1 시장 · 2 돈 · 3 이따) ↔ 15:20 판정이 실제로 묻는 순서(시장 표시만 → 이따 → 돈). 사용자가 채팅에서 고른 표 글자 그대로, 늘 펼침(익숙해지면 빼거나 접는다). 설명만, 판정·채점 무관.
      같은 날 사용자 결정으로 대장(관문4) 줄을 뺐다 — 대장없음은 채점 종목이 없어 검증 탭 밖(무결성 쪽 일). 대장 = 채점 종목이라는 설명은 ? 도움말 '줄'·표본 목록에 있다.
      같은 날 : 목록 종목명 옆 (k) = KRX 전용(NXT 불가) — verify.json krxOnly(pages-export v2.8), 장중 탭과 같은 표시.
      같은 날 : 표와 목록 합침(사용자 결정 추천안) — 줄을 누르면 표 아래 그 줄 대장 목록(vfBlock), 처음엔 후보. 옛 '표본 목록' 구역 · 접힌 목록 · verify.list 도움말 없앰.
      같은 날 : 목록 한 줄을 늘 두 줄로(사용자 결정 B안) — 1줄 날짜 · 섹터 · 대장(k) · 관망, 2줄 ✓✕⏳ 맨 앞(세로 한 줄) + 10시 고가 · 저가.
   ⓓ 적중률 옆에 D1_10시고가% 평균 · 중앙값 · 최악(D1_10시저가% 최저, 날짜·종목). 채점 5개 미만이면 '목록만'.
   일자 >= alFrom(20260917) 만 표본(거래대금 KRX+NXT 통합 자). 그 전 9/10~9/16 은 "KRX 자 · 참고 (표본 아님)" 띠 아래 같은 표·목록 (9/16 밤 사용자 결정). 판정·채점 코드·임계값 무관.
   9/24 `실전채점` (사용자 결정 B안 — 추천대로) : 표본 · 적중률 표 아래 '실전 (기록)' 작은 표 + 목록 한 줄 끝 토막 '· 실전 ✓ 저녁 16:00 KRX'.
      자료 = verify.json 'real'(pages-export v2.9 — data\result_real.csv, real-score.ps1 v1.0). 실전 = D 저녁(NXT 15:40~ · KRX 16:00~, 어느 시장이든) ·
      D+1 NXT 프리 08:00~08:49 · D+1 KRX 09:00~10:00 중 먼저 +4%(next-day 와 같은 식). 채점 원본 아님 — 표본 수 · 적중률 · 전환 조건은 위 표 그대로.
      지금 · 실전은 두 채점이 다 끝난 같은 행만 센다. 칩 '15:40 봉만'(NXT 단일가가 섞인 15:40 봉 한 분에서만 닿음) · '한 시장만'(NXT 되는 종목이 16:00 뒤 한 시장에서만 닿음 —
      자동매도 16:00 주문은 SOR 이 한 시장에만 건다). real 이 없으면(옛 verify.json) 구역·토막을 안 그린다. */
const VF_LINES = [['후보', '후보'], ['관문3제외', '관문3 제외'], ['배경', '배경']];
let VERIFY_SUB = '';
let VF_REAL = {};   // 9/24 : 일자|섹터|종목코드 → 실전 기록 행 (renderVerify 가 채운다)
function vfRealKey(r) { return `${r['일자']}|${r['섹터']}|${r['종목코드']}`; }
function vfRealDone(r) { return (r['목표4%_10시'] === 'Y' || r['목표4%_10시'] === 'N') && (r['목표4%_실전'] === 'Y' || r['목표4%_실전'] === 'N'); }
function vfRealTable(rrows) {
  const wrap = el('div', 'vf-tbl'); wrap.setAttribute('data-noswipe', '');
  const t = el('table'); const th = el('tr');
  ['줄', '둘 다 끝난 수', '지금', '실전', '먼저 닿은 창'].forEach(h => add(th, el('th', null, h)));
  add(t, th);
  VF_LINES.forEach(([key, label], i) => {
    const rows = rrows.filter(r => r['판정'] === key); const done = rows.filter(vfRealDone); const wait = rows.length - done.length;
    const tr = el('tr', i === 0 ? 'main' : null);
    const c0 = el('td', null, label); if (i > 0) add(c0, el('span', 'ref', '참고'));
    add(tr, c0, el('td', null, String(done.length) + (wait ? ` (대기 ${wait})` : '')));
    if (!done.length) add(tr, el('td', null, '—'), el('td', null, '—'), el('td', null, '—'));
    else {
      const now = done.filter(r => r['목표4%_10시'] === 'Y').length; const real = done.filter(r => r['목표4%_실전'] === 'Y');
      const cnt = w => real.filter(r => r['첫도달창'] === w).length;
      add(tr, el('td', null, `${now}/${done.length}`), el('td', null, `${real.length}/${done.length}`),
        el('td', 'w', real.length ? `저녁 ${cnt('저녁')} · 프리 ${cnt('프리')} · 10시 ${cnt('10시')}` : '—'));
    }
    add(t, tr);
  });

function renderHelp(tab) {
  const box = document.getElementById('help'); box.innerHTML = '';
  const h = HELP[tab]; if (!h) { box.hidden = true; return; }
  const head = el('div', 'help-h'); const x = el('button', null, '닫기'); x.onclick = () => toggleHelp(false);
  add(head, el('b', null, h.title), x); add(box, head);
  if (h.lead) add(box, el('div', 'help-lead', h.lead));
  h.groups.forEach(([g, list]) => { add(box, el('div', 'help-g', g)); helpRows(box, list); });
  HELP_COMMON.forEach(([g, list]) => { const det = el('details'); add(det, el('summary', null, g)); helpRows(det, list); add(box, det); });
  add(box, el('div', 'help-foot', HELP_FOOT));
  box.hidden = false;
}
function toggleHelp(on) {
  HELP_OPEN = on === undefined ? !HELP_OPEN : !!on;
  document.getElementById('helpBtn').setAttribute('aria-expanded', HELP_OPEN ? 'true' : 'false');
  if (HELP_OPEN) renderHelp(CUR); else document.getElementById('help').hidden = true;
}
document.getElementById('helpBtn').onclick = () => toggleHelp();

let DATES = [];
let CUR = 'close';
const HERO = { live: ['장중', '매시 07분 갱신 · 저녁 20:12 까지'], close: ['마감', '15:20 KRX 기준 · NXT 제외'], series: ['시계열', '강의 네 기준 · 1시간 격자 · 저녁 20:02 까지'], verify: ['검증', '표본 0 / 30 · 통합 자 9/17 부터'], review: ['복기', ''] };
// 9/16 합산전환 : JSON v10 amtBasis '통합'(9/17 부터, 거래대금 = KRX+NXT 통합 · 가격 = KRX) / 'KRX'(9/16 까지). 마감 탭 부제만 이 값으로 (사용자 승인 문구)
let AMT_BASIS = 'KRX';
function closeSub() { return AMT_BASIS === '통합' ? '15:20 · 거래대금 KRX+NXT 통합 · 가격 KRX' : HERO.close[1]; }
function setHero(tab) {
  document.getElementById('heroTitle').textContent = HERO[tab][0];
  document.getElementById('heroSub').textContent = tab === 'review' ? REVIEW_SUB : (tab === 'verify' && VERIFY_SUB ? VERIFY_SUB : (tab === 'close' ? closeSub() : HERO[tab][1]));
  document.getElementById('heroQ').hidden = tab !== 'review';
}
function renderDatebar(cur) {
  const bar = document.getElementById('datebar'); bar.innerHTML = '';
  if (!DATES.length) { bar.hidden = true; return; }
  bar.hidden = CUR === 'review' || CUR === 'verify';   // 누적 탭에는 날짜 줄 없음 (검증 9/16 밤)
  const idx = DATES.indexOf(cur);
  const older = el('button', null, '◀'); older.setAttribute('aria-label', '이전 거래일');
  const newer = el('button', null, '▶'); newer.setAttribute('aria-label', '다음 거래일');
  older.disabled = idx < 0 || idx >= DATES.length - 1;
  newer.disabled = idx <= 0;
  older.onclick = () => loadDate(DATES[idx + 1], DATES);
  newer.onclick = () => loadDate(DATES[idx - 1], DATES);
  const sel = el('select'); sel.setAttribute('aria-label', '날짜 선택');
  DATES.forEach((x, i) => {
    const wdx = WD[new Date(+x.slice(0, 4), +x.slice(4, 6) - 1, +x.slice(6, 8)).getDay()];
    const o = el('option', null, `${+x.slice(4, 6)}/${+x.slice(6, 8)} (${wdx})${i === 0 ? ' 최근' : ''}`); o.value = x; if (x === cur) o.selected = true; sel.appendChild(o);
  });
  sel.onchange = () => loadDate(sel.value, DATES);
  add(bar, older, sel, newer);
}

async function loadDate(ymd, dates) {
  let d;
  try { d = await getJson(ymd ? `data/${ymd}.json` : 'data/latest.json'); }
  catch (e) { ['close', 'live', 'series'].forEach(id => { const b = document.getElementById(id); b.innerHTML = ''; add(b, el('div', 'empty', '데이터를 못 불러왔습니다 : ' + e.message)); }); return; }
  AMT_BASIS = d.amtBasis === '통합' ? '통합' : 'KRX';   // 9/16 합산전환 (v9 이전 JSON 은 키가 없어 KRX)
  try { renderClose(d, dates); } catch (e) { add(document.getElementById('close'), el('div', 'empty', '마감 화면 오류 : ' + e.message)); }
  try { renderLive(d); } catch (e) { add(document.getElementById('live'), el('div', 'empty', '장중 화면 오류 : ' + e.message)); }
  IX_D = d; pollIndexLive(true);   /* 9/17 지수5분 : 5분 회차 파일이 더 새 것이면 지수 그림만 바꾼다 (기다리지 않는다) */
  try { renderSeries(d); } catch (e) { add(document.getElementById('series'), el('div', 'empty', '시계열 화면 오류 : ' + e.message)); }
  renderDatebar(String(d.date || ''));
  setHero(CUR);
  // 8-3 ① : 처음 열었을 때 최근 자료가 판정 전(장중) 이면 장중 탭부터. 그 뒤 탭 이동은 사용자 몫 (5분 뒤 다시 불러와도 안 바꿈)
  if (!FIRST_SHOWN) { FIRST_SHOWN = true; if (d.stage === 'live' && !ymd) switchTab('live', null); }
}
let FIRST_SHOWN = false;

const HERO_EL = document.querySelector('.hero');
const HERO_TABS = HERO_EL.querySelector('.tabs');
const STICK = document.getElementById('stick');
STICK.firstElementChild.appendChild(HERO_TABS.cloneNode(true));

const TAB_ORDER = ['live', 'close', 'series', 'verify', 'review'];
// how : 'stick' = 고정 막대에서 누름 / 'swipe' = 좌우로 밈 — 둘 다 새 탭의 처음이 막대 바로 아래에 오게
function switchTab(tab, how) {
  CUR = tab;
  document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x.dataset.tab === CUR));
  TAB_ORDER.forEach(id => { document.getElementById(id).hidden = id !== CUR; });
  setHero(CUR);
  if (HELP_OPEN) renderHelp(CUR);   // 8-3 ⑩ 도움말이 열려 있으면 새 탭 내용으로
  const bar = document.getElementById('datebar');
  if (bar.childElementCount) bar.hidden = CUR === 'review' || CUR === 'verify';
  const top = HERO_EL.offsetHeight - STICK.offsetHeight;
  if (how === 'stick' || (how === 'swipe' && window.scrollY > top)) window.scrollTo(0, top);
  syncStick();
}
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => switchTab(b.dataset.tab, b.closest('.stick') ? 'stick' : null));

// 9/13 : 터치로 좌우로 밀면 옆 탭 (왼쪽으로 밀면 다음 탭). 양 끝에서는 멈춤.
// 화면 가장자리 24px 안에서 시작한 밀기는 폰의 뒤로 가기 몫이라 무시.
// 나중에 옆으로 스크롤하는 넓은 표를 넣으면 그 요소에 data-noswipe 를 붙인다.
let SWIPE = null;
document.addEventListener('touchstart', e => {
  const t = e.touches[0];
  SWIPE = null;
  if (e.touches.length !== 1 || t.clientX < 24 || t.clientX > window.innerWidth - 24) return;
  if (e.target.closest && e.target.closest('input, select, textarea, [data-noswipe]')) return;
  SWIPE = { x: t.clientX, y: t.clientY, at: Date.now() };
}, { passive: true });
document.addEventListener('touchend', e => {
  const s = SWIPE; SWIPE = null;
  if (!s || e.touches.length) return;
  const t = e.changedTouches[0];
  const dx = t.clientX - s.x, dy = t.clientY - s.y;
  if (Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.5 || Date.now() - s.at > 800) return;
  if (String(window.getSelection ? window.getSelection() : '').trim()) return;
  const i = TAB_ORDER.indexOf(CUR) + (dx < 0 ? 1 : -1);
  if (i >= 0 && i < TAB_ORDER.length) switchTab(TAB_ORDER[i], 'swipe');
}, { passive: true });
document.addEventListener('touchcancel', () => { SWIPE = null; }, { passive: true });

function syncStick() {
  const heroH = HERO_EL.offsetHeight;
  const on = window.scrollY > 0;
  STICK.style.setProperty('--heroH', heroH + 'px');
  STICK.classList.toggle('show', on);
  STICK.classList.toggle('past', window.scrollY >= heroH - STICK.offsetHeight);   // 머리가 다 지나간 뒤에만 그림자
  STICK.setAttribute('aria-hidden', on ? 'false' : 'true');
}
window.addEventListener('scroll', syncStick, { passive: true });
window.addEventListener('resize', syncStick);
syncStick();

let LAST_LOAD = 0;
async function loadAll() {
  LAST_LOAD = Date.now();
  const bar = document.getElementById('datebar');
  const sel = bar.querySelector('select');
  // 지난 날짜를 보고 있었으면 그 날짜를 다시, 최근을 보고 있었으면 새 최근을 불러온다
  const viewing = sel && DATES.length && sel.value !== DATES[0] ? sel.value : null;
  let dates = [];
  try { dates = arr((await getJson('data/dates.json')).dates); } catch (e) { }
  DATES = dates.map(String).sort().reverse();
  loadDate(viewing && DATES.includes(viewing) ? viewing : null, DATES);
  try { renderReview(await getJson('data/review.json')); }   // 9/15 : 실자료 (pages-export v1.8). 시안은 화면의 버튼으로
  catch (e) { const b = document.getElementById('review'); b.innerHTML = ''; add(b, el('div', 'empty', '복기 자료를 못 불러왔습니다 : ' + e.message)); }
  try { renderVerify(await getJson('data/verify.json')); }   // 9/16 밤 : 검증 탭 (pages-export v2.3, result_log 누적)
  catch (e) { VF_ROWS = false; rcRefresh(); const b = document.getElementById('verify'); b.innerHTML = ''; add(b, el('div', 'empty', '검증 자료를 못 불러왔습니다 : ' + e.message)); }
}
loadAll();
// 9/13 : 홈 화면 앱(특히 아이폰)은 새로고침 버튼이 없어서, 5분 넘게 떠나 있다 돌아오면 자료를 다시 불러온다
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  if (Date.now() - LAST_LOAD > 5 * 60 * 1000) loadAll(); else pollIndexLive(true);   /* 9/17 지수5분 : 5분 안에 돌아왔으면 지수 그림만 확인 */
});
</script>
